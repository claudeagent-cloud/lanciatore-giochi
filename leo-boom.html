<style>
[hidden]{display:none !important}
:root{
  --sky1:#7cc4ff; --sky2:#bfe8ff; --bg:#bfe8ff; --ink:#24304d; --soft:#3a3f5e; --line:#5b6283;
  --viola:#3B1E6E; --oro:#F5B700; --violascuro:#24123F; --crema:#FFF7E0;
  --pixel:"Press Start 2P", ui-monospace, Menlo, monospace;
  --text:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg) linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%) no-repeat fixed;color:var(--ink);margin:0;overflow:hidden;font-family:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));touch-action:none}
#stage{position:relative;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(36,18,63,.25);background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%)}
#c{display:block;width:100%;height:100%}
.bar{width:100%;max-width:600px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:relative;z-index:6}
.bar span{font-size:12px;color:var(--soft)}

/* ===== Tema militare delle schermate (Davide, 06/11/2026: "falle più militari") =====
   mimetica verde oliva, pannelli in lamiera con le strisce di pericolo giallo-nere, scritte gialle con il contorno come l'HUD,

}
#tuto,#photo,#pausaOv{background:linear-gradient(180deg, rgba(18,22,11,.74), rgba(18,22,11,.9)), var(--m-macchia) center/cover;color:var(--m-chiaro)}

<script>// Aiuti per le mosse finali di Boom (v0.21): traiettorie, esplosioni, fungo atomico e lampo. Non è un modulo del catalogo.

AU.fuoco = {
  // posizione lungo una parabola da (x0, y0) a (tx, ty), k da 0 a 1, alta `h` px

<script>// Aiuto per i corpi disegnati apposta per Boom (più dettagliati di quelli di Corsa): righe libere, due pose complete. Non è un modulo del catalogo.
// def: { tipo, genere, nome, px, frames: [righeA, righeB], pal, faccia (in celle), mano (in celle: dove sta la mano che regge l'arma), velocita }
AU.corpoBoom = function (id, def) {
  const P = Object.assign({}, AU.PAL, def.pal || {});
  const d = Object.assign({ px: 2 }, def); delete d.pal;
  d.frames = def.frames.map(r => AU.sprite(r, P));
  AU.registra('corpo', id, d);
  return AU.reg.corpo[id];
