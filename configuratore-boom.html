aagk......\", \"......kggaaagk......\", \"......kkkkkkkk......\"];\n  const A = BASE, B = BASE.map((r, i) => i === 3 ? \"knnnnnnnyynnnnnnnnnk\" : r);\n  AU.registra('corpo', 'dirigibile', { tipo: 'boss', nome: { it: 'Dirigibile', en: 'Airship' }, px: 4, faccia: { x: 8, y: 8.5, w: 4, h: 4 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { vola: true, attacchi: ['bombe', 'missili'], vita: 1 },\n    // elica dietro la gondola e le alette di coda\n    extra(ctx, o, S) { const px = o.px || 4, f = Math.floor(S.anim * 20) % 2; ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x - 6, o.y + 3 * px, 10, 2); ctx.fillRect(o.x - 2, o.y + 2 * px, 2, 2 * px); ctx.fillStyle = f ? '#c0c4cc' : '#5a5f6c'; ctx.fillRect(o.x + 6 * px, o.y + 11 * px + 2, 8, 2); ctx.fillStyle = f ? '#5a5f6c' : '#c0c4cc'; ctx.fillRect(o.x + 6 * px + 3, o.y + 11 * px - 1, 2, 8); } });\n})();\n", "corpo/elicottero-da-combattimento": "// Elicottero da combattimento: boss in volo. La faccia sta nel vetro della cabina; il rotore gira (extra). Attacchi: bombe dall'alto e raffiche.\n(() => {\n  const P = Object.assign({}, AU.PAL, { E: '#5b6b3a', F: '#3f4b28', k: '#2b2b2b', g: '#8a8f9c', a: '#9ad7ff', y: '#e0b84a', r: '#d94040' });\n  const BASE = [\"........kkkk........\", \"..FFFFFFFkkFFFFF....\", \".FEEEEEEEEEEEaaaaE..\", \"kEEEEEEEEEEEaaaaaaE.\", \"kkkEEEEEEEEEaaaaaaEE\", \"..EEEEEEEEEEEaaaaEEE\", \"...FEEEEyyEEEEEEEEE.\", \"....FFFFFFFFFFFFFF..\", \".....kkkkkkkkkkk....\", \"....k....rr......k..\", \"...kkkkkkkkkkkkkkkk.\"];\n  const A = BASE, B = BASE.map((r, i) => i === 9 ? \"....k....yy......k..\" : r);\n  AU.registra('corpo', 'elicottero-da-combattimento', { tipo: 'boss', nome: { it: 'Elicottero da combattimento', en: 'Gunship helicopter' }, px: 4, faccia: { x: 12.5, y: 1.5, w: 6, h: 6 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { vola: true, attacchi: ['bombe', 'raffica'], vita: 1 },\n    // rotore principale che gira e rotore di coda\n    extra(ctx, o, S) { const px = o.px || 4, cx = o.x + 10 * px, y = o.y - 2, f = Math.floor(S.anim * 26) % 2; ctx.fillStyle = f ? 'rgba(220,220,230,.9)' : 'rgba(220,220,230,.35)'; ctx.fillRect(cx - 52, y, 104, 3); ctx.fillStyle = f ? 'rgba(220,220,230,.35)' : 'rgba(220,220,230,.9)'; ctx.fillRect(cx - 30, y, 60, 3); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(cx - 3, y - 4, 6, 6); ctx.fillStyle = f ? '#8a8f9c' : '#3a3d45'; ctx.fillRect(o.x - 6, o.y + 3 * px, 10, 2); ctx.fillRect(o.x - 2, o.y + 3 * px - 4, 2, 10); } });\n})();\n", "corpo/fante": "// dipende: _nemico, _elmetto\n// Fante: divisa grigia con la cartucciera, elmetto grigio. Nemico con il fucile.\nAU.corpoNemico('fante', { it: 'Fante', en: 'Rifleman' },\n  [\"........ss........\", \"......GGGGGGGG....\", \".....GGAGGGGAGG...\", \"....GGGGAGGAGGGGs.\", \"....GGGGGAAGGGGG..\", \".....GGGGGGGGGG...\", \"......GGGGGGGG....\"],\n  { G: '#6b6f7a', A: '#3a3d45' }, 'G', 'k', { velocita: 1, arma: 'fucile' });\nAU.reg.corpo.fante.extra = AU.elmetto(AU.reg.corpo.fante, '#4b5563');\n", "corpo/granatiere": "// dipende: _nemico, _elmetto\n// Granatiere: divisa rosso scuro con la borsa delle granate, basco nero. Nemico che lancia granate.\nAU.corpoNemico('granatiere', { it: 'Granatiere', en: 'Grenadier' },\n  [\"........ss........\", \"......CCCCCCCC....\", \".....CCACCCCACC...\", \"....CCCCACCACCCCs.\", \"....CCoooAACCCCC..\", \".....CCoooCCCCC...\", \"......CCCCCCCC....\"],\n  { C: '#8b2f3a', A: '#2b2b2b', o: '#8a6a3a' }, 'B', 'k', { velocita: 1, arma: 'granate' });\nAU.reg.corpo.granatiere.extra = AU.basco(AU.reg.corpo.granatiere, '#1b1b1b');\n", "corpo/incendiario": "// dipende: _nemico, _elmetto\n// Incendiario: tuta ignifuga rosso scuro con le strisce gialle, elmetto con la striscia; porta il lanciafiamme con la bombola sulla schiena (arma: lanciafiamme).\nAU.corpoNemico('incendiario', { it: 'Incendiario', en: 'Flamethrower' },\n  [\"........ss........\", \"......RRRRRRRR....\", \".....RRyyyyyyRR...\", \"....RRRRRRRRRRRRs.\", \"....RRyyyyyyyyRR..\", \".....RRRRRRRRRR...\", \"......RRRRRRRR....\"],\n  { R: '#8b2f2a', y: '#ffd166' }, 'R', 'k', { velocita: 1.05, arma: 'lanciafiamme' });\nAU.reg.corpo.incendiario.extra = AU.elmetto(AU.reg.corpo.incendiario, '#c8321f', '#ffd166');\n", "corpo/mech": "// Mech: robot da guerra a due gambe con la cabina in cima, dove sta la faccia, e il cannone sul braccio. Attacchi: raffiche, laser e salto con l'onda d'urto.\n(() => {\n  const P = Object.assign({}, AU.PAL, { g: '#8a8f9c', G: '#5a5f6c', k: '#2b2b2b', a: '#9ad7ff', y: '#e0b84a', r: '#d94040', E: '#5b6b3a' });\n  const CORPO = [\"......kkkkkkkk......\", \".....kaaaaaaaak.....\", \".....kaaaaaaaak.....\", \".....kkkkkkkkkk.....\", \"..kkGGGGGGGGGGGGkk..\", \".kGGGggggggggggGGGkk\", \"kGGGGgyyggggggGGGGkk\", \"kGGGGgggggggggGGGGkk\", \".kGGGGGGGGGGGGGGGk..\", \"..kkGGrrGGGGrrGGkk..\", \"....kGGGk..kGGGk....\"];\n  const A = CORPO.concat([\"...kGGGGk..kGGGGk...\", \"..kGGGGGk..kGGGGGk..\", \".kkkkkkkk..kkkkkkkk.\"]);\n  const B = CORPO.concat([\"....kGGGk..kGGGk....\", \"...kGGGGk..kGGGGk...\", \"..kkkkkkk..kkkkkkk..\"]);\n  AU.registra('corpo', 'mech', { tipo: 'boss', nome: { it: 'Mech', en: 'Mech' }, px: 4, faccia: { x: 7, y: 0.5, w: 6, h: 6 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { attacchi: ['raffica', 'laser', 'salto'], vita: 1.1 },\n    // luci che lampeggiano e fumo dalle spalle\n    extra(ctx, o, S) { const px = o.px || 4; ctx.fillStyle = Math.floor(S.anim * 6) % 2 ? '#ff5c5c' : '#7a2020'; ctx.fillRect(o.x + 6 * px, o.y + 9 * px + 1, 6, 6); ctx.fillRect(o.x + 12 * px, o.y + 9 * px + 1, 6, 6); ctx.fillStyle = 'rgba(120,120,130,.5)'; for (let i = 0; i < 2; i++) { const k = (S.anim * 1.2 + i * 0.5) % 1; ctx.beginPath(); ctx.arc(o.x + 2 * px - k * 8, o.y + 4 * px - k * 22, 3 + k * 4, 0, 7); ctx.fill(); } } });\n})();\n", "corpo/mitragliere": "// dipende: _nemico, _elmetto\n// Mitragliere: giubbotto pesante grigio-blu con le piastre, cinghie delle munizioni incrociate, elmetto. Spara raffiche di tre (arma: mitra).\nAU.corpoNemico('mitragliere', { it: 'Mitragliere', en: 'Gunner' },\n  [\"........ss........\", \"......BBBBBBBB....\", \".....BBABBBBABB...\", \"....BBBBABBABBBBs.\", \"....BBBBBAABBBBB..\", \".....BBBABBABBB...\", \"......BBBBBBBB....\"],\n  { B: '#3a4a5e', A: '#d9a93b' }, 'B', 'k', { velocita: 1, arma: 'mitra' });\nAU.reg.corpo.mitragliere.extra = AU.elmetto(AU.reg.corpo.mitragliere, '#2f3a4a', '#1b1b1b');\n", "corpo/orsacchiotto": "// dipende: _corpoboom, _elmetto\n// Orsacchiotto di peluche: pelo marrone con la pancia chiara, cartucciera, zampe tonde, orecchie. Protagonista (senza genere) di Boom, l'unico non umano (specifica §8).\n(() => {\n  const BUSTO = [\"........MM........\", \".....MMMMMMMM.....\", \"....MMMMMMMMMM....\", \"...MMMmmmAmmmMM...\", \"...MMmmmmmAmmmMMM.\", \"...MMmmmmmmAmmMM..\", \"....MMmmmmmmmMM...\", \".....MMMMMMMM.....\", \"......MMMMMM......\"];\n  const A = BUSTO.concat([\".....MMM....MMM...\", \".....MMM....MMM...\", \"....MMM......MMM..\", \"....MMMM....MMMM..\", \"...MMMMM....MMMMM.\"]);\n  const B = BUSTO.concat([\".......MMMMMM.....\", \".......MMMMMM.....\", \".......MMM.MMM....\", \".......MMMMMMMM...\", \"......MMMM.MMMM...\"]);\n  const c = AU.corpoBoom('orsacchiotto', { tipo: 'protagonista', genere: 'n', nome: { it: 'Orsacchiotto', en: 'Teddy bear' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { M: '#a0673a', m: '#e3c08a', A: '#5b6b3a' } });\n  c.extra = AU.orecchie(c, '#a0673a', '#e3c08a');\n})();\n", "corpo/pilota": "// dipende: _corpoboom, _elmetto\n// Pilota: giacca da aviatore di pelle con il collo di pelo, sciarpa bianca, pantaloni blu, stivali, occhialoni sulla fronte. Protagonista (senza genere) di Boom.\n(() => {\n  const BUSTO = [\"........ss........\", \".....wwBBBBww.....\", \"....wBBBBBBBBw....\", \"....sBBBBBBBBB....\", \"....sBBBAABBBB.s..\", \".....BBBBBBBBBs...\", \"......BBBBBBBB....\", \"......nnnnnnnn....\", \"......jjjjjjjj....\"];\n  const A = BUSTO.concat([\".....jjj....jjj...\", \".....jjj....jjj...\", \"....jjj......jjj..\", \"....ooo......ooo..\", \"...oooo......oooo.\"]);\n  const B = BUSTO.concat([\".......jjjjjj.....\", \".......jjjjjj.....\", \".......jjj.jjj....\", \".......ooo.ooo....\", \"......oooo.oooo...\"]);\n  const c = AU.corpoBoom('pilota', { tipo: 'protagonista', genere: 'n', nome: { it: 'Pilota', en: 'Pilot' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { B: '#6b4a2a', w: '#f4f1ea', A: '#d9a93b', n: '#2b2b2b', j: '#2f4a78', o: '#3a2a1a', s: '#f2c7a5' } });\n  c.extra = AU.occhialoni(c, '#9ad7ff');\n})();\n", "corpo/ranger": "// dipende: _corpoboom, _elmetto\n// Ranger: camicia verde oliva con le maniche arrotolate, cinturone, pantaloni cachi, cappello a tesa larga. Protagonista (donna) di Boom.\n(() => {\n  const BUSTO = [\"........ss........\", \"......VVVVVVVV....\", \".....VVVVVVVVVV...\", \"....sVVVvVVvVVV...\", \"....sVVVVVVVVVV.s.\", \".....VVVVVVVVVVs..\", \"......VVVVVVVV....\", \"......yyyyyyyy....\", \"......KKKKKKKK....\"];\n  const A = BUSTO.concat([\".....KKK....KKK...\", \".....KKK....KKK...\", \"....KKK......KKK..\", \"....ooo......ooo..\", \"...oooo......oooo.\"]);\n  const B = BUSTO.concat([\".......KKKKKK.....\", \".......KKKKKK.....\", \".......KKK.KKK....\", \".......ooo.ooo....\", \"......oooo.oooo...\"]);\n  const c = AU.corpoBoom('ranger', { tipo: 'protagonista', genere: 'f', nome: { it: 'Ranger', en: 'Ranger' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { V: '#5b6b3a', v: '#3f4b28', y: '#8a6a3a', K: '#b8a060', o: '#3a2a1a', s: '#f2c7a5' } });\n  c.extra = AU.cappello(c, '#8a6a3a', '#3f4b28');\n})();\n", "corpo/recluta": "// dipende: _corpoboom, _elmetto\n// Recluta: tuta mimetica a macchie, elmetto, zaino, anfibi. Protagonista (senza genere) di Boom.\n(() => {\n  const BUSTO = [\"........ss........\", \"......EEEFEEEE....\", \".....EFEEEEEFEE...\", \"....sEEEEFEEEEE...\", \"....sEFEEEEEEFE.s.\", \".....EEEEFEEEEEs..\", \"......EFEEEEFE....\", \"......nnnnnnnn....\", \"......EEEFEEEE....\"];\n  const A = BUSTO.concat([\".....EFE....EEE...\", \".....EEE....EFE...\", \"....EEE......EEE..\", \"....ooo......ooo..\", \"...oooo......oooo.\"]);\n  const B = BUSTO.concat([\".......EEFEEE.....\", \".......EEEEEE.....\", \".......EFE.EEE....\", \".......ooo.ooo....\", \"......oooo.oooo...\"]);\n  const c = AU.corpoBoom('recluta', { tipo: 'protagonista', genere: 'n', nome: { it: 'Recluta', en: 'Recruit' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { E: '#6b7a4a', F: '#3f4b28', n: '#2b2b2b', o: '#3a2a1a', s: '#f2c7a5' } });\n  c.extra = AU.elmetto(c, '#5b6b3a', '#3f4b28');\n})();\n", "corpo/ribelle": "// dipende: _corpoboom, _elmetto\n// Ribelle: divisa verde con le cinghie, berretto verde, anfibi. Nemico con il fucile.\n(() => {\n  const BUSTO = [\"........ss........\", \"......EEEEEEEE....\", \".....EEEFFEEEEE...\", \"....sEEEFFEEEEE...\", \"....sEEEEEEEEEE.s.\", \".....EEEEEEEEEEs..\", \"......EEEEEEEE....\", \"......FFFFFFFF....\", \"......EEEEEEEE....\"];\n  const A = BUSTO.concat([\".....EEE....EEE...\", \".....EEE....EEE...\", \"....EEE......EEE..\", \"....ooo......ooo..\", \"...oooo......oooo.\"]);\n  const B = BUSTO.concat([\".......EEEEEE.....\", \".......EEEEEE.....\", \".......EEE.EEE....\", \".......ooo.ooo....\", \"......oooo.oooo...\"]);\n  const c = AU.corpoBoom('ribelle', { tipo: 'nemico', nome: { it: 'Ribelle', en: 'Rebel' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, velocita: 1, arma: 'fucile',\n    frames: [A, B], pal: { E: '#4f6b3a', F: '#2f4428', o: '#3a2a1a', s: '#f2c7a5' } });\n  c.extra = AU.elmetto(c, '#3f5a2e', '#2f4428');\n})();\n", "corpo/semovente": "// Semovente: cannone cingolato con la canna lunga; la faccia spunta dal portello. Attacchi: mine lanciate nell'arena e raffiche.\n(() => {\n  const P = Object.assign({}, AU.PAL, { E: '#6b6f4a', F: '#4a4e30', k: '#2b2b2b', g: '#8a8f9c', y: '#e0b84a', r: '#d94040' });\n  const SCAFO = [\"......kkkkkk........\", \".....kEEEEEEk.......\", \"kkkkkkEEEEEEkkkkkkkk\", \"kEEEEEEEEEEEEEEEEEEk\", \"kEEEyyEEEEEEEEEEEEEk\", \"kEEEEEEEEEEEEEEEEEEk\", \".kFFFFFFFFFFFFFFFFk.\", \"kkkkkkkkkkkkkkkkkkkk\"];\n  const A = SCAFO.concat([\"kgkkgkkgkkgkkgkkgkkk\", \"kgkkgkkgkkgkkgkkgkkk\", \"kkkkkkkkkkkkkkkkkkkk\", \".kkkkkkkkkkkkkkkkkk.\"]);\n  const B = SCAFO.concat([\"kkgkkgkkgkkgkkgkkgkk\", \"kkgkkgkkgkkgkkgkkgkk\", \"kkkkkkkkkkkkkkkkkkkk\", \".kkkkkkkkkkkkkkkkkk.\"]);\n  AU.registra('corpo', 'semovente', { tipo: 'boss', nome: { it: 'Semovente', en: 'Self-propelled gun' }, px: 4, faccia: { x: 6, y: -8.5, w: 7, h: 10 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { attacchi: ['mine', 'raffica'], vita: 1.1 },\n    // la canna lunga, alzata verso l'alto, e il fumo dello scarico\n    extra(ctx, o, S) { const px = o.px || 4; ctx.save(); ctx.translate(o.x + 15 * px, o.y + 2 * px); ctx.rotate(-0.5); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-2, -5, 46, 10); ctx.fillStyle = '#4a4e30'; ctx.fillRect(0, -3, 42, 6); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(34, -4, 8, 8); ctx.restore(); ctx.fillStyle = 'rgba(120,120,130,.55)'; for (let i = 0; i < 2; i++) { const k = (S.anim * 1.4 + i * 0.5) % 1; ctx.beginPath(); ctx.arc(o.x + 2 - k * 10, o.y + 5 * px - k * 20, 3 + k * 4, 0, 7); ctx.fill(); } } });\n})();\n", "corpo/soldatessa": "// dipende: _protagonista, _elmetto\n// Soldatessa: giubbotto cachi con la cartucciera, pantaloni verde scuro; senza bandana (tolta da Davide il 06/11/2026)\nAU.corpoProtagonista('soldatessa', 'f', { it: 'Soldatessa', en: 'Soldier (f)' },\n  [\"......ss........\", \"....KKKKKKKK....\", \"...KKAKKKKAKKK..\", \"...KKKAKKAKKKss.\", \"...KKKKAAKKKK...\", \"....KKKKKKKK....\", \".....NNNNNN.....\", \".....NNNNNN.....\"],\n  { K: '#b8a060', A: '#6b4a2a', N: '#3f4b28' }, 'N', 'k');\n", "corpo/soldato": "// dipende: _protagonista, _elmetto\n// Soldato: giubbotto verde oliva con la cartucciera, pantaloni marroni, elmetto\nAU.corpoProtagonista('soldato', 'm', { it: 'Soldato', en: 'Soldier' },\n  [\"......ss........\", \"....EEEEEEEE....\", \"...EEAEEEEAEEE..\", \"...EEEAEEAEEEss.\", \"...EEEEAAEEEE...\", \"....EEEEEEEE....\", \".....NNNNNN.....\", \".....NNNNNN.....\"],\n  { E: '#5b6b3a', A: '#d9a93b', N: '#6b4a2a' }, 'N', 'k');\nAU.reg.corpo.soldato.extra = AU.elmetto(AU.reg.corpo.soldato, '#4a5a2e');\n", "corpo/sottomarino": "// Sottomarino: scafo scuro con la torretta e il periscopio; la faccia spunta dal portello della torretta; l'acqua gli schizza intorno. Attacchi: missili dall'alto e laser dal periscopio.\n(() => {\n  const P = Object.assign({}, AU.PAL, { n: '#2b2f3a', N: '#1b1f2a', k: '#2b2b2b', g: '#8a8f9c', y: '#e0b84a', r: '#d94040', a: '#9ad7ff' });\n  const BASE = [\"........kkkkk.......\", \"........knnnk.......\", \"........knnnk.......\", \"....kkkkknnnkkkkk...\", \"..kknnnnnnnnnnnnnkk.\", \".knnnnnnnnnnnnnnnnnk\", \"knnnnnyynnnnnnnnnnnk\", \"knnnnnnnnnnnnnnnnnnk\", \".kNNNNNNNNNNNNNNNNk.\", \"..kkNNNNNNNNNNNNkk..\", \"....kkkkkkkkkkkk....\"];\n  const A = BASE, B = BASE.map((r, i) => i === 6 ? \"knnnnnrrnnnnnnnnnnnk\" : r);\n  AU.registra('corpo', 'sottomarino', { tipo: 'boss', nome: { it: 'Sottomarino', en: 'Submarine' }, px: 4, faccia: { x: 7, y: -8.5, w: 7, h: 10 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { attacchi: ['missili', 'laser'], vita: 1.2 },\n    // periscopio e schizzi d'acqua ai lati dello scafo\n    extra(ctx, o, S) { const px = o.px || 4; ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x + 12 * px, o.y - 14, 3, 16); ctx.fillRect(o.x + 12 * px, o.y - 16, 9, 4); ctx.fillStyle = Math.floor(S.anim * 5) % 2 ? '#ff5c5c' : '#9ad7ff'; ctx.fillRect(o.x + 12 * px + 6, o.y - 15, 2, 2); ctx.fillStyle = 'rgba(154,215,255,.7)'; for (let i = 0; i < 6; i++) { const k = (S.anim * 2 + i * 0.17) % 1, x = o.x + (i < 3 ? -6 - i * 5 : 20 * px + 2 + (i - 3) * 5); ctx.fillRect(x, o.y + 9 * px - k * 14, 3, 3); } } });\n})();\n", "corpo/treno-blindato": "// Treno blindato: locomotiva corazzata con la torretta e il cannone; la faccia spunta dal finestrino della cabina; le ruote girano. Attacchi: raffiche e missili.\n(() => {\n  const P = Object.assign({}, AU.PAL, { n: '#3a3d45', N: '#2b2b2b', k: '#2b2b2b', g: '#8a8f9c', a: '#9ad7ff', y: '#e0b84a', r: '#d94040', E: '#5b6b3a' });\n  const CORPO = [\".......kkkk.........\", \".....kkEEEEkk.......\", \"....kEEEEEEEEk......\", \"kkkkkkkkkkkkkkkkkkkk\", \"knnnnnnnnnnnnnnnnnnk\", \"knnaaaannnnnnnnyynnk\", \"knnaaaannnnnnnnnnnnk\", \"knnnnnnnnnnnnnnnnnnk\", \"kNNNNNNNNNNNNNNNNNNk\", \"kkkkkkkkkkkkkkkkkkkk\"];\n  const A = CORPO.concat([\".kgkk.kgkk.kgkk.kgk.\", \".kkgk.kkgk.kkgk.kkg.\", \"..kk...kk...kk...kk.\"]);\n  const B = CORPO.concat([\".kkgk.kkgk.kkgk.kkg.\", \".kgkk.kgkk.kgkk.kgk.\", \"..kk...kk...kk...kk.\"]);\n  AU.registra('corpo', 'treno-blindato', { tipo: 'boss', nome: { it: 'Treno blindato', en: 'Armoured train' }, px: 4, faccia: { x: 2, y: 3.5, w: 5, h: 6 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { attacchi: ['raffica', 'missili'], vita: 1.3 },\n    // fumo dal camino e il faro\n    extra(ctx, o, S) { const px = o.px || 4; ctx.fillStyle = 'rgba(90,90,100,.6)'; for (let i = 0; i < 3; i++) { const k = (S.anim * 1.1 + i * 0.33) % 1; ctx.beginPath(); ctx.arc(o.x + 9 * px - k * 12, o.y - 2 - k * 26, 4 + k * 6, 0, 7); ctx.fill(); } ctx.fillStyle = Math.floor(S.anim * 3) % 2 ? '#fff6c2' : '#ffd166'; ctx.fillRect(o.x + 19 * px - 2, o.y + 5 * px, 4, 4); } });\n})();\n", "corpo/ufficiale": "// dipende: _nemico, _elmetto\n// Ufficiale: divisa scura con le spalline, le medaglie e il cinturone, berretto con la visiera e il fregio; lancia granate da lontano (arma: granate).\nAU.corpoNemico('ufficiale', { it: 'Ufficiale', en: 'Officer' },\n  [\"........ss........\", \"......yNNNNNNy....\", \".....NNNNNNNNNN...\", \"....NNyyNNNNNNNNs.\", \"....NNyyNNNNNNNN..\", \".....NNNAAAANNN...\", \"......NNNNNNNN....\"],\n  { N: '#2b2f3a', y: '#F5B700', A: '#6b4a2a' }, 'N', 'k', { velocita: 0.95, arma: 'granate' });\nAU.reg.corpo.ufficiale.extra = AU.berrettoUfficiale(AU.reg.corpo.ufficiale, '#2b2f3a', '#F5B700');\n", "bonus/borraccia": "// Bonus \"Borraccia\": verde con il tappo nero (50 punti)\nAU.registra('bonus', 'borraccia', { nome: { it: 'la borraccia', en: 'the canteen' }, emoji: '🫗', px: 2, punti: 50,\n  img: AU.sprite([\".....kk.....\", \"....kkkk....\", \"...EEEEEE...\", \"..EEEEEEEE..\", \"..EEFFFFEE..\", \"..EEEEEEEE..\", \"..EEEEEEEE..\", \"...EEEEEE...\"], Object.assign({}, AU.PAL, { E: '#4f6b3a', F: '#2f4428', k: '#2b2b2b' })) });\n", "bonus/elmetto-d-oro": "// Bonus \"Elmetto d'oro\": l'elmetto dorato con la stella, il bonus più ricco (150 punti)\nAU.registra('bonus', 'elmetto-d-oro', { nome: { it: \"l'elmetto d'oro\", en: 'the golden helmet' }, emoji: '🪖', px: 2, punti: 150,\n  img: AU.sprite([\"....ZZZZZZ....\", \"..ZZZZZZZZZZ..\", \".ZZZZZZZZZZZZ.\", \".ZZZZZwZZZZZZ.\", \".ZZZZwwwZZZZZ.\", \".ZZZZZwZZZZZZ.\", \"kkkkkkkkkkkkkk\", \".kkkkkkkkkkkk.\"], Object.assign({}, AU.PAL, { Z: '#F5B700', w: '#fff6c2', k: '#2b2b2b' })) });\n", "bonus/emoji": "// Bonus emoji: il cliente scrive un'emoji e diventa un bonus da raccogliere (scheda: \"emoji:🍩\"). Disegnata grande, con l'ombra, per vedersi nei livelli di Boom.\nAU.registra('bonus', 'emoji', {\n  crea(ch) {\n    return { id: 'emoji:' + ch, nome: { it: ch, en: ch }, emoji: ch, w: 36, h: 36, punti: 50,   // più grande (Davide, 06/11/2026: \"si vedono appena\")\n      disegna(ctx, o, S, bob) { ctx.save(); ctx.font = '32px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h + 2, 10, 3, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; /* l'emoji a colori prende l'alfa del colore: con quello dell'ombra usciva al 35 % (Davide, 06/11/2026) */ ctx.fillText(ch, o.x + o.w / 2, o.y + o.h / 2 + (bob || 0)); ctx.restore(); } };\n  }\n});\n", "bonus/medaglia": "// Bonus \"Medaglia\": nastro rosso e stella d'oro (100 punti)\nAU.registra('bonus', 'medaglia', { nome: { it: 'la medaglia', en: 'the medal' }, emoji: '🎖️', px: 2, punti: 100,\n  img: AU.sprite([\"....rrrr....\", \"....rrrr....\", \"...rrrrrr...\", \"...rrrrrr...\", \"....ZZZZ....\", \"...ZZyyZZ...\", \"..ZZyyyyZZ..\", \"..ZZyyyyZZ..\", \"...ZZyyZZ...\", \"....ZZZZ....\"], Object.assign({}, AU.PAL, { r: '#d9534f', Z: '#e0b84a', y: '#fff1a8' })) });\n", "bonus/munizioni": "// Bonus \"Munizioni\": cassetta verde oliva con la striscia gialla (80 punti)\nAU.registra('bonus', 'munizioni', { nome: { it: 'le munizioni', en: 'the ammo' }, emoji: '🧰', px: 2, punti: 80,\n  img: AU.sprite([\"..kkkkkkkk..\", \".EEEEEEEEEE.\", \".EEEEEEEEEE.\", \".EEyyyyyyEE.\", \".EEEEEEEEEE.\", \".EEEEEEEEEE.\", \".kkkkkkkkkk.\"], Object.assign({}, AU.PAL, { E: '#5b6b3a', y: '#e0b84a', k: '#2b2b2b' })) });\n", "bonus/pollo-arrosto": "// Bonus \"Pollo arrosto\": il classico delle sale giochi (120 punti)\nAU.registra('bonus', 'pollo-arrosto', { nome: { it: 'il pollo arrosto', en: 'the roast chicken' }, emoji: '🍗', px: 2, punti: 120,\n  img: AU.sprite([\"....ooooo...\", \"...ooooooo..\", \"..ooooooooo.\", \"..oooqooooo.\", \"...ooooooo..\", \"....ooooo...\", \".ww...ww....\", \"ww.....ww...\"], Object.assign({}, AU.PAL, { o: '#d9843a', q: '#f2b36b', w: '#f4f1ea' })) });\n", "bonus/rancio": "// Bonus \"Rancio\": la gavetta di alluminio piena di zuppa fumante con il cucchiaio (70 punti); era \"la gavetta\", nome cambiato perché non si capiva (Davide, 06/11/2026)\nAU.registra('bonus', 'rancio', { nome: { it: 'il rancio', en: 'the chow' }, emoji: '🍲', px: 2, punti: 70,\n  img: AU.sprite([\"......g....g..\", \".....g....g...\", \"......g....g..\", \".kkkkkkkkkkkk.\", \"kssrrrrrrrrssk\", \"ksrrrrRRRrrrsk\", \"ksSSSSSSSSSSsk\", \".kkkkkkkkkkkk.\", \"...k.....k....\"], Object.assign({}, AU.PAL, { s: '#c0c4cc', S: '#8a8f9c', g: '#d8dce6', k: '#2b2b2b', r: '#c8742a', R: '#e0a040' })) });\n", "bonus/razione": "// Bonus \"Razione\": scatoletta verde oliva con l'etichetta (60 punti)\nAU.registra('bonus', 'razione', { nome: { it: 'la razione', en: 'the ration' }, emoji: '🥫', px: 2, punti: 60,\n  img: AU.sprite([\"..EEEEEEEE..\", \".EEEEEEEEEE.\", \".EEwwwwwwEE.\", \".EEwKKKKwEE.\", \".EEwwwwwwEE.\", \".EEEEEEEEEE.\", \"..EEEEEEEE..\"], Object.assign({}, AU.PAL, { E: '#5b6b3a', w: '#f4f1ea', K: '#b8a060' })) });\n", "bonus/stellette": "// Bonus \"Stellette\": la mostrina con le tre stellette d'oro su fondo rosso (90 punti)\nAU.registra('bonus', 'stellette', { nome: { it: 'le stellette', en: 'the rank stars' }, emoji: '⭐', px: 2, punti: 90,\n  img: AU.sprite([\"kkkkkkkkkkkkkk\", \"krrrrrrrrrrrrk\", \"krZrrrZrrrZrrk\", \"kZZZrZZZrZZZrk\", \"krZrrrZrrrZrrk\", \"krrrrrrrrrrrrk\", \"kkkkkkkkkkkkkk\"], Object.assign({}, AU.PAL, { r: '#c8321f', Z: '#F5B700', k: '#2b2b2b' })) });\n", "pericolo/avvoltoio": "// Pericolo \"Avvoltoio\": uccellaccio marrone con la testa rossa spelacchiata e le ali che battono, pattuglia in volo; si schiva o si distrugge a colpi\n// (al posto della \"mina volante\", troppo simile al pallone mina: Davide, 06/11/2026)\nAU.registra('pericolo', 'avvoltoio', { nome: { it: \"l'avvoltoio\", en: 'the vulture' }, emoji: '🦅', famiglia: 'volo', w: 36, h: 22,\n  disegna(ctx, o, S) {\n    const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + Math.sin(S.anim * 3 + o.x) * 2, dir = o.dir || -1, batt = Math.sin(S.anim * 9 + o.x) * 7;\n    ctx.save(); ctx.translate(cx, cy); if (dir > 0) ctx.scale(-1, 1);\n    // ali (dietro il corpo), con il battito\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(-20, -8 - batt); ctx.lineTo(-18, 2 - batt * 0.4); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(20, -8 - batt); ctx.lineTo(18, 2 - batt * 0.4); ctx.lineTo(6, 4); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#5a4030'; ctx.beginPath(); ctx.moveTo(-4, -1); ctx.lineTo(-18, -7 - batt); ctx.lineTo(-16, 1 - batt * 0.4); ctx.lineTo(-6, 3); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(18, -7 - batt); ctx.lineTo(16, 1 - batt * 0.4); ctx.lineTo(6, 3); ctx.closePath(); ctx.fill();\n    // corpo e coda\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(0, 2, 9, 6, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#6b4a30'; ctx.beginPath(); ctx.ellipse(0, 2, 7.5, 4.5, 0, 0, 7); ctx.fill();\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(6, 1, 7, 4); ctx.fillStyle = '#4a3320'; ctx.fillRect(7, 2, 5, 2);\n    // collo, testa rossa spelacchiata, becco giallo adunco, occhio\n    ctx.fillStyle = '#f4f1ea'; ctx.beginPath(); ctx.arc(-8, -1, 3.5, 0, 7); ctx.fill();\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(-11, -4, 4.5, 0, 7); ctx.fill(); ctx.fillStyle = '#d9534f'; ctx.beginPath(); ctx.arc(-11, -4, 3.5, 0, 7); ctx.fill();\n    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(-14, -5); ctx.lineTo(-19, -3); ctx.lineTo(-14, -1); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-13, -6, 2, 2);\n    // zampe raccolte\n    ctx.fillStyle = '#ffd166'; ctx.fillRect(-2, 7, 2, 3); ctx.fillRect(2, 7, 2, 3);\n    ctx.restore();\n  } });\n", "pericolo/barricata": "// Pericolo \"Barricata\": travi d'acciaio incrociate con il filo spinato, a terra; si salta o si distrugge a colpi (era \"cavallo di Frisia\": nome cambiato da Davide il 06/11/2026)\nAU.registra('pericolo', 'barricata', { nome: { it: 'la barricata', en: 'the barricade' }, emoji: '🚧', famiglia: 'terra', w: 32, h: 26,\n  disegna(ctx, o) {\n    const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + 2;\n    ctx.save(); ctx.lineCap = 'round';\n    for (const [col, w] of [['#2b2b2b', 7], ['#5a5f6c', 4]]) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(cx - 13, cy + 10); ctx.lineTo(cx + 13, cy - 10); ctx.moveTo(cx + 13, cy + 10); ctx.lineTo(cx - 13, cy - 10); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx, cy - 12); ctx.stroke(); }\n    ctx.strokeStyle = '#8a8f9c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - 12, cy - 4); ctx.quadraticCurveTo(cx, cy - 14, cx + 12, cy - 2); ctx.stroke(); ctx.fillStyle = '#2b2b2b'; for (let k = 0; k < 4; k++) ctx.fillRect(cx - 9 + k * 6, cy - 9 + (k % 2) * 2, 2, 2);\n    // la striscia gialla e nera di cantiere, così si capisce al volo che è una barricata\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(cx - 14, cy + 6, 28, 6); for (let k = 0; k < 4; k++) { ctx.fillStyle = '#ffd166'; ctx.fillRect(cx - 13 + k * 7, cy + 7, 4, 4); }\n    ctx.restore();\n  } });\n", "pericolo/drone": "// Pericolo \"Drone\": pattuglia in volo con le eliche che girano e la luce rossa\nAU.registra('pericolo', 'drone', { nome: { it: 'il drone', en: 'the drone' }, emoji: '🛸', famiglia: 'volo', w: 30, h: 16,\n  disegna(ctx, o, S) {\n    const cx = o.x + o.w / 2, cy = o.y + 9, f = Math.floor(S.anim * 20) % 2;\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x + 1, cy - 1, 4, 2); ctx.fillRect(o.x + o.w - 5, cy - 1, 4, 2);\n    ctx.fillStyle = f ? 'rgba(200,200,210,.9)' : 'rgba(200,200,210,.35)'; ctx.fillRect(o.x - 3, cy - 6, 12, 2); ctx.fillRect(o.x + o.w - 9, cy - 6, 12, 2);\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x + 2, cy - 5, 2, 5); ctx.fillRect(o.x + o.w - 4, cy - 5, 2, 5);\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(cx - 8, cy - 3, 16, 8); ctx.fillStyle = '#6b6f7a'; ctx.fillRect(cx - 7, cy - 2, 14, 6); ctx.fillStyle = '#3a3d45'; ctx.fillRect(cx - 4, cy + 1, 8, 2);\n    ctx.fillStyle = Math.floor(S.anim * 4) % 2 ? '#ff5c5c' : '#7a2020'; ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);\n  } });\n", "pericolo/emoji": "// Pericolo emoji: il cliente scrive un'emoji e diventa un malus a terra o in volo (scheda: \"emoji:🔥\" oppure \"emoji:🐝:volo\"). Un tocco costa un cuore; si salta o si distrugge a colpi.\nAU.registra('pericolo', 'emoji', {\n  crea(ch, famiglia) {\n    const volo = famiglia === 'volo';\n    return { id: 'emoji:' + ch + (volo ? ':volo' : ''), nome: { it: ch, en: ch }, famiglia: volo ? 'volo' : 'terra', w: 38, h: 38, emoji: ch,   // più grande (Davide, 06/11/2026)\n      disegna(ctx, o, S) { ctx.save(); ctx.font = '34px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        if (!volo) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h, 12, 3, 0, 0, 7); ctx.fill(); }\n        ctx.fillStyle = '#000';   // l'emoji a colori prende l'alfa del colore: con quello dell'ombra usciva al 35 % (Davide, 06/11/2026)\n        ctx.fillText(ch, o.x + o.w / 2, o.y + o.h / 2 + (volo ? Math.sin(S.anim * 6) * 2 : 0)); ctx.restore(); } };\n  }\n});\n", "pericolo/filo-spinato": "// Pericolo \"Filo spinato\": rotolo di filo a terra, si salta o si distrugge a colpi\nAU.registra('pericolo', 'filo-spinato', { nome: { it: 'il filo spinato', en: 'the barbed wire' }, emoji: '🧶', famiglia: 'terra', w: 32, h: 18,\n  disegna(ctx, o) {\n    ctx.save(); ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 3.5; ctx.beginPath(); for (let i = 0; i < 4; i++) ctx.arc(o.x + 5 + i * 7.5, o.y + o.h - 8, 7, 0, 7); ctx.stroke();\n    ctx.strokeStyle = '#8a8f9c'; ctx.lineWidth = 1.5; ctx.beginPath(); for (let i = 0; i < 4; i++) ctx.arc(o.x + 5 + i * 7.5, o.y + o.h - 8, 7, 0, 7); ctx.stroke();\n    ctx.fillStyle = '#2b2b2b'; for (let i = 0; i < 5; i++) { const x = o.x + 2 + i * 7, y = o.y + 1 + (i % 2) * 6; ctx.fillRect(x, y, 2, 2); ctx.fillRect(x + 1, y - 1, 1, 4); }\n    ctx.restore();\n  } });\n", "pericolo/fumogeno": "// Pericolo \"Fumogeno\": bombola a terra che sputa fumo giallo; toccarla costa un cuore, si salta o si distrugge a colpi\nAU.registra('pericolo', 'fumogeno', { nome: { it: 'il fumogeno', en: 'the smoke grenade' }, emoji: '💨', famiglia: 'terra', w: 24, h: 28,\n  disegna(ctx, o, S) {\n    const cx = o.x + o.w / 2, y = o.y + o.h;\n    ctx.fillStyle = 'rgba(230,200,80,.45)'; for (let i = 0; i < 4; i++) { const k = (S.anim * 0.9 + i * 0.25) % 1; ctx.beginPath(); ctx.arc(cx + Math.sin(k * 6 + i) * 6, y - 20 - k * 30, 4 + k * 7, 0, 7); ctx.fill(); }\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(cx - 7, y - 20, 14, 20); ctx.fillStyle = '#6b6f4a'; ctx.fillRect(cx - 6, y - 19, 12, 18); ctx.fillStyle = '#e0b84a'; ctx.fillRect(cx - 6, y - 14, 12, 5); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(cx - 4, y - 24, 8, 4); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(cx - 2, y - 26, 4, 2); ctx.fillStyle = '#c8321f'; ctx.fillRect(cx + 4, y - 27, 3, 5);\n  } });\n", "pericolo/fuoco": "// Pericolo \"Fuoco\": chiazza che brucia a terra, fiamme animate\nAU.registra('pericolo', 'fuoco', { nome: { it: 'il fuoco', en: 'the fire' }, emoji: '🔥', famiglia: 'terra', w: 28, h: 24,\n  disegna(ctx, o, S) {\n    const y = o.y + o.h; ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, y - 1, o.w / 2 + 1, 4, 0, 0, 7); ctx.fill();\n    for (let i = 0; i < 3; i++) { const x = o.x + 6 + i * 8, h = 14 + Math.sin(S.anim * 12 + i * 2) * 5, k = Math.sin(S.anim * 9 + i) * 2;\n      ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.quadraticCurveTo(x - 6, y - h * 0.6, x + k, y - h); ctx.quadraticCurveTo(x + 6, y - h * 0.6, x + 5, y); ctx.closePath(); ctx.fill();\n      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(x - 2.5, y); ctx.quadraticCurveTo(x - 3, y - h * 0.4, x + k * 0.5, y - h * 0.55); ctx.quadraticCurveTo(x + 3, y - h * 0.4, x + 2.5, y); ctx.closePath(); ctx.fill(); }\n  } });\n", "pericolo/fusto-tossico": "// Pericolo \"Fusto tossico\": barile verde con il teschio, a terra\nAU.registra('pericolo', 'fusto-tossico', { nome: { it: 'il fusto tossico', en: 'the toxic barrel' }, emoji: '☣️', famiglia: 'terra', px: 2, w: 20, h: 26,\n  img: AU.sprite([\".kkkkkkkk.\", \"kllllllllk\", \"kllllllllk\", \"kkkkkkkkkk\", \"kllwwwwllk\", \"kllwkwkwlk\", \"kllwwwwllk\", \"klllwwlllk\", \"kkkkkkkkkk\", \"kllllllllk\", \"kllllllllk\", \"kllllllllk\", \".kkkkkkkk.\"], Object.assign({}, AU.PAL, { l: '#8ad94a', k: '#2b2b2b', w: '#f4f1ea' })),\n  extra: true,\n  disegna(ctx, o, S) { ctx.drawImage(this.img, o.x - 2, o.y - 2, 24, 30); ctx.fillStyle = 'rgba(138,217,74,.45)'; for (let i = 0; i < 2; i++) { const k = (S.anim * 0.8 + i * 0.5) % 1; ctx.beginPath(); ctx.arc(o.x + 10 + Math.sin(k * 6) * 3, o.y - 4 - k * 16, 3 + k * 3, 0, 7); ctx.fill(); } } });\n", "pericolo/pallone-mina": "// Pericolo \"Pallone mina\": mina nera con le punte appesa a un palloncino, in volo\nAU.registra('pericolo', 'pallone-mina', { nome: { it: 'il pallone mina', en: 'the balloon mine' }, emoji: '🎈', famiglia: 'volo', w: 22, h: 30,\n  disegna(ctx, o, S) {\n    const cx = o.x + o.w / 2, by = o.y + 7 + Math.sin(S.anim * 3) * 1.5;\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(cx, by, 7, 8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#d9534f'; ctx.beginPath(); ctx.ellipse(cx, by, 6, 7, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ff8f8f'; ctx.fillRect(cx - 3, by - 4, 2, 3);\n    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, by + 7); ctx.lineTo(cx, by + 12); ctx.stroke();\n    const my = by + 18; ctx.fillStyle = '#2b2b2b'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.fillRect(cx + Math.cos(a) * 7 - 1.5, my + Math.sin(a) * 7 - 1.5, 3, 3); }\n    ctx.beginPath(); ctx.arc(cx, my, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.arc(cx, my, 4.5, 0, 7); ctx.fill(); ctx.fillStyle = Math.floor(S.anim * 5) % 2 ? '#ff5c5c' : '#7a2020'; ctx.beginPath(); ctx.arc(cx, my, 1.8, 0, 7); ctx.fill();\n  } });\n", "pericolo/tagliola": "// Pericolo \"Tagliola\": trappola d'acciaio aperta a terra con i denti; si salta o si distrugge a colpi\nAU.registra('pericolo', 'tagliola', { nome: { it: 'la tagliola', en: 'the bear trap' }, emoji: '🪤', famiglia: 'terra', w: 30, h: 16,\n  disegna(ctx, o, S) {\n    const cx = o.x + o.w / 2, y = o.y + o.h, ap = 0.9 + Math.sin(S.anim * 2) * 0.05;\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(cx, y - 3, 14, 4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#6b6f7a'; ctx.beginPath(); ctx.ellipse(cx, y - 3, 12, 2.5, 0, 0, 7); ctx.fill();\n    for (const s of [-1, 1]) { ctx.save(); ctx.translate(cx, y - 3); ctx.rotate(s * ap); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-1.5, -14, 3, 14); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-0.5, -13, 1.5, 12); ctx.fillStyle = '#c0c4cc'; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(0, -13 + k * 3); ctx.lineTo(-s * 4, -11.5 + k * 3); ctx.lineTo(0, -10 + k * 3); ctx.closePath(); ctx.fill(); } ctx.restore(); }\n    ctx.fillStyle = '#c8321f'; ctx.fillRect(cx - 2, y - 7, 4, 3);\n  } });\n", "mezzo/carro-armato": "// Mezzo \"Carro armato\": cingolato verde oliva con la torretta; il protagonista sale sulla torretta e il carro corre a terra verso il livello successivo. c.rx = bordo sinistro, c.ry = terra.\nAU.registra('mezzo', 'carro-armato', { nome: { it: 'il carro armato', en: 'the tank' }, emoji: '🪖', terra: true, sella: { x: 30, y: -36 }, scia: ['#c9b26b', '#6b6f7a'],\n  suono(a, t) { a.tone(55, t, 1.2, 'sawtooth', 0.07, 90); a.tone(70, t + 1.0, 1.4, 'sawtooth', 0.06, 140); if (a.drum) for (let i = 0; i < 8; i++) a.drum('k', t + i * 0.3); },\n  disegna(ctx, c, S) {\n    const x = c.rx, y = c.ry, f = Math.floor(S.anim * 12) % 2;\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 1, y - 23, 82, 13); ctx.fillStyle = '#5b6b3a'; ctx.fillRect(x, y - 22, 80, 11); ctx.fillStyle = '#3f4b28'; ctx.fillRect(x, y - 14, 80, 3);\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 20, y - 37, 36, 15); ctx.fillStyle = '#5b6b3a'; ctx.fillRect(x + 21, y - 36, 34, 13); ctx.fillStyle = '#3f4b28'; ctx.fillRect(x + 21, y - 26, 34, 3);\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 54, y - 33, 36, 6); ctx.fillStyle = '#4a5a2e'; ctx.fillRect(x + 55, y - 32, 34, 4); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(x + 86, y - 33, 4, 6);\n    ctx.fillStyle = '#e0b84a'; ctx.fillRect(x + 26, y - 32, 6, 5); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 1, y - 11, 82, 11); ctx.fillStyle = '#3a3d45'; ctx.fillRect(x, y - 10, 80, 9);\n    ctx.fillStyle = '#8a8f9c'; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x + 9 + k * 12.5, y - 6, 3.5, 0, 7); ctx.fill(); } ctx.fillStyle = '#c0c4cc'; for (let k = f; k < 80; k += 8) ctx.fillRect(x + k, y - 11, 4, 2);\n    ctx.fillStyle = 'rgba(120,120,130,.5)'; for (let i = 0; i < 3; i++) { const k = (S.anim * 1.5 + i * 0.33) % 1; ctx.beginPath(); ctx.arc(x + 4 - k * 12, y - 24 - k * 20, 3 + k * 4, 0, 7); ctx.fill(); }\n  } });\n", "mezzo/elicottero": "// Mezzo \"Elicottero\": verde oliva con il rotore che gira e i pattini; vola via verso il livello successivo, con il muso a destra. c.rx = bordo sinistro, c.ry = base dei pattini.\nAU.registra('mezzo', 'elicottero', { nome: { it: \"l'elicottero\", en: 'the helicopter' }, emoji: '🚁', terra: false, sella: { x: 32, y: -12 }, scia: ['#d9d6ee', '#8a8f9c'],\n  suono(a, t) { for (let i = 0; i < 12; i++) a.tone(60 + i * 4, t + i * 0.18, 0.16, 'square', 0.03, 90); if (a.drum) for (let i = 0; i < 10; i++) a.drum('h', t + i * 0.2); },\n  disegna(ctx, c, S) {\n    // girato verso destra, dove va (Davide, 06/11/2026): si disegna specchiato attorno al centro (x + 41,5), muso e vetro a destra, coda a sinistra\n    const x = c.rx, y = c.ry, f = Math.floor(S.anim * 24) % 2;\n    ctx.save(); ctx.translate(2 * x + 83, 0); ctx.scale(-1, 1);\n    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.lineTo(x + 62, y); ctx.moveTo(x + 16, y); ctx.lineTo(x + 20, y - 8); ctx.moveTo(x + 50, y); ctx.lineTo(x + 46, y - 8); ctx.stroke();\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 9, y - 31, 52, 24); ctx.fillRect(x + 56, y - 24, 30, 7); ctx.fillRect(x + 82, y - 36, 5, 16);\n    ctx.fillStyle = '#5b6b3a'; ctx.fillRect(x + 10, y - 30, 50, 22); ctx.fillRect(x + 57, y - 23, 28, 5); ctx.fillRect(x + 83, y - 35, 3, 14);\n    ctx.fillStyle = '#9ad7ff'; ctx.fillRect(x + 12, y - 28, 16, 10); h(); ctx.arc(wx, y - 8, 4, 0, 7); ctx.fill();\n      ctx.strokeStyle = '#3a3d45'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(wx + Math.cos(rot) * 4, y - 8 + Math.sin(rot) * 4); ctx.lineTo(wx - Math.cos(rot) * 4, y - 8 - Math.sin(rot) * 4); ctx.stroke();\n    }\n  } });\n", "mezzo/jet": "// Mezzo \"Jet\": caccia grigio con il muso a destra; il protagonista sale sulla fusoliera e il jet decolla con la fiamma dei motori. c.rx = bordo sinistro, c.ry = quota.\nAU.registra('mezzo', 'jet', { nome: { it: 'il jet', en: 'the jet' }, emoji: '🛩️', terra: false, sella: { x: 36, y: -14 }, scia: ['#ff8a3d', '#d9d6ee'],\n  suono(a, t) { a.tone(120, t, 1.6, 'sawtooth', 0.05, 900); a.tone(240, t + 0.6, 1.4, 'sawtooth', 0.04, 2400); if (a.drum) for (let i = 0; i < 12; i++) a.drum('h', t + i * 0.12); },\n  disegna(ctx, c, S) {\n    const x = c.rx, y = c.ry, f = Math.floor(S.anim * 20) % 2;\n    // fiamma dei motori\n    ctx.fillStyle = f ? '#ff8a3d' : '#ffd166'; ctx.beginPath(); ctx.moveTo(x + 2, y - 14); ctx.lineTo(x - 18 - (f ? 6 : 0), y - 10); ctx.lineTo(x + 2, y - 6); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 1, y - 17, 92, 14); ctx.beginPath(); ctx.moveTo(x + 90, y - 17); ctx.lineTo(x + 108, y - 10); ctx.lineTo(x + 90, y - 3); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#8a8f9c'; ctx.fillRect(x, y - 16, 90, 12); ctx.beginPath(); ctx.moveTo(x + 90, y - 16); ctx.lineTo(x + 106, y - 10); ctx.lineTo(x + 90, y - 4); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#5a5f6c'; ctx.fillRect(x, y - 7, 90, 3);\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 56, y - 25, 24, 9); ctx.fillStyle = '#9ad7ff'; ctx.fillRect(x + 58, y - 24, 20, 7);\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.moveTo(x + 4, y - 17); ctx.lineTo(x + 18, y - 38); ctx.lineTo(x + 28, y - 17); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#5a5f6c'; ctx.beginPath(); ctx.moveTo(x + 7, y - 17); ctx.lineTo(x + 18, y - 35); ctx.lineTo(x + 25, y - 17); ctx.closePath(); c  - 56 + bob, 10, 4); ctx.fillRect(x + 66, y - 56 + bob, 4, 20); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(x + 64, y - 38 + bob, 8, 6);\n  } });\n", "mezzo/pony": "// Mezzo \"Pony\": un pony rosa con la criniera bianca che galoppa via lasciando una scia arcobaleno (al posto della moto: Davide, 06/11/2026). c.rx = bordo sinistro, c.ry = terra.\nAU.registra('mezzo', 'pony', { nome: { it: 'il pony', en: 'the pony' }, emoji: '🦄', terra: true, sella: { x: 26, y: -30 }, scia: ['#ff5c5c', '#ff8a3d', '#ffd166', '#2fbf71', '#5aa9e6', '#3B1E6E', '#c678dd'],\n  suono(a, t) { for (let i = 0; i < 8; i++) a.tone(140 + (i % 2) * 30, t + 0.2 + i * 0.17, 0.05, 'square', 0.03, 90); a.tone(900, t, 0.25, 'sine', 0.04, 1500); a.tone(1300, t + 0.25, 0.3, 'sine', 0.03, 700); if (a.drum) for (let i = 0; i < 8; i++) a.drum(i % 2 ? 'h' : 'k', t + 0.2 + i * 0.17); },\n  disegna(ctx, c, S) {\n    const x = c.rx, y = c.ry, g = Math.sin(S.anim * 14), corre = c.mounted;\n    // zampe (al galoppo quando corre)\n    ctx.fillStyle = '#2b2b2b'; for (const [zx, f] of [[x + 12, 1], [x + 20, -1], [x + 40, -1], [x + 48, 1]]) { const sw = corre ? g * 5 * f : 0; ctx.fillRect(zx - 3 + sw, y - 18, 6, 18); ctx.fillStyle = '#ff9fcf'; ctx.fillRect(zx - 2 + sw, y - 17, 4, 15); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(zx - 3 + sw, y - 4, 6, 4); }\n    // corpo\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(x + 30, y - 25, 24, 12, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ffb3dc'; ctx.beginPath(); ctx.ellipse(x + 30, y - 25, 22, 10, 0, 0, 7); ctx.fill();\n    // coda bianca, svolazzante\n    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 8, y - 28); ctx.quadraticCurveTo(x - 4, y - 36 + g * 3, x - 6, y - 14 + g * 4); ctx.stroke(); ctx.strokeStyle = '#f4f1ea'; ctx.lineWidth = 4; ctx.stroke();\n    // collo e testa\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 44, y - 46, 12, 26); ctx.fillStyle = '#ffb3dc'; ctx.fillRect(x + 45, y - 45, 10, 24);\n    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(x + 56, y - 46, 12, 8, 0.3, 0, 7); ctx.fill(); ctx.fillStyle = '#ffb3dc'; ctx.beginPath(); ctx.ellipse(x + 56, y - 46, 10.5, 6.5, 0.3, 0, 7); ctx.fill();\n    ctx.fillStyle = '#ff8fc0'; ctx.beginPath(); ctx.ellipse(x + 63, y - 43, 4, 3, 0.3, 0, 7); ctx.fill();   // muso\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 56, y - 49, 2.5, 2.5); ctx.fillRect(x + 50, y - 54, 3, 6); ctx.fillStyle = '#ffb3dc'; ctx.fillRect(x + 51, y - 53, 1, 4);   // occhio e orecchio\n    // criniera bianca\n    ctx.fillStyle = '#f4f1ea'; for (let i = 0; i < 5; i++) ctx.fillRect(x + 42 + i * 2.5, y - 50 - (i % 2) * 2 + Math.sin(S.anim * 10 + i) * 1.5, 3, 9);\n    // sella con la coperta oro\n    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 20, y - 36, 22, 6); ctx.fillStyle = '#F5B700'; ctx.fillRect(x + 21, y - 35, 20, 4); ctx.fillStyle = '#3B1E6E'; ctx.fillRect(x + 21, y - 33, 20, 1);\n  } });\n"};

 e più cuori nei livelli; v0.8 il mezzo che porta al livello successivo dopo il boss; v0.9 schermate iniziale, foto e finale in tema militare; v0.10 codice segreto svelato dopo il terzo boss, aura d'oro, tasto nella pausa; v0.11 disinnesco da 64 px, 8 nemici distanziati, mai più di 2 sullo schermo; v0.12 boss nella metà destra, piattaforma nell'arena, mosse che disarmano i colpi; v0.13 tasto Tutorial al posto dell'elenco del briefing e addestramento interattivo a passi; v0.14 nemici mai dentro le colline, arcate alte da passare solo abbassati, difficoltà rialzate, Tutorial anche dal finale; v0.15 tutorial senza i tasti della tastiera, mine disinnescate da abbassati anche camminando; v0.16 nemici più resistenti in Normale (5 colpi) e molti di più in Difficile (14 per livello, 3 sullo schermo); v0.17 dentro il lanciatore la scena lascia posto al tasto \"Chiudi il gioco\" in verticale; in orizzontale Pausa e Audio vanno agli angoli;\n   v0.18 dopo le prove sull'iPhone: tutte le schermate lasciano libera la fascia di \"Chiudi il gioco\", fascicolo del codice e schermata finale a colonne in orizzontale (classe `senzafoto` senza la foto finale), pad v0.4 con i tasti più grandi in orizzontale)\n   Sparatutto a scorrimento con piattaforme. Stesso impianto di Corsa: un motore unico, i pezzi (livelli, mosse, musiche, corpi)\n   sono moduli che si registrano con AU.registra(tipo, id, definizione); la scheda (window.ARCADEU_SCHEDA) dice quali usare;\n   le foto stanno in window.ARCADEU_FOTO come data URI. Il pad è il modulo comune AU.pad. Nessun riferimento a persone reali.\n   Niente violenza: chi viene colpito vola via con stelline e \"OUCH!\"; le armi sono comiche (popcorn, tappi, torte, coriandoli). */\nwindow.AU = (() => {\n  'use strict';\n  // bonus e pericoli (i \"malus\") sono moduli disegnati apposta per Boom (catalogo/bonus, catalogo/pericoli), emoji comprese: niente pezzi di Corsa (Davide, 06/11/2026)\n  const reg = { livello: {}, mossa: {}, musica: {}, corpo: {}, b sse.length || !musica) throw new Error('Scheda incompleta: servono livelli, mosse e musica');\n    // bonus da raccogliere e malus (pericoli a terra o in volo) scelti dal cliente, anche come emoji (\"emoji:🍕\", \"emoji:🐝:volo\")\n    const bonusDefs = (SCH.bonus || []).map(id => id.startsWith('emoji:') ? (reg.bonus.emoji && reg.bonus.emoji.crea(id.slice(6))) : reg.bonus[id]).filter(Boolean).slice(0, 5);\n    const malusDefs = (SCH.pericoli || []).map(id => { if (id.startsWith('emoji:')) { const [, ch, fam] = id.split(':'); return reg.pericolo.emoji && reg.pericolo.emoji.crea(ch, fam || 'terra'); } return reg.pericolo[id]; }).filter(Boolean).slice(0, 8);\n    const misura = d => ({ w: d.img ? d.img.width * (d.px || 2) : d.w || 24, h: d.img ? d.img.height * (d.px || 2) : d.h || 24 });\n    // ogni pericolo deve potersi evitare (Davide, 06/11/2026 sera): a terra mai più alto di MALUS_H_MAX (si salta sempre, come gli ostacoli; il salto arriva a ~73 px),\n    // in volo con il bordo inferiore ad almeno MALUS_VOLO_MIN da terra (abbassati si è alti 30 px: si passa sempre sotto). Vale anche per le emoji grandi.\n    const MALUS_H_MAX = 44, MALUS_W_MAX = 48, MALUS_VOLO_MIN = 48;\n    const misuraMalus = d => { const m = misura(d); return { w: Math.min(m.w, MALUS_W_MAX), h: Math.min(m.h, MALUS_H_MAX) }; };\n    const quotaVolo = (h, i) => Math.min(G - MALUS_VOLO_MIN - h - (i % 3) * 14, G - MALUS_VOLO_MIN - h);\n    // mezzi che portano al livello successivo dopo il boss (jeep, elicottero…), uno per passaggio a rotazione\n    const mezzi = (SCH.mezzi || []).map(id => reg.mezzo[id]).filter(Boolean).slice(0, 3);\n    const TASTO_MOSSA = ['X', 'Y'];\n\n    // --- personaggi (i corpi sono gli stessi di Corsa: lo sparapopcorn si disegna sopra) ---\n    function img(key) { if (!FOTO[key]) return null; const i = new Image(); i.src = FOTO[key]; return i; }\n    const corpoDi = (id, tipo) => reg.corpo[id] || Object.values(reg.corpo).find(c => c.tipo === tipo);\n    const PRO = { nome: SCH.protagonista.nome, corpo: corpoDi(SCH.protagonista.corpo, 'protagonista'), faccia: img(SCH.protagonista.foto) };\n    // armi dei nemici (v0.19, sei comportamenti): 'fucile' (pallottole dritte), 'granate' (ad arco, scoppiano a terra), 'mitra' (raffiche di tre),\n    // 'cecchino' (sta lontano, prende la mira con il mirino rosso, un colpo veloce), 'lanciafiamme' (da vicino, lingue di fuoco corte), 'assalto' (corre addosso, niente colpi).\n    // L'arma la decide la scheda, altrimenti il corpo (`arma` nel modulo), altrimenti si alternano fucile e granate. I vecchi nomi tappi/torte valgono ancora.\n    const ARMA = { fucile: 'fucile', granate: 'granate', mitra: 'mitra', cecchino: 'cecchino', lanciafiamme: 'lanciafiamme', assalto: 'assalto', tappi: 'fucile', torte: 'granate' };\n    const NEMICI = (SCH.nemici || []).map((n, i) => { const c = corpoDi(n.corpo, 'nemico'); return { nome: n.nome, corpo: c, faccia: img(n.foto), frasi: n.frasi || [], arma: ARMA[n.arma] || (c && ARMA[c.arma]) || (i % 2 ? 'granate' : 'fucile') }; }).filter(n => n.corpo);\n    // i boss: il corpo può dichiarare `boss: { vola, attacchi: ['raffica','salto','bombe','missili','laser','mine'], vita }` (v0.19); senza, raffica e salto come il carro armato\n    const BOSS = (SCH.boss || []).map(b => ({ nome: b.nome, corpo: corpoDi(b.corpo, 'boss'), faccia: img(b.foto), frasi: b.frasi || [] })).filter(b => b.corpo);\n    const SPECIALI = (SCH.foto_speciali || []).map(c => ({ img: FOTO[c.foto], didascalia: c.didascalia || '' })).slice(0, 3);\n    const FINALE = SCH.finale || {};\n    vars.protagonista = PRO.nome; vars.nemici = NEMICI.map(n => n.nome).join(', ') || '…';\n    vars.mossa1 = nomeDi(mosse[0]); vars.mossa2 = mosse[1] ? nomeDi(mosse[1]) : nomeDi(mosse[0]);\n    vars.malus = malusDefs.map(d => nomeDi(d)).join(', ') || '…'; vars.bonus = bonusDefs.map(d => d.emoji || nomeDi(d)).join(' ');\n    const FRASI = (SCH.frasi || []).filter(Boolean).slice(0, 5);\n    const TITOLO = SCH.titolo || (PRO.nome + ' Boom');\n\n    // --- DOM ---\n    const $ = s => document.querySelector(s);\n    document.title = TITOLO;\n    $('#titolo').textContent = TITOLO;\n    $('#aiuto').textContent = T('aiuto'); $('#go').textContent = T('parte'); $('#again').textContent = T('rigioca');\n    $('#photoTap').textContent = T('toccaContinua');\n    for (const [sel, k] of [['#tutoTag', 'briefing'], ['#endTag', 'rapporto']]) { const el = $(sel); if (el) el.textContent = T(k); }\n    const tastieraPresente = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;\n    // dal 06/11/2026 (v0.13) il briefing non ha più l'elenco delle istruzioni: c'è il tasto \"Tutorial\", che apre l'addestramento interattivo\n    const tutBtn = $('#tutBtn'); if (tutBtn) tutBtn.textContent = T('tutBtn');\n    const vs = $('#vs'); vs.innerHTML = '';\n    const facciaTag = (f, alt) => { if (!f) return ''; const i = document.createElement('img'); i.src = f.src; i.alt = alt; return i; };\n    const fP = facciaTag(PRO.faccia, PRO.nome); if (fP) vs.append(fP);\n    if (NEMICI[0] && NEMICI[0].faccia) { const s = document.createElement('span'); s.textContent = T('vs'); vs.append(s, facciaTag(NEMICI[0].faccia, NEMICI[0].nome)); }\n    // difficoltà: velocità dei nemici e cadenza del loro fuoco\n    // abbassate tutte e tre il 06/11/2026 (\"mi sembra abbastanza difficile\"): v = velocità dei nemici, fuoco = moltiplicatore delle pause tra un colpo e l'altro, hp = colpi in più per abbatterli\n    // cuori = vita massima (Davide, 06/11/2026: 6 in Facile, 4 in Normale, 3 in Difficile)\n    // rialzate il 06/11/2026 (v0.14, Davide: \"adesso è troppo semplice: l'attuale normale mettila come facile, poi ne fai due più difficili a salire\")\n    // v0.16 (Davide, 06/11/2026: \"in modalità normale i nemici devono essere più resistenti ed in modalità difficile devono essercene proprio di più\"):\n    // nemici = quanti se ne provano a piazzare per livello (+2 per giro; quelli che non trovano posto si tolgono), scena = quanti al massimo sullo schermo, distanza = spazio minimo tra due nemici; hp = colpi in più oltre i 2 di base\n    const DIFF = { facile: { v: 0.88, fuoco: 1.35, hp: 0, boss: 0, cuori: 6, nemici: 8, scena: 2, distanza: 150, primo: 620 },\n      normale: { v: 1.0, fuoco: 1.1, hp: 3, boss: 6, cuori: 4, nemici: 8, scena: 2, distanza: 150, primo: 620 },\n      difficile: { v: 1.14, fuoco: 0.82, hp: 4, boss: 14, cuori: 3, nemici: 16, scena: 3, distanza: 90, primo: 480 },   // primo = dove sta il primo nemico (in Difficile poco più di una schermata di calma)\n      // \"extreme\" (v0.22, Davide): non si sceglie all'inizio, ci si arriva salendo; come Difficile ma con un cuore solo e punti tripli (MOLT)\n      extreme: { v: 1.2, fuoco: 0.74, hp: 5, boss: 20, cuori: 1, nemici: 18, scena: 3, distanza: 80, primo: 420 } };\n    // la difficoltà sale (Davide, 06/11/2026 sera): dal quarto livello in poi ogni boss battuto alza la difficoltà di uno scalino rispetto a quella scelta,\n    // fino a \"extreme\". diffA() è la difficoltà del momento; `diff` resta quella scelta nel briefing.\n    const ORDINE_DIFF = ['facile', 'normale', 'difficile', 'extreme'];\n    const diffA = () => ORDINE_DIFF[Math.min(3, ORDINE_DIFF.indexOf(diff) + Math.max(0, S.livelliFatti - 2))];\n    const MOLT = () => diffA() === 'extreme' ? 3 : 1;\n    const MAXC = () => DIFF[diffA()].cuori;\n    let diff = 'normale'; try { const d = localStorage.getItem(ID + '-diff'); if (DIFF[d]) diff = d; } catch (e) {}\n    const diffBoxes = [$('#diff'), $('#diff2')].filter(Boolean);\n    const segnaDiff = () => { for (const box of diffBoxes) for (const x of box.querySelectorAll('button')) x.classList.toggle('on', x.dataset.d === diff); vars.cuori = DIFF[diff].cuori; const li = document.querySelector('#tuto ul'); if (li && li.dataset.pronto) li.innerHTML = li.dataset.pronto.replace(/\\{cuori\\}/g, vars.cuori); };\n    for (const box of diffBoxes) {\n      const lab = document.createElement('span'); lab.textContent = T('difficolta'); box.append(lab);\n      for (const k of ['facile', 'normale', 'difficile']) { const b = document.createElement('button'); b.type = 'button'; b.dataset.d = k; b.textContent = T(k); b.addEventListener('click', e => { e.stopPropagation(); diff = k; try { localStorage.setItem(ID + '-diff', k); } catch (e) {} segnaDiff(); }); box.append(b); }\n    }\n    segnaDiff();\n    // tocchi ripetuti sui visi (schermata iniziale) o sulla foto finale: cambia qualcosa che sappiamo solo noi\n    let CHEAT = false, tapN = 0, tapAt = 0;\n    // il trucco si accende e si spegne da qui: visi iniziali, foto e punteggio del finale (5 tocchi), fascicolo segreto dopo il terzo boss, tasto nella pausa\n    function setCheat(v) {\n      CHEAT = !!v; for (const el of [vs, $('#finaleImg'), $('#endTitle')]) if (el) el.style.filter = CHEAT ? 'drop-shadow(0 0 10px #F5B700)' : '';\n      const db = $('#disattiva'); if (db) db.hidden = !CHEAT; const tb = $('#termina'); if (tb && S.state === 'pausa') tb.hidden = !CHEAT;\n      if (ac && !muted) { const t = ac.currentTime; (CHEAT ? [72, 76, 79, 84] : [79, 72]).forEach((n, i) => tone(hz(n), t + i * 0.07, 0.14, 'square', 0.035)); }\n      if (S.state === 'play' || S.state === 'pausa') S.toast = { text: T(CHEAT ? 'cheatOn' : 'cheatOff'), t: 1.6 };\n    }\n    const tapSegreto = () => { const now = performance.now(); tapN = now - tapAt < 1500 ? tapN + 1 : 1; tapAt = now; if (tapN >= 5) { tapN = 0; setCheat(!CHEAT); } };\n    vs.addEventListener('pointerdown', tapSegreto); for (const sel of ['#finaleImg', '#endTitle']) { const el = $(sel); if (el) el.addEventListener('pointerdown', tapSegreto); }\n    let SVELATO = false; try { SVELATO = localStorage.getItem(ID + '-segreto') === '1'; } catch (e) {}\n    const SITO = 'https://arcadeu.it/';\n    const linkSito = (medium, campagna) => SITO + '?utm_source=gioco&utm_medium=' + medium + '&utm_campaign=' + campagna + '&utm_content=' + encodeURIComponent((SCH.gioco || 'boom') + '-' + (EN ? 'en' : 'it')) + '&utm_term=' + encodeURIComponent(ID);\n    $('#finaleTitolo').textContent = T('finaleTitolo');\n    const creaAltro = $('#creaAltro'); if (creaAltro) { creaAltro.textContent = T('creaAltro'); creaAltro.href = linkSito('finale', 'crea-un-altro'); }\n    if (FINALE.foto && FOTO[FINALE.foto]) { $('#finaleImg').src = FOTO[FINALE.foto]; } else { $('#finaleImg').hidden = true; $('#end').classList.add('senzafoto'); }\n    $('#finaleFrase').textContent = FINALE.testo || ''; if (!FINALE.testo) $('#finaleFrase').hidden = true;\n    const tinta = (h, f) => '#' + [1, 3, 5].map(i => { const v = parseInt(h.slice(i, i + 2), 16); return Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)).toString(16).padStart(2, '0'); }).join('');\n    const COLFIN = (FINALE.colore && /^#[0-9a-fA-F]{6}$/.test(FINALE.colore)) ? FINALE.colore : '#2E3A1F';\n    const SFUMA = [tinta(COLFIN, 0.18), COLFIN, tinta(COLFIN, -0.55)];\n    $('#end').style.background = `linear-gradient(180deg, ${SFUMA[0]} 0%, ${SFUMA[1]} 45%, ${SFUMA[2]} 100%)`;\n\n    // ---------- Scena e disposizione: verticale (pad sotto) o orizzontale (pad ai bordi) ----------\n    const app = $('#app'), stage = $('#stage'), bar = $('.bar'), cvs = $('#c'), ctx = cvs.getContext('2d');\n    const W = 360, H = 240, G = 216;   // scena logica 3:2, terra a 216\n    let scale = 1, dpr = 1, modo = 'verticale';\n    const pad = AU.pad.crea($('#pad'));\n    pad.etichette = { X: mosse[0].emoji || 'X', Y: (mosse[1] || mosse[0]).emoji || 'Y' };\n    pad.didascalie = { stick: T('padStick'), tasti: T('padTasti') };\n    function resize() {\n      const vw = window.innerWidth, vh = window.innerHeight;\n      modo = vh > vw * 1.05 ? 'verticale' : 'orizzontale';\n      document.body.classList.toggle('orizzontale', modo === 'orizzontale');\n      let incornice = false; try { incornice = window.self !== window.top; } catch (e) { incornice = true; }\n      document.body.classList.toggle('incornice', incornice && !DEMO);   // aperto dal la inché trova spazio libero (fino a ~900 px: nei livelli pieni di colline i posti liberi sono pochi)\n        if (occupato(x) || x > arena - 120) continue;\n        S.malus.push({ def: d, w: m.w, h: m.h, x, y: volo ? quotaVolo(m.h, i) : G - m.h, x0: x, volo, dir: r() < 0.5 ? -1 : 1, hp: 2, hit: 0, nome: nomeDi(d) });\n      }\n      // niente dentro le rocce o gli ostacoli: quello che ci capita va in cima (Davide, 06/11/2026: \"impossibili da prendere\")\n      // sotto un'arcata invece l'oggetto resta a terra, da prendere strisciando: in cima all'arcata non si arriva più (v0.14)\n      for (const o of S.oggetti) { const s = S.solidi.find(s => o.x > s.x - 8 && o.x < s.x + s.w + 8 && o.y > s.y - 14); if (s) o.y = s.arco ? G - (o.h || 14) / 2 - 4 : s.y - (o.h || 16); if (S.mine.some(m => Math.abs(m.x - o.x) < 24)) o.y = Math.min(o.y, G - 40); }\n      Object.assign(S.pl, { x: 40, y: G, vx: 0, vy: 0, aria: false, duck: false, dir: 1, aimx: 1, aimy: 0, drop: 0, piatt: null, blast: null });\n      S.cam = 0;\n    }\n    function reset() {\n      Object.assign(S, { score: 0, cuori: MAXC(), lv: 0, giro: 1, scorte: { X: 1, Y: 1 }, toast: null, say: null, sayNext: 4, spazzati: 0, bossCount: 0, livelliFatti: 0, usate: 0, gettoni: 0, bonusPresi: 0, malusDistrutti: 0, mineDis: 0, newBest: false, line: '', fx: [], fine: 0 });\n      S.semeGioco = Math.floor(Math.random() * 100000) * 17; S.diffVista = diff;\n      S.pl.safe = 1; S.cut = null; S.flash = 0; S.tut = null; S.bersagli = []; costruisciLivello();\n    }\n    function start() { reset(); S.state = 'play'; aggiornaPad(); initAudio(); startMusic(); S.toast = { text: T('livello', { n: 1, livello: nomeDi(LV()) }), t: 2.6 }; }\n    function aggiornaPad() { pad.contatori = { X: S.scorte.X, Y: mosse[1] ? S.scorte.Y : null }; if (pausaBtn) pausaBtn.hidden = S.state !== 'play'; }\n    let lastFrase = '';\n    function say(testo, chi) {\n      if (!FRASI.length && !testo) return;\n      let f = testo; if (!f) { do { f = pick(FRASI); } while (FRASI.length > 1 && f === lastFrase); }\n      lastFrase = f; S.say = { text: f, t: chi ? 2.6 : 2.2, chi: chi || null }; S.sayNext = 9 + Math.random() * 7;\n    }\n    const pausaBtn = $('#pausa'), pausaOv = $('#pausaOv'), tuto = $('#tuto');\n    // nella pausa del tutorial il tasto \"Termina\" diventa \"Esci dal tutorial\" e c'è sempre\n    function pausa() { if (S.state !== 'play' || DEMO) return; S.state = 'pausa'; stopMusic(); aggiornaPad(); if (pausaOv) pausaOv.hidden = false; const tb = $('#termina'); if (tb) { tb.textContent = T(S.tut ? 'esciTut' : 'termina'); tb.hidden = !CHEAT && !S.tut; } const db = $('#disattiva'); if (db) db.hidden = !CHEAT; }\n    function termina() { if (S.state !== 'pausa') return; if (pausaOv) pausaOv.hidden = true; reset(); S.state = 'ready'; aggiornaPad(); tuto.hidden = false; }\n    function riprendi() { if (S.state !== 'pausa') return; if (pausaOv) pausaOv.hidden = true; S.state = 'play'; aggiornaPad(); startMusic(); pad.azzera(); }\n\n    // ---------- Tutorial interattivo (v0.13; Davide, 06/11/2026: \"prepara un tutorial interattivo che mostra come spostarsi, mirare, saltare, abbassarsi, usare le mosse finali e disinnescare bombe\") ----------\n    // Campo d'addestramento con la grafica del primo livello: ogni passo mette davanti al protagonista la cosa da provare e va avanti solo quando è fatta.\n    // Qui non si perdono cuori (colpitoPl dà solo il contraccolpo), niente boss né arena, i nemici non sparano e reggono la mitragliatrice: li spazza solo la mossa.\n    const PASSI = ['muovi', 'mira', 'salta', 'giu', 'mina', 'mossa'].concat(mosse[1] ? ['mossa2'] : []);\n    const CHIAVE_PASSO = { muovi: 'tpMuovi', mira: 'tpMira', salta: 'tpSalta', giu: 'tpGiu', mina: 'tpMina', mossa: 'tpMossa', mossa2: 'tpMossa2' };\n    function testoPasso(k) {\n      const m = k === 'mossa2' ? 1 : 0, v = { emoji: (mosse[m] && mosse[m].emoji) || TASTO_MOSSA[m], mossa: nomeDi(mosse[m]) };\n      return T(CHIAVE_PASSO[k], v);   // senza i tasti della tastiera (Davide, 06/11/2026: \"nel tutorial togli le indicazioni su come usare la tastiera\")\n    }\n    function avviaTutorial() {\n      tuto.hidden = true; initAudio(); pad.azzera(); reset();\n      Object.assign(S, { L: 4000, piatt: [], pozze: [], posti: [], oggetti: [], malus: [], mine: [], solidi: [], nemici: [], bersagli: [] });\n      S.tut = { i: -1, k: '', t: 0, attesa: 0, testo: '', punta: null, avviso: null, bandiera: null };\n      S.state = 'play'; aggiornaPad(); startMusic(); passoTut(0);\n    }\n    function passoTut(i) {\n      const tu = S.tut, x0 = S.pl.x + corpoW(PRO.corpo) / 2;\n      Object.assign(tu, { i, t: 0, attesa: 0, punta: null, avviso: null, usata: -1 });\n      if (i >= PASSI.length) { tu.k = 'fine'; tu.fine = 2.8; tu.testo = T('tpFine'); fanfare(); return; }\n      const k = tu.k = PASSI[i]; tu.testo = testoPasso(k);\n      if (k === 'muovi') { tu.bandiera = x0 + 190; tu.punta = { x: tu.bandiera, y: G - 56 }; }\n      else if (k === 'mira') S.bersagli = [{ x: x0 + 70, y: G - 108, r: 10 }, { x: x0 + 190, y: G - 116, r: 10 }, { x: x0 + 290, y: G - 100, r: 10 }];   // sotto il cartello del passo, sopra la linea di tiro dritta\n      else if (k === 'salta') {   // un ostacolo vero del livello, alto 40: si passa solo saltando\n        const o = (LV().ostacoli || [])[0], w = o ? o.w : 36, h = 40, x = x0 + 130;\n        S.solidi.push(o ? { def: o, x, y: G - h, w, h, seme: 0.5 } : { x, y: G - h, w, h, seme: 0.5 }); tu.meta = x + w + 4; tu.punta = { x: x + w / 2, y: G - h - 14 };\n      }\n      else if (k === 'giu') {   // arcata con la volta alta: sopra non si sale, sotto si passa solo abbassati\n        const x = x0 + 130, w = 96; S.solidi.push({ roccia: true, arco: true, x, y: G - 34 - 60, w, h: 60, seme: 0.37 }); tu.meta = x + w + 4; tu.punta = { x: x + w / 2, y: G - 34 - 60 - 14 };\n      }\n      else if (k === 'mina') { tu.minaX = x0 + 120; tu.mine0 = S.mineDis; S.mine = [{ x: tu.minaX, stato: 'armata', prog: 0 }]; tu.punt 'tutOk'), '#9be36b'); fanfare(); }\n    }\n    function esciTutorial() {\n      try { localStorage.setItem(ID + '-tutorial', '1'); } catch (e) {}\n      reset(); S.state = 'ready'; stopMusic(); aggiornaPad(); pad.azzera(); tuto.hidden = false;\n    }\n    if (tutBtn) tutBtn.addEventListener('click', e => { e.stopPropagation(); avviaTutorial(); });\n    // disegni del tutorial, nel mondo: bandiera, bersagli, freccia che indica cosa fare\n    function drawTut() {\n      const tu = S.tut;\n      if (tu.bandiera != null && inScena(tu.bandiera, 30)) {\n        const x = tu.bandiera; ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 1, G - 46, 3, 46); ctx.fillStyle = '#1b1b1b'; ctx.fillRect(x - 3, G - 3, 7, 3);\n        const sv = Math.sin(S.anim * 6) * 2; ctx.fillStyle = '#4b5d2a'; ctx.beginPath(); ctx.moveTo(x + 2, G - 46); ctx.lineTo(x + 26, G - 40 + sv); ctx.lineTo(x + 2, G - 32); ctx.closePath(); ctx.fill();\n        stella(x + 11, G - 39 + sv / 2, 4, '#ffd166');\n      }\n      for (const b of S.bersagli) {\n        const bob = Math.sin(S.anim * 2 + b.x) * 2, y = b.y + bob;\n        ctx.strokeStyle = 'rgba(30,30,30,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(b.x, 0); ctx.lineTo(b.x, y - b.r); ctx.stroke();\n        for (const [r, c] of [[b.r + 1.5, '#1b1230'], [b.r, '#fff'], [b.r * 0.72, '#e23b3b'], [b.r * 0.46, '#fff'], [b.r * 0.22, '#e23b3b']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(b.x, y, r, 0, 7); ctx.fill(); }\n      }\n      if (tu.punta) {   // freccia gialla che rimbalza sopra la cosa da fare\n        const x = tu.punta.x, y = tu.punta.y + Math.sin(S.anim * 7) * 3;\n        ctx.fillStyle = '#1b1230'; ctx.beginPath(); ctx.moveTo(x - 8, y - 11); ctx.lineTo(x + 8, y - 11); ctx.lineTo(x, y + 1); ctx.closePath(); ctx.fill();\n        ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(x - 5.5, y - 9.5); ctx.lineTo(x + 5.5, y - 9.5); ctx.lineTo(x, y - 1.5); ctx.closePath(); ctx.fill();\n      }\n    }\n    // cartello in alto con il passo e cosa fare c.px || 2) : 0);\n    function boxPl() { const p = S.pl, h = p.duck && !p.aria ? 30 : altezzaTot(PRO.corpo) - 3; return { x: p.x + 6, y: p.y - h, w: corpoW(PRO.corpo) - 12, h }; }\n    const boxN = n => ({ x: n.x + 4, y: n.y - n.h + 4, w: n.w - 8, h: n.h - 6 });\n    const boxBoss = b => ({ x: b.x + 6, y: b.y - b.h + 8, w: b.w - 12, h: b.h - 10 });\n    const urta = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;\n    const inScena = (x, m) => x > S.cam - (m || 20) && x < S.cam + W + (m || 20);\n    const blastDi = dir => ({ vx: dir * (160 + Math.random() * 160), vy: -(300 + Math.random() * 160), rot: 0, vr: dir * (6 + Math.random() * 6), t: 0 });\n    function stelline(x, y, n) { for (let i = 0; i < (n || 8); i++) { const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120; S.fx.push({ tipo: 'stella', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0.7 + Math.random() * 0.4, c: pick(['#F5B700', '#ffd166', '#fff', '#ff8fab']) }); } }\n    function pop(x, y, text, col) { S.fx.push({ tipo: 'pop', x, y, t: 0.9, text, col: col || '#d94d63' }); }\n    function fumo(x, y, n) { for (let i = 0; i < (n || 5); i++) S.fx.push({ tipo: 'fumo', x: x + (Math.random() - 0.5) * 14, y: y + (Math.random() - 0.5) * 8, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, t: 0.8 + Math.random() * 0.6, r: 4 + Math.random() * 5 }); }\n    function scoppio(x, y, r) { S.fx.push({ tipo: 'scoppio', x, y, t: 0.35, r: r || 18 }); fumo(x, y, 6); }\n    function coriandoli(x, y, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220; S.fx.push({ tipo: 'coriandolo', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, t: 0.9 + Math.random() * 0.6, c: pick(['#F5B700', '#ff5c5c', '#5aa9e6', '#2fbf71', '#ff8fab', '#fff']), r: Math.random() * 6 }); } }\n\n    // ---------- Protagonista ----------\n    function colpitoPl(dir, chi) {\n      const p = S.pl; if (p.safe > 0 || CHEAT || DEMO || S.st    function spara() {\n      const p = S.pl, c = PRO.corpo, w = corpoW(c), top = p.y - corpoH(c);\n      const ax = p.aimx, ay = p.aimy, n = Math.hypot(ax, ay) || 1;\n      const piv = pivotArma(p.x, w, top, p.dir, p.duck && !p.aria);\n      const mx = piv.x + ax / n * 14, my = piv.y + ay / n * 14;\n      S.colpi.push({ x: mx, y: my, vx: ax / n * 430, vy: ay / n * 430, t: 1.1, r: 3 });\n      S.fx.push({ tipo: 'fiamma', x: mx + ax / n * 3, y: my + ay / n * 3, t: 0.06, r: 5 });\n      if (ac && Math.random() < 0.7) tone(900 + Math.random() * 300, ac.currentTime, 0.04, 'square', 0.012, 500);\n    }\n    // dove sta la mano che regge l'arma: dal corpo (`mano`, in celle dello sprite) oppure una stima\n    function pivotArma(x, w, top, dir, basso) { const c = PRO.corpo, px = c.px || 2; if (c.mano) return { x: x + w / 2 + dir * (c.mano.x * px - w / 2), y: top + c.mano.y * px * (basso ? 0.55 : 1) }; return { x: x + w / 2 + dir * w * 0.3, y: top + (basso ? 14 : 9) }; }\n    function updatePl(dt) {\n      const p = S.pl, st = pad.stato;\n      if (p.safe > 0) p.safe -= dt; if (p.drop > 0) p.drop -= dt; p.fuoco -= dt;\n      // comandi: joystick muove e mira, A salta, B si abbassa\n      // il joystick serve solo a muoversi a destra e a sinistra e a mirare (16 direzioni); salto e abbassarsi hanno i tasti A e B (Davide, 06/11/2026)\n      const dx = st.dx, mx = st.mx || 0, my = st.my || 0, mira = mx !== 0 || my !== 0;\n      const pw = corpoW(PRO.corpo), ph0 = altezzaTot(PRO.corpo);\n      // sotto un'arcata si resta abbassati finché non si esce (e non si salta)\n      p.sotto = !p.aria && S.solidi.some(s => p.x + pw - 7 > s.x && p.x + 7 < s.x + s.w && p.y - ph0 < s.y + s.h && p.y > s.y + s.h - 1);\n      p.duck = (st.B && !p.aria) || p.sotto;\n      if (pad.scatta('A')) salta();\n      if (!st.A && p.aria && p.vy < CUT) p.vy = CUT;\n      if (pad.scatta('X')) mossa(0); if (pad.scatta('Y')) mossa(1);\n      const corre = dx !== 0 && !p.duck;\n      if (dx !== 0) p.dir = dx; el  oy, t: 0.05, r: tipo === 'cecchino' ? 5 : 3 }); beep(tipo === 'cecchino' ? 520 : 300, 0.06, 'square', 0.025, tipo === 'cecchino' ? 180 : 480);\n    }\n    const DISINNESCO = 64, MAX_IN_SCENA = () => DIFF[diffA()].scena;\n    function updateNemici(dt) {\n      const p = S.pl, pc = p.x + corpoW(PRO.corpo) / 2;\n      // piazzati dal livello: entrano in scena quando la telecamera si avvicina\n      // al massimo MAX_IN_SCENA nemici vivi sullo schermo (Davide, 06/11/2026); chi resta in attesa entra quando uno viene spazzato via\n      let inScenaN = S.nemici.filter(n => !n.blast && n.x > S.cam - 40 && n.x < S.cam + W + 40).length;\n      for (const q of S.posti) {\n        if (q.fatto || !q.chi) continue;\n        if (q.x < S.cam - 40) { q.fatto = true; continue; }\n        if (q.x < S.cam + W + 24 && inScenaN < MAX_IN_SCENA()) { q.fatto = true; inScenaN++; S.nemici.push(creaNemico(q.chi, q.x, q.y)); }\n      }\n      for (const n of S.nemici) {\n        n.t += dt; if (n.hit > 0) n.hit -= dt;\n        if (n.blast) { n.blast.t += dt; n.x += n.blast.vx * dt; n.y += n.blast.vy * dt; n.blast.vy += 900 * dt; n.blast.rot += n.blast.vr * dt; continue; }\n        if (!inScena(n.x, 60)) continue;\n        const dx = pc - (n.x + n.w / 2); n.dir = dx < 0 ? -1 : 1;\n        const vuole = ARMA_DIST[n.arma] != null ? ARMA_DIST[n.arma] : 96;\n        if (n.mira > 0) { n.mira -= dt; n.fermo = true; if (n.mira <= 0) { const ox = n.x + n.w / 2 + n.dir * 18, oy = n.y - corpoH(n.corpo) + 8; sparaNemico(n, 'cecchino', ox, oy, pc, p.y - (p.duck && !p.aria ? 10 : 19)); } }\n        else if (Math.abs(dx) > vuole) {\n          // cammina verso il protagonista, ma non scende dalla piattaforma su cui sta e si ferma davanti agli ostacoli (l'assalto corre, più del doppio)\n          const nx = n.x + n.dir * VELN * (n.arma === 'assalto' ? 2.3 : 1) * vel() * dt;\n          const sopra = n.y < G ? (S.piatt.find(q => Math.abs(q.y - n.y) < 1 && n.x + n.w / 2 > q.x - 4 && n.x + n.w / 2 < q.x + q.w + 4)   // ---------- emoji: tutte quelle che il dispositivo sa disegnare, scelte da una griglia (mai digitate) ----------

  let EMOJI = null;
  function tuttiEmoji() {

  // ---------- controllo immediato dei testi: parole e espressioni vietate (src/parole-vietate.js) ----------
  // Primo livello, sul telefono: campo in rosso e motivo appena si scrive. Si può aggirare: il controllo definitivo lo fa il server prima del pagamento.
  const VIETATE = window.ARCADEU_VIETATE || [];
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's', '€': 'e', '!': 'i' };
  const pulisci = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const SEP = /[^a-z0-9一-鿿]+/g;
  function controllaTesto(testo) {
    if (!testo) return null;
    const base = pulisci(testo), leet = base.replace(/[013457@$€!]/g, ch => LEET[ch] || ch), comprimi = s => s.replace(/(.)\1+/g, '$1');
    const forme = [...new Set([base, leet, comprimi(base), comprimi(leet)])];

    const unisci = f => { const t = f.split(SEP).filter(Boolean), out = []; for (let i = 0; i < t.length;) { if (t[i].length === 1) { let j = i; while (j < t.length && t[j].length === 1) j++; if (j - i >= 3) { out.push(t.slice(i, j).join('')); i = j; continue; } } out.push(t[i]); i++; } return ' ' + out.join(' ') + ' '; };

        if (p.tipo === 'persone') { PERS[p.chiave].splice(0, PERS[p.chiave].length, ...(bp[p.chiave] || []).map(corpoOk)); if (!PERS[p.chiave].length) PERS[p.chiave].push({ nome: '', corpo: null, foto: null, frasi: [] }); }
      }
      if (persi) setTimeout(() => toast(tr('Alcune scelte non sono più disponibili: controlla i passi prima di creare il gioco.')), 2500);
      rendiPersone(); rendiSlot(); aggiornaColore();
      for (const p of SCELTE) { if (p.emoji) for (const id of SCH[p.chiave]) if (id.startsWith('emoji:')) { const [, ch, fam] = id.split(':'); cardEmoji(p, id, ch, etichettaEmoji(p, fam)); } aggiorna(p); }
      if (PASSO_FRASI) [...document.getElementById(PASSO_FRASI.chiave).querySelectorAll('input')].forEach((inp, i) => { inp.value = SCH[PASSO_FRASI.chiave][i] || ''; });
      for (const inp of document.querySelectorAll('input[type=text]')) segnalaCampo(inp);
      mostraPasso(Math.min(b.passo || 0, PASSI.length - 2));
    } finally { ripristinando = false; }
  }
  async function blocca() {
    if (bloccato) return; bloccato = true; fermaMusica(); $('#provaVerticale').srcdoc = ''; clearTimeout(timerBozza);
    for (const s of PASSI) if (s.id !== 'finaleBox') { s.style.pointerEvents = 'none'; s.style.opacity = '.6'; for (const e of s.querySelectorAll('input, select, textarea, button')) e.disabled = true; }
    if (!GIOCO) {
      // se il gioco non si riesce a comporre, la pagina non resta bloccata senza gioco: si sblocca e si torna al controllo
      let r = null; try { r = await componi(); } catch (e) { console.warn('composizione', e); }
      if (!r) { sblocca(); mostraPasso(PASSI.length - 2); toast(tr('Non sono riuscito a creare il gioco: controlla i passi e riprova.')); return; }
      r.dichiarazione = dichiarazione(); GIOCO = r; await scriviCreato(r); await cancellaBozza();
    }
    mostraPasso(PASSI.length - 1);
  }
  function sblocca() {
    bloccato = false;
    for (const s of PASSI) if (s.id !== 'finaleBox') { s.style.pointerEvents = ''; s.style.opacity = ''; for (const e of s.querySelectorAll('input, select, textarea, button')) e.disabled = false; }
    rendiDichiara();
  }
  // conferma prima di creare il gioco
  $('#avanti').addEventListener('click', () => { if (PASSI_DEF[passo].tipo === 'controllo') $('#conferma').hidden = false; else mostraPasso(passo + 1); });
  $('#confermaNo').addEventListener('click', () => $('#conferma').hidden = true);
  $('#confermaSi').addEventListener('click', () => { $('#conferma').hidden = true; mostraPasso(passo + 1); });
  $('#indietro').addEventListener('click', () => mostraPasso(passo - 1));
  for (const e of document.querySelectorAll('input, textarea')) e.setAttribute('autocomplete', 'off');
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
  // solo per la versione di prova: 5 tocchi sul gettone in alto dimenticano il gioco creato e si ricomincia
  (() => { let n = 0, at = 0; $('header svg').addEventListener('pointerdown', async () => { const now = performance.now(); n = now - at < 1500 ? n + 1 : 1; at = now; if (n >= 5) { n = 0; if (!(bloccato || GIOCO || await leggiBozza())) return; if (confirm(tr('Vuoi davvero ricominciare da capo? Il gioco creato o la configurazione in corso verranno dimenticati.'))) { await cancellaCreato(); await cancellaBozza(); location.reload(); } } }); })();
  window.__AU_CFG = { DESC, ritaglia, PERS, SCH, componi, scheda, anteprima, aggiornaTasti, mostraPasso, blocca, leggiCreato, cancellaCreato, caricaImmagine, eHeif, controllaFile, controllaTesto, testiVietati, leggiBozza, cancellaBozza, ripristinaBozza, fotografaStato, scriviBozza, rendiPersone, rendiSlot, valida, requisiti, riepilogo, tr };
  cambiato = () => { pianificaAnteprima(); aggiornaTasti(); aggiornaPasso(); pianificaBozza(); };
  (async () => {
    const c = await leggiCreato(); traduciPagina();
    if (c) { GIOCO = c; if (c.s && c.s.lingua) { $('#lingua').value = c.s.lingua; traduciPagina(); } blocca(); return; }
    const b = await leggiBozza();
    if (b && b.quando && Date.now() - b.quando < BOZZA_GIORNI * 86400000) { try { ripristinaBozza(b); toast(tr('Ho ripreso la tua configurazione da dove l\'avevi lasciata.')); } catch (e) { console.warn('bozza', e); mostraPasso(0); } }
    else mostraPasso(0);
    aggiornaTasti();
  })();
  $('#gioca').addEventListener('click', async () => {
    const r = GIOCO || await componi(); if (!r) return;
    const sc = $('#schermo'); sc.innerHTML = ''; const f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-modals allow-downloads allow-popups allow-popups-to-escape-sandbox'); f.setAttribute('allow', 'web-share'); f.srcdoc = r.html; sc.append(f); sc.style.display = 'block'; $('#chiudi').style.display = 'block'; blocca();
  });
  $('#chiudi').addEventListener('click', () => { $('#schermo').style.display = 'none'; $('#schermo').innerHTML = ''; $('#chiudi').style.display = 'none'; });
  $('#scarica').addEventListener('click', async () => {
    const r = GIOCO || await componi(); if (!r) return;
    const blob = new Blob([r.html], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = slug(r.titolo) + '.html'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(tr('File pronto: ') + a.download); blocca();
  });
  $('#salva').addEventListener('click', async () => {
    const r = GIOCO || await componi(); if (!r) return;
    try {
      const d = await new Promise((ok, ko) => { const q = indexedDB.open('miei-giochi', 1); q.onupgradeneeded = () => { const st = q.result.createObjectStore('giochi', { keyPath: 'id', autoIncrement: true }); st.createIndex('nome', 'nome', { unique: false }); }; q.onsuccess = () => ok(q.result); q.onerror = () => ko(q.error); });
      await new Promise((ok, ko) => { const t = d.transaction('giochi', 'readwrite'); t.objectStore('giochi').add({ nome: r.titolo, html: r.html, peso: r.html.length, aggiunto: Date.now() }); t.oncomplete = ok; t.onerror = () => ko(t.error); });
      toast(tr('Salvato: lo trovi nel lanciatore "I miei giochi"')); blocca();
    } catch (e) { toast(tr('Non sono riuscito a salvare: usa "Scarica il file"')); }
  });
})();
</script>
