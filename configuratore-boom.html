<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArcadeU, crea il tuo gioco</title>
<meta name="description" content="Configuratore di prova del gioco Boom di ArcadeU: scegli livelli, cattivi, boss e mosse, metti le facce e le frasi, e ricevi il file del gioco.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23F5B700'/%3E%3Ccircle cx='32' cy='32' r='13.5' fill='%233B1E6E'/%3E%3Ccircle cx='27' cy='29' r='2' fill='%23F5B700'/%3E%3Ccircle cx='37' cy='29' r='2' fill='%23F5B700'/%3E%3Cpath d='M29 34.5l7.4 3.7-7.4 3.7z' fill='%23F5B700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
  /* Libreria condivisa del configuratore ArcadeU (06/11/2026): la pagina è generica, i passi li costruisce il descrittore del gioco
     (window.ARCADEU_DESCRITTORE, per esempio corsa/configuratore/descrittore.js). Stile dalle brand guidelines: viola, oro, Outfit. */
  [hidden]{display:none !important}
  :root{ --viola:#3B1E6E; --oro:#F5B700; --crema:#FFF7E0; --ink:#1B1230; --ink2:rgba(27,18,48,.62); --grigio:#F3F1F8; --linea:rgba(27,18,48,.1); --corallo:#FF5C5C; --verde:#2FBF71; --ombra:0 8px 28px rgba(59,30,110,.10); }
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--grigio);color:var(--ink);font-family:Outfit,"Helvetica Neue",Arial,sans-serif;font-weight:400;padding:0 16px 120px}
  header{background:var(--viola);color:#fff;margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;display:flex;align-items:center;gap:12px}
  header svg{width:40px;height:40px;flex:none}
  header > div{display:flex;align-items:center;min-height:40px}
  header h1{margin:0;font-size:22px;line-height:1;font-weight:800;letter-spacing:-.02em}
  header p{margin:2px 0 0;font-size:13px;color:rgba(255,255,255,.8)}
  main{max-width:720px;margin:0 auto}
  section{background:#fff;border-radius:16px;box-shadow:var(--ombra);padding:18px;margin-top:16px}
  h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  h2 .n{width:26px;height:26px;border-radius:50%;background:var(--oro);color:var(--viola);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .sotto{margin:0 0 12px;color:var(--ink2);font-size:14px;line-height:1.45}
  label.campo{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
  input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--ink)}
  input[type=text]:focus,select:focus,textarea:focus{outline:3px solid var(--oro);border-color:var(--viola)}
  input[type=text].vietato{border-color:#FF5C5C;background:#fff4f4}
  .vietato-msg{margin:4px 0 0;color:#B3261E;font-size:13px;line-height:1.35}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .griglia.larga{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .card{border:2px solid var(--linea);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;background:#fff;user-select:none;-webkit-user-select:none;position:relative;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .card canvas,.card .em{width:44px;height:44px;image-rendering:pixelated;display:block}
  .card .em{font-size:30px;line-height:44px}
  .card canvas.sc{width:84px;height:42px;image-rendering:auto;border-radius:6px}
  .card canvas.sc.tre-due{height:56px}
  .card .sw{width:44px;height:30px;border-radius:8px}
  .card span{font-size:12px;line-height:1.2;color:var(--ink)}
  .card.on{border-color:var(--viola);background:var(--crema)}
  .card.on::after{content:attr(data-ord);position:absolute;top:-8px;right:-8px;background:var(--viola);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .card.off{opacity:.45;pointer-events:none}
  .card .play{margin-top:4px;border:1.5px solid var(--viola);background:#fff;color:var(--viola);border-radius:999px;padding:4px 10px;font:600 12px Outfit,Arial,sans-serif;cursor:pointer;pointer-events:auto}
  .card .play.on{background:var(--viola);color:#fff}
  .riga{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font:600 15px Outfit,Arial,sans-serif;border:2px solid var(--viola);background:var(--viola);color:#fff;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
  .btn.oro{background:var(--oro);color:var(--viola);border-color:var(--oro)}
  .btn.sec{background:transparent;color:var(--viola)}
  .btn.mini{padding:8px 14px;font-size:13px;min-height:36px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .pers{border:1.5px solid var(--linea);border-radius:14px;padding:12px;margin-top:10px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
  .pers .viso{width:72px;height:96px;border-radius:50%;border:3px solid var(--oro);background:var(--grigio) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);text-align:center;cursor:pointer}
  .pers .viso.ok{color:transparent}
  .pers .corpi{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pers .corpi .card{min-height:64px;padding:4px;width:64px}
  .pers .corpi canvas{width:32px;height:40px}
  .pers .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--ink2);font-size:20px;cursor:pointer}
  .pers{position:relative}
  .pers select.arma{margin-top:6px;font-size:14px;padding:8px 10px}
  .frasi input{margin-top:6px}
  .conta{font-size:12px;color:var(--ink2);text-align:right;margin-top:4px}
  .foto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .foto .slot{border:1.5px dashed var(--linea);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--ink2);aspect-ratio:3/4;width:100%;max-width:200px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background-size:cover;background-position:center;cursor:pointer}
  .foto .slot.ok{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);border-style:solid}
  .foto input[type=text]{margin-top:6px;font-size:14px;padding:8px 10px}
  .foto.uno{grid-template-columns:1fr}
  .foto.uno input[type=text]{max-width:320px;display:block;margin-left:auto;margin-right:auto}
  .foto.tre{grid-template-columns:1fr 1fr 1fr}
  @media (max-width:520px){ .foto.tre{grid-template-columns:1fr 1fr} }
  #picker{position:fixed;inset:0;background:rgba(27,18,48,.6);z-index:75;display:flex;align-items:flex-end;justify-content:center}
  #picker[hidden]{display:none}
  .pbox{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:70vh;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}
  .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .ptop button{border:0;background:none;font-size:24px;color:var(--ink2);cursor:pointer}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
  .pgrid button{font-size:26px;background:none;border:0;border-radius:10px;height:46px;cursor:pointer;line-height:1}
  .pgrid button:hover{background:var(--crema)}
  .err{color:var(--corallo);font-weight:600;font-size:14px;margin:8px 0 0;display:none}
  .err.on{display:block}
  .fondo{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -8px 28px rgba(59,30,110,.15);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:30}
  .fondo .btn{flex:1 1 140px}
  #schermo{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #schermo iframe{border:0;width:100%;height:100%;display:block}
  #chiudi{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;border:0;border-radius:999px;background:rgba(59,30,110,.6);color:#fff;font:600 13px Outfit,Arial,sans-serif;padding:8px 14px;display:none}
  /* ritaglio del viso */
  #ritaglio{position:fixed;inset:0;background:rgba(27,18,48,.92);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff}
  #ritaglio canvas{background:#000;border-radius:12px;touch-action:none;max-width:100%}
  #ritaglio input[type=range]{width:min(100%,300px);accent-color:var(--oro)}
  #ritaglio p{margin:0;font-size:14px;color:rgba(255,255,255,.8);text-align:center}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--viola);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;display:none;max-width:90vw;text-align:center}
  .avviso{background:var(--crema);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);margin-top:10px}
  .anteprima{position:sticky;top:0;z-index:25;background:var(--grigio);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .anteprima .cornice{background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--ombra);height:176px;position:relative}
  #velo{position:absolute;inset:0;background:rgba(27,18,48,.93);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:14px;padding:12px;z-index:2}
  #velo[hidden]{display:none}
  .card.pers-emoji{border-style:dashed;border-color:var(--viola)}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .ptabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptabs button{flex:none;border:1.5px solid var(--linea);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12px Outfit,Arial,sans-serif;cursor:pointer}
  .ptabs button.on{background:var(--viola);color:#fff;border-color:var(--viola)}
  .famEmoji{font-size:64px;line-height:1.2;text-align:center;margin:6px 0 2px}
  #pickerFam .btn{flex:1 1 120px;max-width:200px}
  .telefono{width:min(100%,300px);aspect-ratio:9/16;margin:12px auto 0;border:8px solid #1b1230;border-radius:28px;overflow:hidden;background:#000;box-shadow:var(--ombra)}
  .telefono iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
  .avviso.stop{border:2px solid var(--corallo);font-weight:600}
  .dichiara{background:var(--crema);border-radius:16px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .dichiara h3{margin:0 0 2px;font-size:15px;color:var(--viola)}
  .dichiara label{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink);cursor:pointer}
  .dichiara input[type=checkbox]{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--viola)}
  .dichiara a{color:var(--viola);font-weight:600}
  .anteprima .cornice{transition:height .25s}
  #ritaglio label{font-size:13px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px}
  .pgrid button{font-size:24px;height:42px}
  .anteprima iframe{width:100%;height:100%;border:0;display:block;pointer-events:none;background:#24123F}
  .momenti{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
  .momenti::-webkit-scrollbar{display:none}
  .momenti button{flex:none;border:1.5px solid var(--linea);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12px Outfit,Arial,sans-serif;cursor:pointer}
  .momenti button.on{background:var(--viola);color:#fff;border-color:var(--viola)}
  .gruppo{font-size:12px;font-weight:600;color:var(--ink2);margin:8px 0 2px;width:100%}
  .colori{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .colori button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .colori button.on{border-color:var(--oro);box-shadow:0 0 0 2px var(--viola)}
  .colori input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
  .stato{font-size:13px;color:var(--ink2);margin-top:6px}
  .azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .azioni .btn{flex:1 1 150px}
  .riepilogo{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--grigio);border-radius:12px;padding:12px}
  .riepilogo dt{color:var(--ink2)} .riepilogo dd{margin:0;font-weight:600}
  .fondo{justify-content:space-between;align-items:center}
  .fondo .btn{flex:0 1 150px}
  .passoInd{font-weight:600;color:var(--ink2);font-size:13px;flex:1;text-align:center;line-height:1.3}
  main > section[hidden]{display:none}
  #conferma{position:fixed;inset:0;background:rgba(27,18,48,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
  #conferma[hidden]{display:none}
  .cbox{background:#fff;border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:var(--ombra)}
  .cbox h3{margin:0 0 6px;font-size:18px} .cbox p{margin:0 0 14px;color:var(--ink2);font-size:14px}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#F5B700"/><circle cx="60" cy="60" r="47.4" fill="none" stroke="#3B1E6E" stroke-width="3.2" stroke-dasharray="4.3 4.3"/><circle cx="60" cy="60" r="23.7" fill="#3B1E6E"/><circle cx="51.4" cy="54.6" r="3.4" fill="#F5B700"/><circle cx="68.6" cy="54.6" r="3.4" fill="#F5B700"/><path d="M54.6 64.3 l12.9 6.5 l-12.9 6.5 z" fill="#F5B700"/></svg>
  <div><h1>Crea il tuo gioco</h1></div>
</header>

<main>
<div class="anteprima">
  <div class="cornice"><iframe id="anteprima" title="Anteprima animata" sandbox="allow-scripts allow-same-origin"></iframe><div id="velo" hidden></div></div>
  <div class="momenti" id="momenti"></div>
</div>
<!-- i passi (le <section>) li costruisce il descrittore: vedi costruisciPassi() -->
</main>

<div class="fondo">
  <button class="btn sec" type="button" id="indietro">Indietro</button>
  <span class="passoInd" id="passoInd"></span>
  <button class="btn oro" type="button" id="avanti">Avanti</button>
</div>

<div id="schermo"></div><button id="chiudi" type="button">Chiudi il gioco</button>
<div id="picker" hidden><div class="pbox"><div class="ptop"><b id="pickerTitolo">Scegli un'emoji</b><button type="button" id="pickerNo" aria-label="Chiudi">×</button></div><div id="pickerScelta"><div class="ptabs" id="pickerTabs"></div><div class="pgrid" id="pickerGrid"></div></div><div id="pickerFam" hidden><div class="famEmoji" id="pickerFamEmoji"></div><p class="sotto" id="pickerFamChi" style="text-align:center;font-size:16px;color:var(--ink)"></p><div class="riga" style="justify-content:center;gap:12px"><button class="btn oro" type="button" id="famTerra"></button><button class="btn" type="button" id="famVolo"></button></div></div></div></div>
<div id="ritaglio">
  <p id="ritaglioTesto"></p>
  <canvas id="ritaglioCv" width="260" height="340"></canvas>
  <label>Zoom <input type="range" id="zoom" min="0.5" max="4" step="0.01" value="1"></label>
  <label>Rotazione <input type="range" id="rotazione" min="-180" max="180" step="1" value="0"></label>
  <div class="riga"><button class="btn sec mini" type="button" id="ritaglioSpecchia" style="color:#fff;border-color:#fff">⇋ Specchia</button><button class="btn sec" type="button" id="ritaglioNo" style="color:#fff;border-color:#fff">Annulla</button><button class="btn oro" type="button" id="ritaglioOk">Usa questo viso</button></div>
</div>
<div id="conferma" hidden><div class="cbox"><h3>Vuoi creare il gioco?</h3><p>Dopo non potrai più modificarlo né tornare indietro.</p><div class="riga" style="justify-content:flex-end"><button class="btn sec" type="button" id="confermaNo">Annulla</button><button class="btn oro" type="button" id="confermaSi">Sì, crea il gioco</button></div></div></div>

    // difficoltà: velocità dei nemici e cadenza del loro fuoco
    // abbassate tutte e tre il 06/11/2026 ("mi sembra abbastanza difficile"): v = velocità dei nemici, fuoco = moltiplicatore delle pause tra un colpo e l'altro, hp = colpi in più per abbatterli
    // cuori = vita massima (Davide, 06/11/2026: 6 in Facile, 4 in Normale, 3 in Difficile)
    // rialzate il 06/11/2026 (v0.14, Davide: "adesso è troppo semplice: l'attuale normale mettila come facile, poi ne fai due più difficili a salire")
    // v0.16 (Davide, 06/11/2026: "in modalità normale i nemici devono essere più resistenti ed in modalità difficile devono essercene proprio di più"):
    // nemici = quanti se ne provano a piazzare per livello (+2 per giro; quelli che non trovano posto si tolgono), scena = quanti al massimo sullo schermo, distanza = spazio minimo tra due nemici; hp = colpi in più oltre i 2 di base
    const DIFF = { facile: { v: 0.88, fuoco: 1.35, hp: 0, boss: 0, cuori: 6, nemici: 8, scena: 2, distanza: 150, primo: 620 },
      normale: { v: 1.0, fuoco: 1.1, hp: 3, boss: 6, cuori: 4, nemici: 8, scena: 2, distanza: 150, primo: 620 },
      difficile: { v: 1.14, fuoco: 0.82, hp: 4, boss: 14, cuori: 3, nemici: 16, scena: 3, distanza: 90, primo: 480 },   // primo = dove sta il primo nemico (in Difficile poco più di una schermata di calma)
      // "extreme" (v0.22, Davide): non si sceglie all'inizio, ci si arriva salendo; come Difficile ma con un cuore solo e punti tripli (MOLT)

    const diffA = () => ORDINE_DIFF[Math.min(3, ORDINE_DIFF.indexOf(diff) + Math.max(0, S.livelliFatti - 2))];

    const MAXC = () => DIFF[diffA()].cuori;

    }

    // ---------- Protagonista ----------
    function colpitoPl(dir, chi) {

    // dove sta la mano che regge l'arma: dal corpo (`mano`, in celle dello sprite) oppure una stima
    function pivotArma(x, w, top, dir, basso) { const c = PRO.corpo, px = c.px || 2; if (c.mano) return { x: x + w / 2 + dir * (c.mano.x * px - w / 2), y: top + c.mano.y * px * (basso ? 0.55 : 1) }; return { x: x + w / 2 + dir * w * 0.3, y: top + (basso ? 14 : 9) }; }

// Aiuti per le mosse finali di Boom (v0.21): traiettorie, esplosioni, fungo atomico e lampo. Non è un modulo del catalogo.
// Dal 06/11/2026 sera (richiesta di Davide) ogni mossa viene lanciata verso i nemici: il motore dà a ogni effetto il punto di partenza
// (e.x0, e.y0), il bersaglio a terra nella metà dello schermo davanti al protagonista (e.tx, e.ty), la direzione (e.dir) e la telecamera
// al lancio (e.cam); spazza via tutto al momento di `ritardo` e tiene l'animazione per altri `coda` secondi.
AU.fuoco = {
  // posizione lungo una parabola da (x0, y0) a (tx, ty), k da 0 a 1, alta `h` px
  parabola(e, k, h) { return { x: e.x0 + (e.tx - e.x0) * k, y: e.y0 + (e.ty - e.y0) * k - (h == null ? 110 : h) * Math.sin(k * Math.PI) }; },
  // esplosione: palla di fuoco a tre strati, onda d'urto, detriti; q da 0 (scoppio) a 1 (spenta); R = raggio massimo della palla
  esplosione(ctx, x, y, q, R) {
    if (q < 0 || q > 1) return; const r = (R || 70) * (1 - q * 0.45), onda = 30 + q * 240;

    ctx.fillStyle = '#ff5c1f'; ctx.beginPath(); ctx.arc(x, y - r * 0.35, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(x, y - r * 0.5 - q * 24, r * 0.7, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y - r * 0.55 - q * 34, r * 0.42, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(x, y - r * 0.55 - q * 40, r * 0.2 * (1 - q), 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * (1 - q) + 1; ctx.beginPath(); ctx.ellipse(x, y, onda, onda * 0.35, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#6b665a'; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + q * 2, d = 10 + q * 90; ctx.fillRect(x + Math.cos(a) * d, y - 10 + Math.sin(a) * d * 0.4 - q * 70 + q * q * 120, 4, 4); }
    ctx.restore();
  },
  // fungo atomico: gambo che sale, cappello che si allarga, anelli di fumo; q da 0 a 1
  fungo(ctx, x, y, q) {
    if (q < 0 || q > 1) return; const H = 150 * Math.min(1, q * 1.6), largo = 26 + Math.min(1, q * 1.6) * 60;

    // gambo

    // cappello
    const cy = y - H; for (const [r, col] of [[largo, '#6b665a'], [largo * 0.82, '#ff8a3d'], [largo * 0.6, '#ffd166'], [largo * 0.32, '#fff6c2']]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, cy, r, r * 0.58, 0, 0, 7); ctx.fill(); }

    // anello di fumo che si allarga a terra
    ctx.strokeStyle = 'rgba(200,200,210,.8)'; ctx.lineWidth = 8 * (1 - q) + 2; ctx.beginPath(); ctx.ellipse(x, y - 4, 40 + q * 260, 12 + q * 10, 0, 0, 7); ctx.stroke();
    ctx.restore();
  },
  // lampo bianco su tutta la scena, nei primi istanti dello scoppio
  lampo(ctx, e, q, forza) { if (q >= 0 && q < 0.2) { ctx.fillStyle = `rgba(255,220,160,${(0.2 - q) * (forza || 3)})`; ctx.fillRect(e.cam - 10, -10, 400, 300); } },
  // il bersaglio a terra: cerchio tratteggiato che si stringe mentre il colpo arriva

n:manipulation}\n.bar .tasti{display:flex;gap:8px}\n/* il pad: un canvas a tutto schermo sotto gli overlay; in verticale disegna sotto la scena, in orizzontale ai bordi */\n#pad{position:fixed;inset:0;z-index:5;touch-action:none}\nbody.orizzontale #app{justify-content:center}\n/* dentro il lanciatore (in un riquadro) e in verticale la scena scende sotto il tasto \"Chiudi il gioco\", che altrimenti copre nome e barra del boss */\nbody.incornice:not(.orizzontale) #app{padding-top:calc(max(12px, env(safe-area-inset-top, 0px)) + 40px)}\n/* in orizzontale Pausa va nell'angolo in alto a sinistra e Audio in quello a destra, ai lati della scena: il centro resta libero per il tasto\n   \"Chiudi il gioco\" del lanciatore, che prima li copriva (Davide, 06/11/2026) */\nbody.orizzontale .bar{position:fixed;top:max(6px, env(safe-area-inset-top, 0px));left:max(10px, env(safe-area-inset-left, 0px));right:max(10px, env(safe-area-inset-right, 0px));width:auto;max-width:none;gap:8px;pointer-events:none}\nbody.orizzontale .bar .tasti{flex:1;justify-content:space-between}\nbody.orizzontale .bar #pausa,body.orizzontale .bar #mute{pointer-events:auto;color:#fff;background:rgba(18,22,11,.62);border-color:rgba(255,255,255,.7)}\nbody.orizzontale .bar #aiuto{display:none}\n.diff{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}\n.diff span{font-size:13px;color:#d9d6ee;margin-right:2px}\n.diff button{font:600 13px var(--text);border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#f4f1fa;border-radius:999px;padding:7px 14px;cursor:pointer}\n.diff button.on{background:var(--oro);color:var(--viola);border-color:var(--oro)}\n#pausaOv{background:rgba(36,18,63,.88);color:#f4f1fa;cursor:pointer}\n#riprendi{font:600 16px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:12px 32px;cursor:pointer}\n#termina{font:600 14px var(--text);color:#f4f1fa;background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radiu x;cursor:pointer;margin-top:4px}\n@media (max-height:620px){ .vs img{width:42px;height:56px} .tcard{gap:8px} .tcard ul{gap:5px} .tcard li{font-size:13px} }\n.polaroid{margin:0;background:#fff;padding:10px 10px 14px;border-radius:4px;width:min(70vw, 340px);transform:rotate(-3deg);box-shadow:0 18px 40px rgba(0,0,0,.45);animation:drop .5s cubic-bezier(.2,1.4,.4,1)}\n.polaroid img{display:block;width:100%;max-height:56vh;object-fit:contain;background:#f4f1ea}\n.polaroid figcaption{font:600 15px/1.35 var(--text);color:#2b2b2b;margin-top:10px;text-align:center;text-wrap:balance}\n@keyframes drop{from{transform:translateY(-40px) rotate(-12deg) scale(.8);opacity:0}}\n.tap{margin:0;font:8px var(--pixel);color:#f4f1fa;letter-spacing:.06em;line-height:1.6;text-align:center}\n#end{background:var(--violascuro);color:#f4f1fa}\n#fx{position:absolute;inset:0;width:100%;height:100%}\n.card{position:relative;width:100%;max-width:440px;height:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center;touch-action:pan-y;padding:6px 0}\n.card > :first-child{margin-top:auto} .card > :last-child{margin-bottom:auto}\n.finale{flex:0 1 auto;min-height:60px;max-height:28vh;width:auto;max-width:min(74vw, 300px);object-fit:contain;border-radius:12px;filter:drop-shadow(0 10px 28px rgba(245,183,0,.35));animation:pop .8s cubic-bezier(.2,1.5,.4,1)}\n@keyframes pop{from{transform:scale(.5) rotate(-10deg);opacity:0}}\n/* la schermata finale è in tre blocchi (foto, testi con il rapporto, comandi): in verticale uno sotto l'altro, in orizzontale uno accanto all'altro */\n.info,.blocco{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}\n.info{gap:10px}\n.info h2{margin:0;font:12px/1.7 var(--pixel);letter-spacing:.04em;text-wrap:balance}\n.info h2 em{font-style:normal;color:var(--oro)}\n.info p{margin:0;font-size:15px;color:#d9d6ee;text-wrap:balance}\n#recap{margin window.ARCADEU_SORGENTI = {"livello/avamposto-tra-i-ghiacci": "// Livello \"Avamposto tra i ghiacci\": notte polare con l'aurora, montagne bianche, abeti innevati, baracche di legno con la neve sul tetto. Rocce di ghiaccio a gradini.\n// Ostacoli bloccanti: cassa innevata, barile ghiacciato, muro di ghiaccio, slitta rotta. Mine sotto la neve (ma con il cartello, come sempre).\n(() => {\n  const NEVE = '#f4f8fc', NEVE2 = '#cfe0ee', GHIACCIO = '#9fc4e0', GHIACCIO2 = '#5f8fb8', LEGNO = '#8a5a30', LEGNO2 = '#5a3a1a';\n  const neve = (ctx, x, y, w) => { ctx.fillStyle = NEVE; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2 + 2, 4, 0, Math.PI, 0); ctx.fill(); };\n  const OST = [\n    { id: 'cassa-innevata', w: 28, h: 28, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = LEGNO; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = LEGNO2; for (let i = 1; i < 3; i++) ctx.fillRect(s.x, s.y + s.h * i / 3, s.w, 1.5); ctx.fillRect(s.x + s.w / 2 - 1, s.y, 2, s.h); neve(ctx, s.x, s.y + 1, s.w); } },\n    { id: 'barile-ghiacciato', w: 22, h: 32, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = '#4b6b8a'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#3a3d45'; ctx.fillRect(s.x, s.y + 5, s.w, 2); ctx.fillRect(s.x, s.y + s.h - 7, s.w, 2); ctx.fillStyle = 'rgba(220,240,255,.7)'; ctx.fillRect(s.x + 3, s.y + 9, 4, 14); neve(ctx, s.x, s.y + 1, s.w); } },\n    { id: 'muro-di-ghiaccio', w: 40, h: 40, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = GHIACCIO; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = GHIACCIO2; for (let y = s.y + 10; y < s.y + s.h; y += 10) { ctx.fillRect(s.x, y, s.w, 1.5); const off = ((y - s.y) / 10) % 2 ? 10 : 0; for (let x = s.x + off; x < s.x + s.w; x += 20) ctx.fillRect(x, y - 10, 1.5, 10); } ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(s.x + 4, s.y + 4, 3, 12); ctx.fil  if (s.arco) { // arcata di pietra: apertura scura sotto, pilastri ai lati (fuori dal passaggio), blocchi sopra\n        ctx.fillStyle = '#1e1a12'; ctx.fillRect(s.x + 5, s.y + s.h, s.w - 10, a.G - s.y - s.h);\n        ctx.fillStyle = '#2a2418'; ctx.fillRect(s.x + 5, s.y + s.h, s.w - 10, 6);\n        blocchi(ctx, s.x - 6, s.y + s.h, 11, a.G - s.y - s.h, s.seme); blocchi(ctx, s.x + s.w - 5, s.y + s.h, 11, a.G - s.y - s.h, s.seme + 1);\n      }\n      blocchi(ctx, s.x, s.y, s.w, s.h, s.seme);\n      if (!s.arco && s.h > 40) liana(ctx, s.x + s.w - 8, s.y + 2, s.h - 6, a.anim, s.seme * 6);\n    },\n    sfondo(ctx, a) {\n      // foschia e alberi lontani\n      ctx.fillStyle = '#7fa88a'; for (let i = -1; i < 9; i++) { const x = ((i * 70 - a.cam * 0.08) % 630 + 630) % 630 - 70; ctx.beginPath(); ctx.ellipse(x + 35, a.G - 60 - (i % 3) * 18, 44, 40 + (i % 2) * 14, 0, 0, 7); ctx.fill(); }\n      // muro del tempio con l'idolo di pietra (parallasse lenta)\n      const tx = ((200 - a.cam * 0.2) % 900 + 900) % 900 - 300;\n      for (let i = 0; i < 2; i++) { const x = tx + i * 900; if (x > a.W + 20 || x + 200 < -20) continue;\n        ctx.fillStyle = '#6b6050'; ctx.fillRect(x, a.G - 150, 200, 150); ctx.fillStyle = '#5a5042'; for (let y = a.G - 150; y < a.G; y += 14) { ctx.fillRect(x, y + 13, 200, 1.5); const off = ((y + 150) / 14) % 2 ? 15 : 0; for (let xx = x + off; xx < x + 200; xx += 30) ctx.fillRect(xx, y, 1.5, 13); }\n        // il volto di pietra: occhi, naso, bocca, copricapo a gradini\n        ctx.fillStyle = '#4a4034'; ctx.fillRect(x + 60, a.G - 118, 22, 12); ctx.fillRect(x + 118, a.G - 118, 22, 12); ctx.fillRect(x + 92, a.G - 100, 16, 22); ctx.fillRect(x + 66, a.G - 66, 68, 10);\n        ctx.fillStyle = '#7a6e5c'; ctx.fillRect(x + 50, a.G - 150, 100, 8); ctx.fillRect(x + 64, a.G - 142, 72, 8); ctx.fillStyle = MUSCHIO2; ctx.fillRect(x + 40, a.G - 150, 30, 4); ctx.fillRect(x + 130, a.G - 134, 36, 4); ctx.fillRect(x + 20, a.G - 90, 24, 4);\n      }\n      // alberi giganti con le radici (parallasse media) e liane\n      for (let i = -1; i < 6; i++) {\n        const x = ((i * 150 + 40 - a.cam * 0.35) % 900 + 900) % 900 - 150;\n        ctx.fillStyle = '#4a3320'; ctx.fillRect(x + 20, 0, 16, a.G); ctx.beginPath(); ctx.moveTo(x + 20, a.G); ctx.lineTo(x + 2, a.G); ctx.lineTo(x + 20, a.G - 36); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 36, a.G); ctx.lineTo(x + 56, a.G); ctx.lineTo(x + 36, a.G - 30); ctx.closePath(); ctx.fill();\n        ctx.fillStyle = '#3a2816'; ctx.fillRect(x + 24, 0, 3, a.G); ctx.fillStyle = MUSCHIO2; ctx.fillRect(x + 20, 30 + (i % 3) * 20, 16, 5); ctx.fillRect(x + 20, 90 + (i % 2) * 30, 16, 4);\n        liana(ctx, x + 60 + (i % 2) * 30, 0, 70 + (i % 3) * 25, a.anim, i);\n      }\n      // chioma: fogliame scuro in alto\n      ctx.fillStyle = '#2f5a2a'; for (let i = -1; i < 9; i++) { const x = ((i * 60 - a.cam * 0.5) % 600 + 600) % 600 - 60; ctx.beginPath(); ctx.ellipse(x + 30, -4 + (i % 2) * 8, 46, 22, 0, 0, 7); ctx.fill(); }\n      ctx.fillStyle = '#3f7a35'; for (let i = -1; i < 9; i++) { const x = ((i * 60 + 25 - a.cam * 0.5) % 600 + 600) % 600 - 60; ctx.beginPath(); ctx.ellipse(x + 30, -8 + (i % 3) * 6, 34, 16, 0, 0, 7); ctx.fill(); }\n      // felci davanti al terreno\n      ctx.fillStyle = '#4f8a3a'; for (let i = -1; i < 10; i++) { const x = ((i * 56 - a.cam * 0.8) % 560 + 560) % 560 - 40; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x, a.G); ctx.quadraticCurveTo(x + k * 8, a.G - 14, x + k * 14, a.G - 18 + Math.abs(k) * 4); ctx.lineTo(x + k * 10 + 2, a.G - 10); ctx.closePath(); ctx.fill(); } }\n    },\n    terreno(ctx, a) {\n      const x0 = Math.floor(a.cam / 40) * 40 - 40, x1 = a.cam + a.W + 40;\n      ctx.fillStyle = PIETRA2; ctx.fillRect(x0, a.G, x1 - x0, a.H - a.G);\n      ctx.fillStyle = PIETRA; ctx.fillRect(x0, a.G, x1 - x0, 10);\n      ctx.fillStyle = PIETRA3; for (let x = x0; x < x1; x += 40) { ctx.fillRect(x, a.G, 1.5, 10); ctx.fillRect(x + 20, a.G + 10, 1.5, 12); } ctx.fillRect(x0, a.G + 10, x1 - x0, 1.5);\n      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x0, a.G, x1 - x0, 1.5);\n      ctx.fillStyle = MUSCHIO; for (let x = x0; x < x1; x += 40) { ctx.fillRect(x + 4, a.G - 2, 10, 3); ctx.fillRect(x + 26, a.G - 1, 6, 2); ctx.fillRect(x + 17, a.G + 4, 4, 3); }\n      ctx.fillStyle = '#7fb04a'; for (let x = x0; x < x1; x += 40) { ctx.fillRect(x + 8, a.G - 5, 2, 3); ctx.fillRect(x + 30, a.G - 4, 2, 3); }\n    }\n  });\n})();\n", "livello/tetto-del-treno": "// Livello \"Sul tetto del treno\": si combatte sul tetto di un treno in corsa al tramonto; colline, pali del telegrafo e uccelli che sfilano, i vagoni sotto i piedi.\n// Niente colline di roccia (è un tetto): piattaforme, mine e ostacoli bloccanti: sfiato, cassa legata, serbatoio, cesta.\n(() => {\n  const TETTO = '#6b6f7a', TETTO2 = '#4b5563', TETTO3 = '#8a8f9c', VAGONE = '#5b6b3a', VAGONE2 = '#3f4b28';\n  const OST = [\n    { id: 'sfiato', w: 26, h: 20, disegna(ctx, s, a) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = TETTO2; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = TETTO3; ctx.fillRect(s.x + 2, s.y + 2, s.w - 4, 4); ctx.fillStyle = '#1b1b1b'; for (let y = s.y + 8; y < s.y + s.h - 2; y += 4) ctx.fillRect(s.x + 3, y, s.w - 6, 2); ctx.fillStyle = 'rgba(200,200,210,.4)'; ctx.fillRect(s.x + 6 - Math.sin(a.anim * 6) * 3, s.y - 6, 4, 6); } },\n    { id: 'cassa-legata', w: 30, h: 30, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = '#a0673a'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#6b4a2a'; for (let i = 1; i < 3; i++) ctx.fillRect(s.x, s.y + s.h * i / 3, s.w, 1.5); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x + 8, s.y - 1, 3, s.h + 2); ctx.fillRect(s.x + s.w - 11, s.y - 1, 3, s.h + 2); ctx.fillStyle = '#c9b26b'; ctx.fillRect(s.x + 8, s.y, 3, s.h); ctx.fillRect(s.x + s.w - 11, s.y, 3, s.h); } },\n    { id: 'serbatoio', w: 40, h: 28, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2 + 1, s.h / 2 + 1, 0, 0, 7); ctx.fill(); ctx.fillStyle = TETTO3; ctx.beginPath(); ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#c0c4cc'; ctx.fillRect(s.x + 6, s.y + 5, s.w - 12, 3); ctx.fillStyle = TETTO2; ctx.fillRect(s.x + 4, s.y + s.h - 10, s.w - 8, 3); ctx.fillStyle = '#c8321f'; ctx.fillRect(s.x + s.w / 2 - 4, s.y - 3, 8, 5); } },\n    { id: 'cesta', w: 24, h: 24, disegna(ctx, s) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2); ctx.fillStyle = '#c9b26b'; ctx.fillRect(s.x, s.y, s.w, s.h); ctx.fillStyle = '#a89552'; for (let y = s.y + 4; y < s.y + s.h; y += 5) ctx.fillRect(s.x, y, s.w, 1.5); for (let x = s.x + 4; x < s.x + s.w; x += 6) ctx.fillRect(x, s.y, 1.5, s.h); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, 3); } }\n  ];\n  AU.registra('livello', 'tetto-del-treno', {\n    nome: { it: 'il tetto del treno', en: 'the train roof' }, emoji: '🚂', struttura: { piatt: [180, 300], doppie: 0.25, ostacoli: [190, 320], colline: 0, arcate: 0, nemiciSopra: 0.3, mine: 1 }, cielo: ['#e08a4a', '#f7d8a0'], ink: '#2b2b2b', notte: false, nuvole: true, nuvoleColore: '#ffe6c8', lunghezza: 2700, densita: 1, pozze: 0, mine: 4, rilievi: false,\n    tinte: { piatt: TETTO3, piattSotto: TETTO2, piattBordo: '#2b2b2b', roccia: TETTO, rocciaScuro: TETTO2, rocciaCima: '#e0b84a' }, ostacoli: OST,\n    sfondo(ctx, a) {\n      const corsa = a.anim * 90;   // il paesaggio scorre anche da fermi: il treno va\n      ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(a.W * 0.3, 54, 20, 0, 7); ctx.fill();\n      // colline lontane e campi\n      ctx.fillStyle = '#b07a5a'; for (let i = -1; i < 6; i++) { const x = ((i * 150 - a.cam * 0.06 - corsa * 0.15) % 750 + 750) % 750 - 150; ctx.beginPath(); ctx.ellipse(x + 75, a.G - 30, 110, 38 + (i % 2) * 12, 0, Math.PI, 0); ctx.fill(); }\n      ctx.fillStyle = '#8a6a4a'; for (let i = -1; i < 7; i++) { const x = ((i * 120 + 40 - a.cam * 0.12 - corsa * 0.3) % 840 + 840) % 840 - 120; ctx.beginPath(); ctx.ellipse(x + 60, a.G - 26, 80, 26, 0, Math.PI, 0); ctx.fill(); }\n      // pali del telegrafo con i fili (parallasse veloce)\n      ctx.strokeStyle = '#3a2816'; ctx.lineWidth = 1; for (let i = -1; i < 6; i++) { const x = ((i * 100 - a.cam * 0.5 - corsa) % 600 + 600) % 600 - 100; ctx.fillStyle = '#3a2816'; ctx.fillRect(x, a.G - 100, 4, 74); ctx.fillRect(x - 8, a.G - 94, 20, 3); ctx.beginPath(); ctx.moveTo(x - 8, a.G - 92); ctx.quadraticCurveTo(x + 42, a.G - 84, x + 92, a.G - 92); ctx.stroke(); }\n      // uccelli che sfilano\n      ctx.strokeStyle = '#3a2816'; ctx.lineWidth = 1.5; for (let i = 0; i < 3; i++) { const x = ((i * 140 + a.anim * 25) % (a.W + 60)) - 30, y = 30 + (i % 2) * 18 + Math.sin(a.anim * 3 + i) * 3; ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x - 3, y - 4, x, y); ctx.quadraticCurveTo(x + 3, y - 4, x + 6, y); ctx.stroke(); }\n      // la massicciata e i binari di un secondo treno, sotto l'orizzonte\n      ctx.fillStyle = '#6b5a4a'; ctx.fillRect(0, a.G - 26, a.W, 10); ctx.fillStyle = '#3a2816'; for (let i = 0; i < 14; i++) { const x = ((i * 30 - corsa * 1.6) % 420 + 420) % 420 - 30; ctx.fillRect(x, a.G - 24, 10, 6); } ctx.fillStyle = '#8a8f9c'; ctx.fillRect(0, a.G - 23, a.W, 2); ctx.fillRect(0, a.G - 19, a.W, 2);\n    },\n    terreno(ctx, a) {\n      const x0 = Math.floor(a.cam / 40) * 40 - 40, x1 = a.cam + a.W + 40;\n      // il tetto: lamiera grigia con le giunture, e sotto il fianco del vagone con i finestrini\n      ctx.fillStyle = VAGONE; ctx.fillRect(x0, a.G, x1 - x0, a.H - a.G);\n      ctx.fillStyle = TETTO; ctx.fillRect(x0, a.G, x1 - x0, 9); ctx.fillStyle = TETTO3; ctx.fillRect(x0, a.G + 1, x1 - x0, 2);\n      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x0, a.G, x1 - x0, 1.5); ctx.fillRect(x0, a.G + 9, x1 - x0, 1.5);\n      ctx.fillStyle = TETTO2; for (let x = x0; x < x1; x += 40) { ctx.fillRect(x + 20, a.G + 2, 1.5, 7); ctx.fillRect(x + 4, a.G + 5, 2, 2); ctx.fillRect(x + 34, a.G + 5, 2, 2); }\n      ctx.fillStyle = VAGONE2; ctx.fillRect(x0, a.G + 11, x1 - x0, 3);\n      for (let x = x0; x < x1; x += 40) { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 8, a.G + 16, 24, 8); ctx.fillStyle = '#ffd166'; ctx.fillRect(x + 9, a.G + 17, 22, 6); }\n      ctx.fillStyle = '#2b2b2b'; for (let x = x0; x < x1; x += 160) ctx.fillRect(x + 118, a.G + 9, 4, a.H - a.G - 9);   // giunzione tra i vagoni\n    }\n  });\n})();\n", "mossa/_fuoco": "// Aiuti per le mosse finali di Boom (v0.21): traiettorie, esplosioni, fungo atomico e lampo. Non è un modulo del catalogo.\n// Dal 06/11/2026 sera (richiesta di Davide) ogni mossa viene lanciata verso i nemici: il motore dà a ogni effetto il punto di partenza\n// (e.x0, e.y0), il bersaglio a terra nella metà dello schermo davanti al protagonista (e.tx, e.ty), la direzione (e.dir) e la telecamera\n// al lancio (e.cam); spazza via tutto al momento di `ritardo` e tiene l'animazione per altri `coda` secondi.\nAU.fuoco = {\n  // posizione lungo una parabola da (x0, y0) a (tx, ty), k da 0 a 1, alta `h` px\n  parabola(e, k, h) { return { x: e.x0 + (e.tx - e.x0) * k, y: e.y0 + (e.ty - e.y0) * k - (h == null ? 110 : h) * Math.sin(k * Math.PI) }; },\n  // esplosione: palla di fuoco a tre strati, onda d'urto, detriti; q da 0 (scoppio) a 1 (spenta); R = raggio massimo della palla\n  esplosione(ctx, x, y, q, R) {\n    if (q < 0 || q > 1) return; const r = (R || 70) * (1 - q * 0.45), onda = 30 + q * 240;\n    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - q);\n    ctx.fillStyle = '#ff5c1f'; ctx.beginPath(); ctx.arc(x, y - r * 0.35, r, 0, 7); ctx.fill();\n    ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(x, y - r * 0.5 - q * 24, r * 0.7, 0, 7); ctx.fill();\n    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y - r * 0.55 - q * 34, r * 0.42, 0, 7); ctx.fill();\n    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(x, y - r * 0.55 - q * 40, r * 0.2 * (1 - q), 0, 7); ctx.fill();\n    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * (1 - q) + 1; ctx.beginPath(); ctx.ellipse(x, y, onda, onda * 0.35, 0, 0, 7); ctx.stroke();\n    ctx.fillStyle = '#6b665a'; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + q * 2, d = 10 + q * 90; ctx.fillRect(x + Math.cos(a) * d, y - 10 + Math.sin(a) * d * 0.4 - q * 70 + q * q * 120, 4, 4); }\n    ctx.restore();\n  },\n  // fungo atomico: gambo che sale, cappello che si allarga, anelli di fumo; q da 0 a 1\n  fungo(ctx, x, y, q) {\n    if (q < 0 || q > 1) return; const H = 150 * Math.min(1, q * 1.6), largo = 26 + Math.min(1, q * 1.6) * 60;\n    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, q - 0.55) / 0.45);\n    // bagliore a terra\n    ctx.fillStyle = `rgba(255,220,120,${0.5 * (1 - q)})`; ctx.beginPath(); ctx.ellipse(x, y, 120 + q * 120, 24, 0, 0, 7); ctx.fill();\n    // gambo\n    const g = ctx.createLinearGradient(x, y, x, y - H); g.addColorStop(0, '#ff8a3d'); g.addColorStop(0.5, '#c87a4a'); g.addColorStop(1, '#8a8f9c'); ctx.fillStyle = g; ctx.fillRect(x - 14, y - H, 28, H);\n    for (let i = 0; i < 5; i++) { const yy = y - H * (i + 0.5) / 5; ctx.fillStyle = i % 2 ? 'rgba(255,138,61,.5)' : 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(x, yy, 16 + Math.sin(q * 20 + i) * 3, 7, 0, 0, 7); ctx.fill(); }\n    // cappello\n    const cy = y - H; for (const [r, col] of [[largo, '#6b665a'], [largo * 0.82, '#ff8a3d'], [largo * 0.6, '#ffd166'], [largo * 0.32, '#fff6c2']]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, cy, r, r * 0.58, 0, 0, 7); ctx.fill(); }\n    ctx.fillStyle = 'rgba(107,102,90,.9)'; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ctx.beginPath(); ctx.arc(x + Math.cos(a) * largo * 0.9, cy + Math.sin(a) * largo * 0.45, largo * 0.3, 0, 7); ctx.fill(); }\n    // anello di fumo che si allarga a terra\n    ctx.strokeStyle = 'rgba(200,200,210,.8)'; ctx.lineWidth = 8 * (1 - q) + 2; ctx.beginPath(); ctx.ellipse(x, y - 4, 40 + q * 260, 12 + q * 10, 0, 0, 7); ctx.stroke();\n    ctx.restore();\n  },\n  // lampo bianco su tutta la scena, nei primi istanti dello scoppio\n  lampo(ctx, e, q, forza) { if (q >= 0 && q < 0.2) { ctx.fillStyle = `rgba(255,220,160,${(0.2 - q) * (forza || 3)})`; ctx.fillRect(e.cam - 10, -10, 400, 300); } },\n  // il bersaglio a terra: cerchio tratteggiato che si stringe mentre il colpo arriva\n  mira(ctx, x, y, k) { ctx.save(); ctx.strokeStyle = `rgba(255,80,80,${0.4 + 0.5 * Math.abs(Math.sin(k * 30))})`; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.ellipse(x, y + 2, 30 - k * 12, 9 - k * 3, 0, 0, 7); ctx.stroke(); ctx.restore(); }\n};\n", "mossa/bazooka": "// dipende: _fuoco\n// Mossa finale \"Bazooka\": il razzo parte dritto, disegna una parabola, ricade a terra nella seconda metà dello schermo ed esplode: solo allora spazza via tutto\nAU.registra('mossa', 'bazooka', { nome: { it: 'Bazooka', en: 'Bazooka' }, emoji: '🚀', grido: { it: 'FIUUU… BOOM!', en: 'WHOOSH… BOOM!' }, tipo: 'esplosione', ritardo: 0.8, coda: 0.8, danno: 12,\n  suono(a, t) { a.tone(180, t, 0.8, 'sawtooth', 0.06, 1200); a.tone(60, t, 0.2, 'square', 0.05, 30); a.tone(50, t + 0.8, 0.7, 'sawtooth', 0.12, 22); if (a.drum) { a.drum('k', t); a.drum('h', t + 0.1); a.drum('k', t + 0.8); a.drum('s', t + 0.86); } },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 0.8, F = AU.fuoco;\n    if (e.t < r) {\n      const k = e.t / r, p = F.parabola(e, k, 90), p2 = F.parabola(e, Math.max(0, k - 0.02), 90), ang = Math.atan2(p.y - p2.y, p.x - p2.x);\n      // scia di fumo e fuoco lungo la parabola\n      for (let i = 1; i < 10; i++) { const kk = Math.max(0, k - i * 0.03), s = F.parabola(e, kk, 90); ctx.globalAlpha = 0.55 - i * 0.05; ctx.fillStyle = i < 3 ? '#ff8a3d' : '#9a9aa6'; ctx.beginPath(); ctx.arc(s.x, s.y, 2 + i * 0.9, 0, 7); ctx.fill(); }\n      ctx.globalAlpha = 1; F.mira(ctx, e.tx, e.ty, k);\n      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);\n      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-14, -5, 28, 10);\n      ctx.fillStyle = '#5b6b3a'; ctx.fillRect(-13, -4, 22, 8); ctx.fillStyle = '#3f4b28'; ctx.fillRect(-13, -4, 22, 2);\n      ctx.fillStyle = '#d9534f'; ctx.beginPath(); ctx.moveTo(9, -5); ctx.lineTo(17, 0); ctx.lineTo(9, 5); ctx.closePath(); ctx.fill();\n      ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-15, -8, 5, 4); ctx.fillRect(-15, 4, 5, 4);\n      ctx.fillStyle = '#ffd166'; ctx.fillRect(-19, -2, 5, 4);\n      ctx.restore();\n    } else { const q = (e.t - r) / 0.8; F.esplosione(ctx, e.tx, e.ty, q, 84); F.lampo(ctx, e, q, 3); }\n  } });\n", "mossa/bomba-a-grappolo": "// dipende: _fuoco\n// Mossa finale \"Bomba a grappolo\": la bomba madre vola in avanti verso i nemici, si apre sopra la seconda metà dello schermo e lascia cadere una pioggia di bombette che scoppiano tutte insieme\nAU.registra('mossa', 'bomba-a-grappolo', { nome: { it: 'Bomba a grappolo', en: 'Cluster bomb' }, emoji: '🧨', grido: { it: 'POP POP POP!', en: 'POP POP POP!' }, tipo: 'esplosione', ritardo: 0.95, coda: 0.7, danno: 11,\n  suono(a, t) { a.tone(200, t, 0.2, 'square', 0.04, 600); for (let i = 0; i < 10; i++) a.tone(90 + (i % 3) * 25, t + 0.95 + i * 0.05, 0.25, 'sawtooth', 0.06, 30); if (a.drum) for (let i = 0; i < 6; i++) a.drum(i % 2 ? 's' : 'k', t + 0.95 + i * 0.07); },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 0.95, F = AU.fuoco, N = 9, APRE = 0.45;\n    const posti = i => ({ x: e.tx - 100 + i * 25 + ((i * 7) % 3) * 6, y: e.ty - ((i * 5) % 3) * 4 });\n    if (e.t < APRE) { // la bomba madre vola ad arco verso il bersaglio\n      const k = e.t / APRE, p = F.parabola(e, k * 0.8, 120); F.mira(ctx, e.tx, e.ty, k * 0.5);\n      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(k * 3 * e.dir); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-7, -10, 14, 20); ctx.fillStyle = '#3a3d45'; ctx.fillRect(-6, -9, 12, 18); ctx.fillStyle = '#e0b84a'; ctx.fillRect(-6, -2, 12, 4); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-8, -13, 4, 5); ctx.fillRect(4, -13, 4, 5); ctx.restore();\n    } else if (e.t < r) { // si apre: le bombette cadono a ventaglio sul bersaglio\n      const k = (e.t - APRE) / (r - APRE), ap = F.parabola(e, 0.8, 120); ctx.fillStyle = 'rgba(200,200,210,.4)'; ctx.beginPath(); ctx.arc(ap.x, ap.y, 10 + k * 20, 0, 7); ctx.fill();\n      for (let i = 0; i < N; i++) { const p = posti(i), x = ap.x + (p.x - ap.x) * k, y = ap.y + (p.y - ap.y) * k * k; ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 3, y - 4, 6, 8); ctx.fillStyle = '#c8321f'; ctx.fillRect(x - 2, y - 3, 4, 6); ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 3, 4, 1.5); }\n    } else { // tante piccole esplosioni, sfalsate di poco\n      const q = (e.t - r) / 0.7;\n      for (let i = 0; i < N; i++) { const p = posti(i), d = q - (i % 4) * 0.06; if (d > 0) F.esplosione(ctx, p.x, p.y, Math.min(1, d / 0.8), 28); }\n      F.lampo(ctx, e, q, 2.5);\n    }\n  } });\n", "mossa/bombardamento-aereo": "// dipende: _fuoco\n// Mossa finale \"Bombardamento aereo\": un aereo attraversa tutto il cielo e sgancia una fila di bombe su tutto lo schermo; dopo un attimo scoppiano tutte insieme\nAU.registra('mossa', 'bombardamento-aereo', { nome: { it: 'Bombardamento aereo', en: 'Air strike' }, emoji: '✈️', grido: { it: 'BOMBE!', en: 'BOMBS AWAY!' }, tipo: 'esplosione', ritardo: 1.1, coda: 0.8, danno: 12,\n  suono(a, t) { for (let i = 0; i < 8; i++) a.tone(90 + i * 12, t + i * 0.12, 0.14, 'sawtooth', 0.04, 60); a.tone(50, t + 1.1, 0.7, 'sawtooth', 0.12, 20); if (a.drum) { a.drum('k', t + 1.1); a.drum('k', t + 1.2); a.drum('s', t + 1.25); } },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 1.1, k = Math.min(1, e.t / r), cam = e.cam, F = AU.fuoco, N = 8, dir = e.dir;\n    // le bombe coprono tutto lo schermo, da bordo a bordo (Davide, 06/11/2026: \"non solo la prima metà\")\n    const bx = i => cam + 24 + i * (360 - 48) / (N - 1), ty = e.ty;\n    // l'aereo passa in alto nel verso in cui guarda il protagonista\n    const ax = dir > 0 ? cam - 70 + 500 * k : cam + 430 - 500 * k, ay = 24 + Math.sin(e.t * 8) * 2;\n    ctx.save(); ctx.translate(ax, ay); if (dir < 0) ctx.scale(-1, 1); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-20, -4, 44, 8); ctx.fillStyle = '#5b6b3a'; ctx.fillRect(-19, -3, 40, 6); ctx.fillStyle = '#9ad7ff'; ctx.fillRect(10, -3, 7, 3); ctx.fillStyle = '#3f4b28'; ctx.fillRect(-8, -10, 22, 5); ctx.fillRect(-20, -11, 6, 8); ctx.fillStyle = '#e0b84a'; ctx.fillRect(-2, 0, 6, 2); ctx.fillStyle = Math.floor(e.t * 30) % 2 ? '#c0c4cc' : 'rgba(192,196,204,.3)'; ctx.fillRect(24, -6, 3, 12); ctx.restore();\n    if (e.t < r) { // bombe che cadono in fila, sganciate man mano nel verso dell'aereo\n      for (let i = 0; i < N; i++) { const j = dir > 0 ? i : N - 1 - i, dr = 0.12 + j * 0.07; if (k < dr) continue; const q = Math.min(1, (k - dr) / 0.5), x = bx(i), y = ay + 10 + (ty - ay) * q * q; ctx.save(); ctx.translate(x, y); ctx.rotate((0.4 - q * 0.5) * dir); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-4, -7, 8, 14); ctx.fillStyle = '#3a3d45'; ctx.fillRect(-3, -6, 6, 12); ctx.fillStyle = '#c8321f'; ctx.fillRect(-3, 3, 6, 3); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-5, -9, 3, 4); ctx.fillRect(2, -9, 3, 4); ctx.restore(); }\n    } else { // otto fiammate in fila su tutto lo schermo e il lampo\n      const q = (e.t - r) / 0.8;\n      for (let i = 0; i < N; i++) F.esplosione(ctx, bx(i), ty, Math.min(1, q + (i % 3) * 0.04), 34);\n      F.lampo(ctx, e, q, 3.5);\n    }\n  } });\n", "mossa/granata": "// dipende: _fuoco\n// Mossa finale \"Granata\": lanciata ad arco verso i nemici, cade a terra nella seconda metà dello schermo e lì scoppia: solo allora spazza via tutto (tasto X o Y)\nAU.registra('mossa', 'granata', { nome: { it: 'Granata', en: 'Grenade' }, emoji: '💣', grido: { it: 'BOOM!', en: 'BOOM!' }, tipo: 'esplosione', ritardo: 0.75, coda: 0.75, danno: 10,\n  suono(a, t) { a.tone(a.hz(80), t, 0.08, 'square', 0.03); a.tone(55, t + 0.75, 0.6, 'sawtooth', 0.11, 25); if (a.drum) { a.drum('k', t + 0.75); a.drum('s', t + 0.81); a.drum('k', t + 0.9); } },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 0.75, F = AU.fuoco;\n    if (e.t < r) { // la granata vola ad arco, la sicura lampeggia; a terra il cerchio di mira\n      const k = e.t / r, p = F.parabola(e, k, 100); F.mira(ctx, e.tx, e.ty, k);\n      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(k * 9 * e.dir);\n      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-5, -7, 10, 14); ctx.fillStyle = '#5b6b3a'; ctx.fillRect(-4, -6, 8, 12); ctx.fillStyle = '#3f4b28'; ctx.fillRect(-4, -2, 8, 1); ctx.fillRect(-4, 2, 8, 1);\n      ctx.fillStyle = Math.floor(e.t * 24) % 2 ? '#ff5c5c' : '#8a8f9c'; ctx.fillRect(-1.5, -10, 3, 4); ctx.restore();\n    } else { const q = (e.t - r) / 0.75; F.esplosione(ctx, e.tx, e.ty, q, 70); F.lampo(ctx, e, q, 3); }\n  } });\n", "mossa/lanciafiamme": "// Mossa finale \"Lanciafiamme\": una lingua di fuoco enorme si allarga davanti al protagonista e spazza via tutto quello che c'è sullo schermo\nAU.registra('mossa', 'lanciafiamme', { nome: { it: 'Lanciafiamme', en: 'Flamethrower' }, emoji: '🔥', grido: { it: 'FUOCO!', en: 'FIRE!' }, tipo: 'esplosione', ritardo: 0.25, danno: 9,\n  suono(a, t) { for (let i = 0; i < 10; i++) a.tone(70 + Math.random() * 40, t + i * 0.08, 0.14, 'sawtooth', 0.045, 30); if (a.drum) for (let i = 0; i < 8; i++) a.drum('h', t + i * 0.1); },\n  disegna(ctx, e, S) {\n    const dir = S.pl.dir || 1, k = Math.min(1, e.t / 0.9), lung = 60 + k * 300, alt = 18 + k * 70;\n    ctx.save(); ctx.globalAlpha = e.t > 0.8 ? Math.max(0, (1.1 - e.t) / 0.3) : 1;\n    // tre strati di fiamma, ondulati, dal rosso al giallo\n    for (const [col, sc] of [['#ff3b1f', 1], ['#ff8a3d', 0.72], ['#ffd166', 0.42]]) {\n      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(e.x, e.y);\n      for (let i = 0; i <= 12; i++) { const q = i / 12, x = e.x + dir * lung * q * sc, y = e.y - alt * sc * q + Math.sin(e.t * 30 + i * 1.7) * 6 * q; ctx.lineTo(x, y); }\n      for (let i = 12; i >= 0; i--) { const q = i / 12, x = e.x + dir * lung * q * sc, y = e.y + alt * sc * q * 0.8 + Math.sin(e.t * 26 + i * 2.1) * 6 * q; ctx.lineTo(x, y); }\n      ctx.closePath(); ctx.fill();\n    }\n    // scintille\n    ctx.fillStyle = '#fff6c2'; for (let i = 0; i < 10; i++) { const q = (i * 0.1 + e.t * 1.3) % 1; ctx.fillRect(e.x + dir * lung * q, e.y - alt * 0.5 + Math.sin(i * 3 + e.t * 20) * alt * 0.6, 2, 2); }\n    ctx.restore();\n  } });\n", "mossa/missile-teleguidato": "// dipende: _fuoco\n// Mossa finale \"Missile teleguidato\": parte, fa un giro della morte, serpeggia a zig zag e si schianta a terra nella seconda metà dello schermo: lì spazza via nemici e pericoli\nAU.registra('mossa', 'missile-teleguidato', { nome: { it: 'Missile teleguidato', en: 'Guided missile' }, emoji: '🛰️', grido: { it: 'BLOCCATO… BOOM!', en: 'LOCKED ON… BOOM!' }, tipo: 'esplosione', ritardo: 1.7, coda: 0.85, danno: 13,\n  suono(a, t) { a.tone(240, t, 1.5, 'sawtooth', 0.05, 1600); a.tone(80, t, 0.3, 'square', 0.05, 30); for (let i = 0; i < 4; i++) a.tone(1500 + i * 200, t + 0.2 + i * 0.3, 0.12, 'sine', 0.02); a.tone(50, t + 1.7, 0.8, 'sawtooth', 0.12, 20); if (a.drum) { a.drum('k', t); a.drum('h', t + 0.15); a.drum('k', t + 1.7); a.drum('s', t + 1.78); } },\n  // la traiettoria: 0–0.25 s avanti in salita, 0.25–0.85 il giro della morte, 0.85–1.4 zig zag verso il bersaglio, 1.4–1.7 picchiata\n  posizione(e, t) {\n    const d = e.dir, F = AU.fuoco, x0 = e.x0, y0 = e.y0 - 10;\n    const R = 34, cx = x0 + d * 70, cy = y0 - 50;   // centro del giro\n    if (t < 0.25) { const k = t / 0.25; return { x: x0 + d * 70 * k, y: y0 - 16 * k }; }\n    if (t < 0.85) { const k = (t - 0.25) / 0.6, a = Math.PI / 2 + d * k * Math.PI * 2; return { x: cx + Math.cos(a) * R * d, y: cy + R - Math.sin(a) * R * -1 - R }; }\n    const zx0 = cx, zy0 = cy;\n    if (t < 1.4) { const k = (t - 0.85) / 0.55; return { x: zx0 + (e.tx - zx0) * k * 0.85, y: zy0 - 20 + Math.sin(k * Math.PI * 3) * 28 }; }\n    const k = (t - 1.4) / 0.3, sx = zx0 + (e.tx - zx0) * 0.85; return { x: sx + (e.tx - sx) * k, y: (zy0 - 20) + (e.ty - (zy0 - 20)) * k * k };\n  },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 1.7, F = AU.fuoco;\n    if (e.t < r) {\n      const p = this.posizione(e, e.t), p2 = this.posizione(e, Math.max(0, e.t - 0.02)), ang = Math.atan2(p.y - p2.y, p.x - p2.x);\n      // scia di fumo lungo la strada fatta\n      for (let i = 1; i < 16; i++) { const s = this.posizione(e, Math.max(0, e.t - i * 0.04)); ctx.globalAlpha = 0.6 - i * 0.035; ctx.fillStyle = i < 3 ? '#ff8a3d' : '#b0b0ba'; ctx.beginPath(); ctx.arc(s.x, s.y, 3 + i * 0.7, 0, 7); ctx.fill(); }\n      ctx.globalAlpha = 1; if (e.t > 0.85) F.mira(ctx, e.tx, e.ty, (e.t - 0.85) / 0.85);\n      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);\n      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-18, -6, 36, 12); ctx.fillStyle = '#c0c4cc'; ctx.fillRect(-17, -5, 30, 10); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-17, 1, 30, 4);\n      ctx.fillStyle = '#c8321f'; ctx.beginPath(); ctx.moveTo(13, -6); ctx.lineTo(22, 0); ctx.lineTo(13, 6); ctx.closePath(); ctx.fill();\n      ctx.fillStyle = '#2f4a78'; ctx.fillRect(-19, -10, 6, 5); ctx.fillRect(-19, 5, 6, 5); ctx.fillRect(-4, -9, 5, 3); ctx.fillRect(-4, 6, 5, 3);\n      ctx.fillStyle = Math.floor(e.t * 16) % 2 ? '#ff5c5c' : '#7a2020'; ctx.fillRect(-2, -3, 4, 3); ctx.fillStyle = '#ffd166'; ctx.fillRect(-23, -3, 6, 6);\n      ctx.restore();\n    } else { const q = (e.t - r) / 0.85; F.esplosione(ctx, e.tx, e.ty, q, 90); F.lampo(ctx, e, q, 3.5); }\n  } });\n", "mossa/mortaio": "// dipende: _fuoco\n// Mossa finale \"Mortaio\": il colpo sale altissimo, esce dallo schermo e ricade sul bersaglio nella seconda metà dello schermo con un'esplosione enorme\nAU.registra('mossa', 'mortaio', { nome: { it: 'Mortaio', en: 'Mortar' }, emoji: '🎯', grido: { it: 'KABOOM!', en: 'KABOOM!' }, tipo: 'esplosione', ritardo: 1.0, coda: 0.9, danno: 11,\n  suono(a, t) { a.tone(120, t, 0.25, 'square', 0.05, 40); a.tone(1400, t + 0.3, 0.5, 'sine', 0.02, 300); a.tone(45, t + 1.0, 0.8, 'sawtooth', 0.12, 20); if (a.drum) { a.drum('k', t); a.drum('k', t + 1.0); a.drum('s', t + 1.07); a.drum('k', t + 1.15); } },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 1.0, F = AU.fuoco;\n    if (e.t < r) {\n      const k = e.t / r, p = F.parabola(e, k, 300); F.mira(ctx, e.tx, e.ty, k);\n      // nuvoletta dello sparo all'inizio\n      if (k < 0.15) { ctx.fillStyle = 'rgba(200,200,210,.5)'; ctx.beginPath(); ctx.arc(e.x0 + e.dir * 6, e.y0 - 6, 6 + k * 40, 0, 7); ctx.fill(); }\n      if (p.y > -20) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(k < 0.5 ? -1.2 * e.dir : 1.2 * e.dir); ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-5, -9, 10, 18); ctx.fillStyle = '#5b6b3a'; ctx.fillRect(-4, -8, 8, 16); ctx.fillStyle = '#e0b84a'; ctx.fillRect(-4, -2, 8, 3); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-6, 6, 3, 5); ctx.fillRect(3, 6, 3, 5); ctx.restore(); }\n      else if (k > 0.75) { // il fischio del colpo che ricade: segno in alto sopra il bersaglio\n        ctx.fillStyle = '#ff5c5c'; ctx.beginPath(); ctx.moveTo(e.tx, 14); ctx.lineTo(e.tx - 6, 4); ctx.lineTo(e.tx + 6, 4); ctx.closePath(); ctx.fill();\n      }\n    } else { const q = (e.t - r) / 0.9; F.esplosione(ctx, e.tx, e.ty, q, 100); F.lampo(ctx, e, q, 3.5); }\n  } });\n", "mossa/nuke": "// dipende: _fuoco\n// Mossa finale \"Nuke\": una piccola bomba viene lanciata ad arco e scoppia a terra nella seconda metà dello schermo con un fungo atomico; al posto della raffica tripla (Davide, 06/11/2026)\nAU.registra('mossa', 'nuke', { nome: { it: 'Nuke', en: 'Nuke' }, emoji: '☢️', grido: { it: 'KA-BOOM!', en: 'KA-BOOM!' }, tipo: 'esplosione', ritardo: 0.85, coda: 1.4, danno: 14, scossa: 0.9,\n  suono(a, t) { a.tone(a.hz(72), t, 0.1, 'square', 0.03, a.hz(84)); for (let i = 0; i < 3; i++) a.tone(1200 - i * 300, t + 0.2 + i * 0.2, 0.15, 'sine', 0.02); a.tone(40, t + 0.85, 1.6, 'sawtooth', 0.14, 18); a.tone(30, t + 0.9, 1.4, 'square', 0.06, 12); if (a.drum) { a.drum('k', t + 0.85); a.drum('k', t + 0.95); a.drum('s', t + 1.0); a.drum('k', t + 1.1); a.drum('k', t + 1.3); } },\n  disegna(ctx, e, S) {\n    const r = e.ritardo || 0.85, F = AU.fuoco;\n    if (e.t < r) { // la bombetta vola ad arco, con il simbolo del nucleare che gira\n      const k = e.t / r, p = F.parabola(e, k, 110); F.mira(ctx, e.tx, e.ty, k);\n      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(k * 5 * e.dir);\n      ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 7, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#5a5f6c'; ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 5.5, 0, 0, 7); ctx.fill();\n      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#2b2b2b'; for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3 + k * 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 4, a, a + 1); ctx.closePath(); ctx.fill(); } ctx.beginPath(); ctx.arc(0, 0, 1.2, 0, 7); ctx.fill();\n      ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-13, -3, 4, 6); ctx.restore();\n    } else { // il fungo atomico, con il lampo lungo e lo schermo che trema (scossa: il motore accende il lampo bianco)\n      const q = (e.t - r) / 1.4; F.fungo(ctx, e.tx, e.ty, q); F.lampo(ctx, e, q * 0.6, 4);\n    }\n  } });\n", "musica/assalto": "// \"Assalto!\", brano originale per Boom (06/11/2026): re minore, tempo serrato, melodia che sale a scatti e ricade, batteria marziale.\nAU.registra('musica', 'assalto', { nome: { it: 'Assalto!', en: 'Assault!' }, emoji: '🎺', ottavo: 0.125, onda: 'square', passoAccordo: 8, accordi: 'DDBFCC',\n  basso: { D: [38, 50, 38, 50, 38, 50, 41, 45], B: [34, 46, 34, 46, 34, 46, 38, 41], F: [41, 53, 41, 53, 41, 53, 45, 48], C: [36, 48, 36, 48, 36, 48, 40, 43] },\n  batteria: 'KhShKhSSKhShKhSh',\n  melodia: [[74,1],[74,1],[77,1],[74,1],[81,2],[79,1],[77,1],[74,1],[77,1],[79,1],[81,1],[84,2],[0,2],\n    [82,1],[82,1],[86,1],[82,1],[89,2],[86,1],[82,1],[81,1],[82,1],[81,1],[77,1],[74,2],[0,2],\n    [77,1],[77,1],[81,1],[77,1],[84,2],[81,1],[77,1],[79,1],[81,1],[82,1],[84,1],[86,2],[0,2]] });\n", "musica/carica": "// \"Carica!\", brano originale per Boom, riscritto il 06/11/2026 sera (Davide: aveva le stesse note di \"Assalto!\"): do maggiore, marcetta allegra a passo svelto,\n// melodia che sale per terze e ricade con le note ribattute, basso in ottave, batteria a marcia con il rullante in levare.\n// batteria: un carattere per ottavo (k cassa, s rullante, h charleston, K cassa+charleston, S rullante+charleston, . niente)\nAU.registra('musica', 'carica', { nome: { it: 'Carica!', en: 'Charge!' }, emoji: '🥁', ottavo: 0.13, onda: 'square', passoAccordo: 8, accordi: 'CCFFGGCC',\n  basso: { C: [48, 60, 48, 60, 55, 60, 48, 55], F: [53, 65, 53, 65, 60, 65, 53, 60], G: [55, 67, 55, 67, 62, 67, 55, 62] },\n  batteria: 'K.hSK.hSK.hSKShS',\n  melodia: [[72,1],[76,1],[79,1],[84,1],[83,1],[79,1],[76,1],[72,1],[74,1],[77,1],[81,1],[86,1],[84,1],[81,1],[77,1],[74,1],\n    [79,2],[79,1],[81,1],[83,2],[84,2],[86,1],[84,1],[83,1],[81,1],[79,2],[0,2],\n    [84,1],[84,1],[86,1],[84,1],[81,2],[79,2],[77,1],[77,1],[79,1],[77,1],[74,2],[72,2],\n    [79,1],[81,1],[83,1],[84,1],[86,1],[84,1],[83,1],[79,1],[84,3],[0,1],[72,1],[76,1],[79,1],[84,1]] });\n", "musica/marcia-dei-ribelli": "// \"Marcia dei ribelli\", brano originale per Boom (06/11/2026): sol minore, passo di marcia con le pause in levare, batteria a cassa e rullante.\nAU.registra('musica', 'marcia-dei-ribelli', { nome: { it: 'Marcia dei ribelli', en: 'Rebel march' }, emoji: '🚩', ottavo: 0.14, onda: 'square', passoAccordo: 8, accordi: 'GGDDEEFF',\n  basso: { G: [43, 55, 43, 55, 43, 55, 46, 50], D: [38, 50, 38, 50, 38, 50, 41, 45], E: [39, 51, 39, 51, 39, 51, 43, 46], F: [41, 53, 41, 53, 41, 53, 45, 48] },\n  batteria: 'K.S.K.S.KhS.KhSS',\n  melodia: [[67,1],[0,1],[67,1],[70,1],[74,2],[72,1],[70,1],[67,1],[70,1],[72,1],[74,1],[77,2],[74,2],\n    [74,1],[0,1],[74,1],[77,1],[81,2],[79,1],[77,1],[74,1],[72,1],[70,1],[69,1],[74,2],[0,2],\n    [75,1],[0,1],[75,1],[79,1],[82,2],[79,1],[75,1],[74,1],[75,1],[77,1],[79,1],[82,2],[79,2],\n    [77,1],[0,1],[77,1],[81,1],[84,2],[81,1],[77,1],[79,1],[77,1],[75,1],[74,1],[70,2],[67,2]] });\n", "musica/rombo-di-tuono": "// \"Rombo di tuono\", brano originale per Boom (06/11/2026): la minore, veloce e martellante, basso in ottave come una chitarra ritmica, batteria fitta.\nAU.registra('musica', 'rombo-di-tuono', { nome: { it: 'Rombo di tuono', en: 'Thunder roll' }, emoji: '⚡', ottavo: 0.115, onda: 'sawtooth', passoAccordo: 8, accordi: 'AAFFGGAA',\n  basso: { A: [45, 45, 57, 45, 45, 57, 45, 48], F: [41, 41, 53, 41, 41, 53, 41, 45], G: [43, 43, 55, 43, 43, 55, 43, 47] },\n  batteria: 'KhhSKhhSKhKSKhSS',\n  melodia: [[69,1],[69,1],[72,1],[74,1],[76,1],[74,1],[72,1],[69,1],[67,1],[69,1],[72,1],[69,1],[76,2],[74,2],\n    [77,1],[77,1],[81,1],[77,1],[84,2],[81,2],[79,1],[77,1],[76,1],[77,1],[81,2],[79,2],\n    [79,1],[79,1],[83,1],[79,1],[86,2],[83,2],[81,1],[79,1],[78,1],[79,1],[83,2],[86,2],\n    [81,2],[79,2],[77,2],[76,2],[74,2],[72,2],[69,2],[0,2]] });\n", "musica/trincea": "// \"Trincea\", brano originale per Boom (06/11/2026): mi minore, passo lento e cupo da marcia, note lunghe, batteria rada.\nAU.registra('musica', 'trincea', { nome: { it: 'Trincea', en: 'Trench' }, emoji: '🥁', ottavo: 0.165, onda: 'triangle', passoAccordo: 8, accordi: 'EECCDDBB',\n  basso: { E: [40, 52, 40, 52, 40, 52, 43, 47], C: [36, 48, 36, 48, 36, 48, 40, 43], D: [38, 50, 38, 50, 38, 50, 42, 45], B: [35, 47, 35, 47, 35, 47, 38, 42] },\n  batteria: 'K.h.S.h.K.h.S.hh',\n  melodia: [[64,2],[67,1],[71,1],[76,2],[74,2],[71,2],[67,1],[71,1],[69,2],[67,2],\n    [64,2],[67,1],[72,1],[76,2],[74,2],[72,2],[71,1],[69,1],[67,2],[64,2],\n    [62,2],[66,1],[69,1],[74,2],[72,2],[69,2],[66,1],[69,1],[71,2],[74,2],\n    [71,2],[74,1],[78,1],[83,2],[79,2],[76,2],[74,1],[71,1],[68,2],[0,2]] });\n", "corpo/_boss": "// Aiuto per i corpi dei boss: busto di 10 righe (20 colonne) + gambe. Non è un modulo del catalogo.\nAU.corpoBoss = function (id, nome, busto, pal, gambe, scarpe, extra) {\n  const P = Object.assign({}, AU.PAL, pal || {}); const L = gambe || 'k', K = scarpe || 'k';\n  const A = busto.concat([`......${L}${L}${L}...${L}${L}${L}.....`, `......${L}${L}${L}...${L}${L}${L}.....`, `.....${K}${K}${K}${K}...${K}${K}${K}${K}....`]);\n  const B = busto.concat([`.......${L}${L}...${L}${L}......`, `.......${L}${L}...${L}${L}......`, `......${K}${K}${K}...${K}${K}${K}.....`]);\n  AU.registra('corpo', id, { tipo: 'boss', nome, px: 4, faccia: { x: 4, y: -18.5, w: 12, h: 18.5 }, frames: [AU.sprite(A, P), AU.sprite(B, P)], extra });\n};\n", "corpo/_nemico": "// Aiuto per i corpi dei nemici: busto di 7 righe (18 colonne) + gambe in due pose. Non è un modulo del catalogo.\nAU.corpoNemico = function (id, nome, busto, pal, gambe, scarpe, opz) {\n  const P = Object.assign({}, AU.PAL, pal || {}); const L = gambe || 'k', K = scarpe || 'k';\n  const A = busto.concat([`.....${L}${L}${L}..${L}${L}${L}.....`, `.....${L}${L}${L}..${L}${L}${L}.....`, `.....${L}${L}${L}..${L}${L}${L}.....`, `....${K}${K}${K}${K}..${K}${K}${K}${K}....`]);\n  const B = busto.concat([`......${L}${L}..${L}${L}......`, `......${L}${L}..${L}${L}......`, `......${L}${L}..${L}${L}......`, `.....${K}${K}${K}..${K}${K}${K}.....`]);\n  AU.registra('corpo', id, Object.assign({ tipo: 'nemico', nome, px: 2, w: 36, h: 55, velocita: 1.1, faccia: { x: 3, y: -18.5, w: 12, h: 18.5 }, frames: [AU.sprite(A, P), AU.sprite(B, P)] }, opz || {}));\n};\n", "corpo/_protagonista": "// Aiuto per i corpi dei protagonisti: busto di 8 righe (16 colonne) + gambe in due pose. Non è un modulo del catalogo.\nAU.corpoProtagonista = function (id, genere, nome, busto, pal, gambe, scarpe, faccia) {\n  const P = Object.assign({}, AU.PAL, pal || {}); const L = gambe || 'k', K = scarpe || 'k';\n  const A = busto.concat([`......${L}...${L}.....`, `.....${L}.....${L}....`, `....${K}${K}.....${K}${K}...`]);\n  const B = busto.concat([`.......${L}${L}.......`, `.......${L}${L}.......`, `......${K}${K}${K}${K}......`]);\n  AU.registra('corpo', id, { tipo: 'protagonista', genere, nome, px: 2, altezza: 54, faccia: faccia || { x: 1.5, y: -17.5, w: 15, h: 20 }, frames: [AU.sprite(A, P), AU.sprite(B, P)] });\n};\n", "corpo/_corpoboom": "// Aiuto per i corpi disegnati apposta per Boom (più dettagliati di quelli di Corsa): righe libere, due pose complete. Non è un modulo del catalogo.\n// def: { tipo, genere, nome, px, frames: [righeA, righeB], pal, faccia (in celle), mano (in celle: dove sta la mano che regge l'arma), velocita }\nAU.corpoBoom = function (id, def) {\n  const P = Object.assign({}, AU.PAL, def.pal || {});\n  const d = Object.assign({ px: 2 }, def); delete d.pal;\n  d.frames = def.frames.map(r => AU.sprite(r, P));\n  AU.registra('corpo', id, d);\n  return AU.reg.corpo[id];\n};\n", "corpo/_elmetto": "// Aiuti per i copricapi dei corpi di Boom: si disegnano dopo il viso (extra), così stanno sopra la foto. Non è un modulo del catalogo.\n// Ogni aiuto riceve il corpo (per sapere dove sta l'ovale del viso) e restituisce la funzione extra(ctx, o, S, drawImg).\n// Dal 06/11/2026 pomeriggio (catalogo completo): cappello a tesa larga, fiocco, orecchie, occhialoni, berretto da ufficiale, visiera, cappuccio.\n(() => {\n  const ovale = (c, o) => { const px = o.px || c.px || 2, sx = o.sx || 1, sy = o.sy || 1, f = c.faccia; return { x: o.x + f.x * px * sx, y: o.y + f.y * px * sy, w: f.w * px * sx, h: f.h * px * sy }; };\n  const K = '#2b2b2b';\n  // elmetto: calotta sopra la fronte con l'orlo scuro\n  AU.elmetto = (c, col, orlo) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.36;\n    ctx.fillStyle = K; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 3, f.h * 0.4, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 1.5, f.h * 0.37, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = orlo || K; ctx.fillRect(f.x - 2.5, cy - 1.5, f.w + 5, 3); };\n  // basco: piatto, inclinato su un lato\n  AU.basco = (c, col) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.22;\n    ctx.fillStyle = K; ctx.beginPath(); ctx.ellipse(cx - f.w * 0.08, cy, f.w / 2 + 3, f.h * 0.17, -0.18, 0, 7); ctx.fill();\n    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx - f.w * 0.08, cy - 1, f.w / 2 + 1.5, f.h * 0.14, -0.18, 0, 7); ctx.fill(); };\n  // bandana: fascia sulla fronte con il nodo di lato\n  // bandana: `alt` dice a che altezza del viso sta (quota dell'ovale, 0 = cima); di base 0,3, il commando la porta più in alto, sulla fronte (Davide, 06/11/2026)\n  AU.bandana = (c, col, alt) => (ctx, o) => { const f = ovale(c, o), y = f.y + f.h * (alt == null ? 0.3 : alt);\n    ctx.fillStyle = K; ctx.fillRect(f.x - 1, y - 1, f.w + 2, f.h * 0.17 + 2);\n    ctx.fillStyle = col; ctx.fillRect(f.x, y, f.w, f.h * 0.17); ctx.fillRect(f.x + f.w - 2, y + 2, 6, 3); ctx.fillRect(f.x + f.w + 1, y + 5, 5, 3); };\n  // cappello a tesa larga (ranger, esploratore): calotta e tesa che sporge\n  AU.cappello = (c, col, nastro) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.34;\n    ctx.fillStyle = K; ctx.fillRect(f.x - 7, cy - 2, f.w + 14, 4); ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 2, f.h * 0.42, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = col; ctx.fillRect(f.x - 6, cy - 1, f.w + 12, 2); ctx.beginPath(); ctx.ellipse(cx, cy - 1, f.w / 2 + 0.5, f.h * 0.38, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = nastro || K; ctx.fillRect(f.x - 1, cy - 4, f.w + 2, 2.5); };\n  // fiocco sulla testa, di lato (ballerina)\n  AU.fiocco = (c, col) => (ctx, o) => { const f = ovale(c, o), x = f.x + f.w * 0.8, y = f.y + f.h * 0.12;\n    ctx.fillStyle = K; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9, y - 6); ctx.lineTo(x - 9, y + 5); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 9, y - 6); ctx.lineTo(x + 9, y + 5); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 7, y - 4.5); ctx.lineTo(x - 7, y + 3.5); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 7, y - 4.5); ctx.lineTo(x + 7, y + 3.5); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = K; ctx.fillRect(x - 2, y - 2, 4, 4); ctx.fillStyle = col; ctx.fillRect(x - 1, y - 1, 2, 2); };\n  // orecchie tonde ai lati della testa (orsacchiotto), con l'interno chiaro\n  AU.orecchie = (c, col, dentro) => (ctx, o) => { const f = ovale(c, o), y = f.y + f.h * 0.14;\n    for (const s of [-1, 1]) { const x = f.x + f.w / 2 + s * (f.w / 2 + 1); ctx.fillStyle = K; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 7); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.fillStyle = dentro || '#f2c7a5'; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); } };\n  // occhialoni da aviatore alzati sulla fronte, con il cinturino\n  AU.occhialoni = (c, col) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, y = f.y + f.h * 0.2;\n    ctx.fillStyle = K; ctx.fillRect(f.x - 2, y - 1, f.w + 4, 4);\n    for (const s of [-1, 1]) { const x = cx + s * f.w * 0.24; ctx.fillStyle = K; ctx.beginPath(); ctx.ellipse(x, y + 0.5, 5, 4, 0, 0, 7); ctx.fill(); ctx.fillStyle = col || '#9ad7ff'; ctx.beginPath(); ctx.ellipse(x, y + 0.5, 3.5, 2.6, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 1, 1.5, 1.5); } };\n  // berretto da ufficiale: calotta alta con la visiera e il fregio\n  AU.berrettoUfficiale = (c, col, fregio) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.33;\n    ctx.fillStyle = K; ctx.fillRect(f.x - 2, cy - 11, f.w + 4, 12); ctx.fillRect(f.x - 3, cy - 1, f.w + 6, 4);\n    ctx.fillStyle = col; ctx.fillRect(f.x - 1, cy - 10, f.w + 2, 9); ctx.fillStyle = '#1b1b1b'; ctx.fillRect(f.x - 2, cy, f.w + 4, 2); ctx.fillRect(f.x + f.w * 0.55, cy + 1, f.w * 0.5, 2);\n    ctx.fillStyle = fregio || '#F5B700'; ctx.fillRect(cx - 2, cy - 7, 4, 4); };\n  // visiera trasparente alzata sopra la fronte (assaltatore): elmetto e lastra azzurra\n  AU.visiera = (c, col) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.36;\n    ctx.fillStyle = K; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 3, f.h * 0.42, 0, Math.PI, 0); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 1.5, f.h * 0.39, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = 'rgba(154,215,255,.75)'; ctx.fillRect(f.x - 1, cy - 7, f.w + 2, 5); ctx.fillStyle = K; ctx.fillRect(f.x - 2, cy - 2.5, f.w + 4, 2.5); };\n  // cappuccio della tuta mimetica (cecchino): copre la testa fino alla fronte, con qualche ciuffo\n  AU.cappuccio = (c, col, col2) => (ctx, o) => { const f = ovale(c, o), cx = f.x + f.w / 2, cy = f.y + f.h * 0.34;\n    ctx.fillStyle = K; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 4, f.h * 0.46, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, f.w / 2 + 2.5, f.h * 0.43, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = col2 || '#3f4428'; for (let i = 0; i < 6; i++) ctx.fillRect(f.x - 3 + i * (f.w + 6) / 6, cy - 9 + (i % 2) * 4, 3, 5); ctx.fillStyle = K; ctx.fillRect(f.x - 3, cy - 1.5, f.w + 6, 2.5); };\n})();\n", "corpo/assaltatore": "// dipende: _nemico, _elmetto\n// Assaltatore: corazza blu da reparto d'assalto con lo scudo, elmetto con la visiera; non spara, corre addosso (arma: assalto).\nAU.corpoNemico('assaltatore', { it: 'Assaltatore', en: 'Stormtrooper' },\n  [\"........ss........\", \"......JJJJJJJJ....\", \".....JJjjjjjjJJ...\", \"....JJjjJJJJjjJJs.\", \"....JJjjjjjjjjJJ..\", \".....JJJJjjJJJJ...\", \"......JJJJJJJJ....\"],\n  { J: '#2f4a78', j: '#5aa9e6' }, 'J', 'k', { velocita: 1.3, arma: 'assalto' });\nAU.reg.corpo.assaltatore.extra = AU.visiera(AU.reg.corpo.assaltatore, '#2f4a78');\n", "corpo/ballerina-dinamitarda": "// dipende: _corpoboom, _elmetto\n// Ballerina dinamitarda: body nero con la cartucciera a tracolla, tutù rosa, calze bianche, scarpette rosa, fiocco. Protagonista (donna) di Boom, l'unica non in divisa (specifica §8).\n(() => {\n  const BUSTO = [\"........ss........\", \"......nnnnnnnn....\", \".....nnnAAAnnnn...\", \"....snnnnAnnnnn...\", \"....snnnnnAnnnn.s.\", \".....nnnnnnAnnns..\", \"....ppppppppppppp.\", \"...ppppppppppppppp\", \"......wwwwwwww....\"];\n  const A = BUSTO.concat([\".....www....www...\", \".....www....www...\", \"....www......www..\", \"....ppp......ppp..\", \"...pppp......pppp.\"]);\n  const B = BUSTO.concat([\".......wwwwww.....\", \".......wwwwww.....\", \".......www.www....\", \".......ppp.ppp....\", \"......pppp.pppp...\"]);\n  const c = AU.corpoBoom('ballerina-dinamitarda', { tipo: 'protagonista', genere: 'f', nome: { it: 'Ballerina dinamitarda', en: 'Dynamite ballerina' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { n: '#1b1b1b', A: '#d9a93b', p: '#f28ab2', w: '#f4f1ea', s: '#f2c7a5' } });\n  c.extra = AU.fiocco(c, '#ff5c8a');\n})();\n", "corpo/bunker": "// Bunker: blocco di cemento con la feritoia, i sacchi di sabbia e l'antenna; la faccia spunta dal portello in cima. Sta fermo sul fondo dell'arena. Attacchi: laser e missili.\n(() => {\n  const P = Object.assign({}, AU.PAL, { c: '#8f8a7a', C: '#6b665a', k: '#2b2b2b', y: '#c9b26b', Y: '#a89552', r: '#d94040', g: '#8a8f9c' });\n  const A = [\"........kkkkk.......\", \".......kccccck......\", \"..kkkkkkccccckkkkkk.\", \".kcccccccccccccccck.\", \".kcccccccccccccccck.\", \".kccckkkkkkkkkkcccck\", \".kcccccccccccccccck.\", \".kcccCcccccCcccccck.\", \"kyyyyyyyyyyyyyyyyyyk\", \"kYYYYyyyyYYYYyyyyYYk\", \"kyyyyYYYYyyyyYYYYyyk\", \"kkkkkkkkkkkkkkkkkkkk\"];\n  const B = A.map((r, i) => i === 7 ? \".kccccCcccccCcccccck\" : r);\n  AU.registra('corpo', 'bunker', { tipo: 'boss', nome: { it: 'Bunker', en: 'Bunker' }, px: 4, faccia: { x: 6.5, y: -9.5, w: 7, h: 11 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    boss: { fermo: true, attacchi: ['laser', 'missili'], vita: 1.4 },\n    // antenna con la luce e la luce rossa nella feritoia\n    extra(ctx, o, S) { const px = o.px || 4; ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x + 17 * px, o.y - 16, 2, 20); ctx.fillStyle = Math.floor(S.anim * 4) % 2 ? '#ff5c5c' : '#7a2020'; ctx.beginPath(); ctx.arc(o.x + 17 * px + 1, o.y - 18, 3, 0, 7); ctx.fill(); ctx.fillStyle = Math.floor(S.anim * 8) % 2 ? '#ff5c5c' : '#3a1010'; ctx.fillRect(o.x + 9 * px, o.y + 5 * px + 1, 8, 2); } });\n})();\n", "corpo/carro-armato": "// Carro armato: boss. La faccia spunta dal portello della torretta; il cannone guarda nella direzione di marcia.\n(() => {\n  const P = Object.assign({}, AU.PAL, { E: '#5b6b3a', F: '#3f4b28', k: '#2b2b2b', g: '#8a8f9c', y: '#e0b84a' });\n  const SCAFO = [\".......EEEEEE.......\", \"......EEEEEEEE......\", \"......EEEEEEEEFFFFFF\", \"......EEEEEEEE......\", \"..EEEEEEEEEEEEEEEE..\", \".EEEEEEEyEEEEEEEEEE.\", \".EEEEEEEEEEEEEEEEEE.\", \".FFFFFFFFFFFFFFFFFF.\", \"kkkkkkkkkkkkkkkkkkkk\"];\n  const A = SCAFO.concat([\"kgkkgkkgkkgkkgkkgkkk\", \"kgkkgkkgkkgkkgkkgkkk\", \"kkkkkkkkkkkkkkkkkkkk\", \".kkkkkkkkkkkkkkkkkk.\"]);\n  const B = SCAFO.concat([\"kkgkkgkkgkkgkkgkkgkk\", \"kkgkkgkkgkkgkkgkkgkk\", \"kkkkkkkkkkkkkkkkkkkk\", \".kkkkkkkkkkkkkkkkkk.\"]);\n  AU.registra('corpo', 'carro-armato', { tipo: 'boss', nome: { it: 'Carro armato', en: 'Tank' }, px: 4, faccia: { x: 6.5, y: -9.5, w: 8, h: 12 }, frames: [AU.sprite(A, P), AU.sprite(B, P)],\n    // fumo dallo scarico e bagliore del cannone\n    extra(ctx, o, S) { const px = o.px || 4; ctx.fillStyle = 'rgba(120,120,130,.55)'; for (let i = 0; i < 3; i++) { const k = (S.anim * 1.5 + i * 0.33) % 1; ctx.beginPath(); ctx.arc(o.x + 4 - k * 10, o.y + 7 * px - k * 22, 3 + k * 4, 0, 7); ctx.fill(); } } });\n})();\n", "corpo/cecchino": "// dipende: _nemico, _elmetto\n// Cecchino: tuta mimetica a ciuffi (ghillie), cappuccio, sta lontano e prende la mira con il mirino rosso prima di sparare (arma: cecchino).\nAU.corpoNemico('cecchino', { it: 'Cecchino', en: 'Sniper' },\n  [\"........ss........\", \"......GHGGHGGG....\", \".....GGHGGGHGGH...\", \"....HGGGGHGGGGGHs.\", \"....GGHGGGGGHGGG..\", \".....GGGHGGGGGH...\", \"......HGGGGHGG....\"],\n  { G: '#4f5a2e', H: '#7a6e3a' }, 'G', 'k', { velocita: 0.9, arma: 'cecchino' });\nAU.reg.corpo.cecchino.extra = AU.cappuccio(AU.reg.corpo.cecchino, '#4f5a2e', '#7a6e3a');\n", "corpo/commando": "// dipende: _corpoboom, _elmetto\n// Commando: bandana rossa, maglietta bianca, gilet marrone con la cartucciera, jeans e anfibi. Protagonista di Boom (stile sparatutto da sala giochi).\n(() => {\n  const BUSTO = [\"........ss........\", \"......wwwwwwww....\", \".....wwooooooww...\", \"....swwoAAAAoww...\", \"....swwooooooww.s.\", \".....wwoooooowws..\", \"......oooooooo....\", \"......jjjjjjjj....\", \"......jjjjjjjj....\"];\n  const A = BUSTO.concat([\".....jjj....jjj...\", \".....jjj....jjj...\", \"....jjj......jjj..\", \"....ooo......ooo..\", \"...oooo......oooo.\"]);\n  const B = BUSTO.concat([\".......jjjjjj.....\", \".......jjjjjj.....\", \".......jjj.jjj....\", \".......ooo.ooo....\", \"......oooo.oooo...\"]);\n  const c = AU.corpoBoom('commando', { tipo: 'protagonista', genere: 'm', nome: { it: 'Commando', en: 'Commando' }, px: 2, faccia: { x: 2.5, y: -17.5, w: 13, h: 19 }, mano: { x: 15.5, y: 4.5 },\n    frames: [A, B], pal: { w: '#f4f1ea', o: '#6b4a2a', A: '#d9a93b', j: '#2f4a78', s: '#f2c7a5' } });\n  c.extra = AU.bandana(c, '#d9534f', 0.1);   // sulla fronte, non davanti agli occhi (Davide, 06/11/2026)\n})();\n", "corpo/dirigibile": "// Dirigibile: pallone grigio-blu con le alette e la gondola appesa, dove sta la faccia al finestrino; vola lento. Attacchi: bombe dall'alto e missili.\n(() => {\n  const P = Object.assign({}, AU.PAL, { n: '#4a5568', N: '#2f3a4a', k: '#2b2b2b', g: '#8a8f9c', a: '#9ad7ff', y: '#e0b84a', r: '#d94040' });\n  const BASE = [\"....kkkkkkkkkkkk....\", \"..kknnnnnnnnnnnnkk..\", \".knnnnnnnnnnnnnnnnk.\", \"knnnnnnnrrnnnnnnnnnk\", \"knnnnnnnnnnnnnnnnnnk\", \".kNNNNNNNNNNNNNNNNk.\", \"..kkNNNNNNNNNNNNkk..\", \"....kkkk.kk.kkkk....\", \"......kkkkkkkk......\", \"......kgga
