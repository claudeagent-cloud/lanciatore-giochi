<style>
[hidden]{display:none !important}
:root{
  --sky1:#7cc4ff; --sky2:#ffc6e0; --bg:#ffc6e0; --ink:#24304d; --soft:#3a3f5e; --line:#5b6283;
  --viola:#3B1E6E; --oro:#F5B700; --violascuro:#24123F; --crema:#FFF7E0;
  --pixel:"Press Start 2P", ui-monospace, Menlo, monospace;
  --text:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg) linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%) no-repeat fixed;color:var(--ink);margin:0;overflow:hidden;font-family:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px;touch-action:none;cursor:pointer}
#stage{position:relative;width:100%;max-width:900px;margin:0 auto}
#c{display:block;width:100%;height:100%}
#mossa{position:absolute;left:8px;top:8px;font:600 14px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 #b88a00;animation:pulse 1s ease-in-out infinite}
#mossa:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
#mossa.off{background:#9aa0ad;color:#fff;box-shadow:0 4px 0 #6f7480;animation:none;font-variant-numeric:tabular-nums;cursor:default}
#mossa.off:active{transform:none;box-shadow:0 4px 0 #6f7480}
@keyframes pulse{50%{transform:scale(1.06)}}
.bar{max-width:900px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar span{font-size:13px;color:var(--soft)}
#mute,#pausa{font:600 13px var(--text);color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.bar .tasti{display:flex;gap:8px}
.diff{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.diff span{font-size:13px;color:#d9d6ee;margin-right:2px}
.diff button{font:600 13px var(--text);border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#f4f1fa;border-radius:999px;padding:7px 14px;cursor:pointer}
.diff button.on{background:var(--oro);color:var(--viola);border-color:var(--oro)}
#pausaOv{background:rgba(36,18,63,.88);color:#f4f1fa;cursor:pointer}
#riprendi{font:600 16px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:12px 32px;cursor:pointer}
#termina{font:600 14px var(--text);color:#f4f1fa;background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:9px 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (max-height:520px){ #app{gap:8px} }
.overlay{position:fixed;inset:0;z-index:20;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
/* dentro il lanciatore (o nel configuratore) c'è il tasto "Chiudi il gioco" in alto al centro, alto circa 40 px: le schermate lasciano quella fascia libera
   (06/11/2026: copriva i testi della schermata finale; regola valida per tutti i giochi) */
body.incornice .overlay{padding-top:calc(max(16px, env(safe-area-inset-top, 0px)) + 44px)}
#photo{background:rgba(36,18,63,.88);cursor:pointer;touch-action:none}
#tuto{background:rgba(36,18,63,.92);color:#f4f1fa}
.tcard{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;gap:12px}
.vs{display:flex;align-items:center;gap:14px;min-height:10px}
.vs img{width:58px;height:78px;object-fit:contain;border-radius:50%/50%;border:3px solid var(--oro);background:#fff}
.vs span{font:12px var(--pixel);color:var(--oro)}
.tcard h2{margin:0;font:12px/1.6 var(--pixel);letter-spacing:.04em;text-align:center;text-wrap:balance}
.tcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;width:100%}
.tcard li{font-size:15px;line-height:1.35;color:#d9d6ee;padding-left:14px;position:relative}
.tcard li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--oro)}
.tcard b{color:#fff}
.tcard b.pill{color:var(--viola);background:var(--oro);border-radius:999px;padding:1px 8px;white-space:nowrap}
#go{font:600 16px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;margin-top:4px}
@media (max-height:620px){ .vs img{width:42px;height:56px} .tcard{gap:8px} .tcard ul{gap:5px} .tcard li{font-size:13px} }
.polaroid{margin:0;background:#fff;padding:10px 10px 14px;border-radius:4px;width:min(70vw, 340px);transform:rotate(-3deg);box-shadow:0 18px 40px rgba(0,0,0,.45);animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.polaroid img{display:block;width:100%;max-height:56vh;object-fit:contain;background:#f4f1ea}
.polaroid figcaption{font:600 15px/1.35 var(--text);color:#2b2b2b;margin-top:10px;text-align:center;text-wrap:balance}
@keyframes drop{from{transform:translateY(-40px) rotate(-12deg) scale(.8);opacity:0}}
.tap{margin:0;font:8px var(--pixel);color:#f4f1fa;letter-spacing:.06em;line-height:1.6;text-align:center}
#end{background:var(--violascuro);color:#f4f1fa}
#fx{position:absolute;inset:0;width:100%;height:100%}
.card{position:relative;width:100%;max-width:440px;height:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center;touch-action:pan-y;padding:6px 0}
/* centrato quando c'è spazio, scorrevole dall'alto quando non c'è: così nulla resta tagliato */
.card > :first-child{margin-top:auto} .card > :last-child{margin-bottom:auto}
.finale{flex:0 1 auto;min-height:60px;max-height:28vh;width:auto;max-width:min(74vw, 300px);object-fit:contain;border-radius:12px;filter:drop-shadow(0 10px 28px rgba(245,183,0,.35));animation:pop .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-10deg);opacity:0}}
/* la schermata finale è in tre blocchi (foto, testi con il riepilogo, comandi): in verticale uno sotto l'altro, in orizzontale uno accanto all'altro */
.info,.blocco{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.info{gap:10px}
.info h2{margin:0;font:12px/1.7 var(--pixel);letter-spacing:.04em;text-wrap:balance}
.info h2 em{font-style:normal;color:var(--oro)}
.info p{margin:0;font-size:15px;color:#d9d6ee;text-wrap:balance}
#recap{margin:0;width:100%;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:5px 16px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 16px;text-align:left;font-size:14px}
@media (max-height:700px){ .card{gap:8px} .info{gap:6px} .info p{font-size:13px} #recap{font-size:13px;gap:3px 14px;padding:8px 14px} #again{padding:10px 24px} }
#recap dt{color:#d9d6ee}
#recap dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
#recap .tot{border-top:1px solid rgba(255,255,255,.15);padding-top:7px;font-size:16px;color:#fff}
#again{font:600 16px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
.arcadeu{display:flex;align-items:center;gap:12px;margin-top:8px}
.arcadeu svg{width:40px;height:40px;flex:none}
.arcadeu div{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font-size:13px;line-height:1.3;color:#d9d6ee}
.arcadeu b{display:block;color:#fff;font-weight:600}
.arcadeu .btn-oro{font-size:14px;padding:10px 18px}
/* orizzontale sul telefono (06/11/2026: la schermata finale era tagliata): foto | testi e riepilogo | comandi, su tre colonne (due senza foto),
   tutto dentro lo schermo; se proprio non ci sta, la card scorre dall'alto */
@media (orientation:landscape) and (max-height:520px){
  .card{max-width:900px}
  .info{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:10px 18px}
  #end.senzafoto .info{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .finale{width:100%;max-width:100%;max-height:calc(100vh - 110px);min-height:0}
  .info h2{font-size:10px} .info p{font-size:13px}
  #recap{font-size:12px;gap:2px 12px;padding:8px 12px} #recap .tot{font-size:14px;padding-top:5px}
  .blocco{gap:6px} #again{padding:10px 24px;font-size:15px} .cond{padding:8px 14px;font-size:13px} .arcadeu{margin-top:0;gap:8px}
  .arcadeu svg{width:34px;height:34px} .arcadeu div{gap:4px;font-size:12px} .arcadeu .btn-oro{font-size:13px;padding:8px 12px}
  .polaroid{width:min(44vw, 300px)} .polaroid img{max-height:40vh}
  #photo{flex-direction:row;flex-wrap:wrap;gap:10px 28px} #photo .tap{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){ #mossa,.polaroid,.finale{animation:none} }
/* Condividi e Salva: foto ricordo e punteggio. Secondari a contorno bianco su viola, come da brand */
.azioni{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.cond{font:600 14px var(--text);color:#f4f1fa;background:transparent;border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;touch-action:manipulation}
.cond svg{width:16px;height:16px;flex:none}
#cardOv{background:rgba(36,18,63,.95);z-index:30;gap:12px}
#cardImg{max-width:min(86vw,400px);max-height:60vh;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
#cardHint{margin:0;font:14px/1.4 var(--text);color:#d9d6ee;text-align:center;max-width:360px;text-wrap:balance}
.btn-oro{font:600 15px var(--text);color:var(--viola);background:var(--oro);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;text-decoration:none;display:inline-block}
@media (max-height:620px){ .cond{padding:8px 14px;font-size:13px} #cardImg{max-height:52vh} }
body.demo{pointer-events:none}
body.demo .bar,body.demo #mute,body.demo #pausa,body.demo .tap,body.demo .azioni{display:none}
body.demo #app{gap:0;padding-block:4px}
</style>

<script>/* ArcadeU — gioco "Corsa" (Corsa), motore v0.7 (07/11/2026, passata di sicurezza: nome della campagna della demo codificato nel link); v0.6 (07/11/2026: solo commenti, senza nomi di persone né il nome di lavoro dei giochi); v0.5 (06/11/2026 sera: ogni ostacolo è evitabile per costruzione, a terra ≤ 60 px e in volo rasoterra o ad almeno 44 px, anche per le emoji, che sono più grandi);

   v0.3: revisione bug — musica dopo il mezzo, nomi innocui in innerHTML, mossaOgni limitato, pixOk; v0.2: tasti "Condividi" per foto ricordo e punteggio)

   che si registrano con AU.registra(tipo, id, definizione). La scheda (window.ARCADEU_SCHEDA) dice
   quali usare; le foto stanno in window.ARCADEU_FOTO come data URI. Nessun riferimento a persone reali. */

  'use strict';
  const reg = { scenario: {}, ostacolo: {}, bonus: {}, mossa: {}, mezzo: {}, musica: {}, corpo: {} };

  };
  const OUT = '#2b2b2b';
  function sprite(rows, pal) {
    pal = pal || PAL;
    const h = rows.length, w = rows[0].length;

    function jump() { const p = S.player; if (p.air) return; p.vy = JUMP; p.air = true; beep(520, 0.12, 'square', 0.035, 780); }

    // ---------- Mossa ----------
    const blastDi = () => ({ vx: 160 + Math.random() * 220, vy: -(260 + Math.random() * 220), rot: 0, vr: (Math.random() < .5 ? -1 : 1) * (6 + Math.random() * 6) });

    // ---------- Ostacoli, nemici, bonus ----------

      for (const d of ostDefs) { r -= (d.peso || 1); if (r <= 0) return { def: d }; }
      return { def: ostDefs[ostDefs.length - 1] };
    }
    function creaOstacolo(x) {
      const s = scegliOstacolo();

      }
    }

    // ---------- Boss ----------
    function startBoss() {

    function bossThrow() {

    function bossHit(n, label) {
      const b = S.boss; if (!b || b.phase === 'down') return;

    // ---------- Mezzo verso il livello successivo ----------
    function startMezzo() {
      S.state = 'mezzo'; refreshMossa();
      S.obs = S.obs.filter(o => o.blast);
      const m = mezzi.length ? mezzi[(S.levels - 1) % mezzi.length] : null;

    }

        for (let i = 0; i < 3; i++) c.parts.push({ x: c.rx - 4, y: (terra ? c.ry + 26 : c.ry + 12) + (Math.random() - 0.5) * 8, vx: -120 - Math.random() * 120, vy: terra ? -20 - Math.random() * 40 : (Math.random() - 0.5) * 60, t: 0.5, col });
      }

    function playerBox() {

    function die(o) {

    let demoT = 0, demoNext = 2;
    function autopilota(dt) {

    function avviaDemo() {
      tuto.hidden = true; S.safe = Infinity; start(); S.nextBoss = Infinity; S.safe = Infinity;
      if (DEMO === 'boss') { S.nextBoss = Infinity; demoNext = 0.6; }
      if (DEMO === 'mezzo') demoNext = 0.8;
      if (DEMO === 'mossa') demoNext = 1.5;
      if (DEMO === 'frasi') demoNext = 0.5;
      if (DEMO === 'scenari') { demoNext = 2.5; S.toast = { text: nomeDi(LV()), t: 2 }; }
      if (DEMO === 'checkpoint') { const giro = i => { const c = CHECK[i % CHECK.length]; if (c && c.img) showPhoto(c); setTimeout(() => giro(i + 1), 3500); }; if (CHECK.length) setTimeout(() => giro(0), 400); }

    function update(dt) {
      S.anim += dt;

      S.nf += (night - S.nf) * Math.min(1, dt * 1.6);
      const moveClouds = S.state === 'play' ? S.speed * 0.15 * dt : 6 * dt;

        beep(880, 0.08, 'square', 0.03); setTimeout(() => beep(1320, 0.1, 'square', 0.03), 90);
        if (S.score % 500 < 100 && Math.random() < 0.6) S.toast = { text: T('cento'), t: 2.2 };
      }
      if (S.score >= S.nextCharge) { S.charges++; S.nextCharge += vars.n; S.toast = { text: T('mossaPronta', { mossa: nomeDi(mossaCorrente()) }), t: 2.2 }; }
      if (S.score !== prev) refreshMossa();
      if (S.toast) { S.toast.t -= dt; if (S.toast.t <= 0) S.toast = null; }
      if (S.move > 0) {
        S.move -= dt;
        if (S.moveDef && S.moveDef.fronte) {
          const fx = S.moveDef.fronte(1.5 - S.move, PX, W);
          for (const o of S.obs) if (o.daColpire && !o.blast && o.x < fx) { o.daColpire = false; o.blast = blastDi(); }

      if (S.say && S.say.chi === 'boss' && (!S.boss || S.boss.phase === 'down')) S.say = null;
      S.sayNext -= dt;
      if (!S.say) {
        const near = S.obs.find(o => o.kind === 'nemico' && !o.blast && !o.saidTo && o.x - PX < 300 && o.x > PX + 60);
        if (near) { near.saidTo = true; if (near.nemico.frasi.length && (DEMO === 'nemico' || Math.random() < 0.6)) say(pick(near.nemico.frasi), near); else if (Math.random() < 0.35) say(); }

      }
      const p = S.player;
      if (DEMO) autopilota(dt);
      p.duck = touch.held || keyDuck || performance.now() < duckUntil;
      if (p.air) { p.vy -= GRAV * (Lv.gravita || 1) * (p.duck ? 3 : 1) * dt; p.y += p.vy * dt; if (p.y <= 0) { p.y = 0; p.vy = 0; p.air = false; } }
      for (const m of S.marks) { m.x -= dx; if (m.x < -10) { m.x = W + Math.random() * 40; m.w = 1 + Math.random() * 4; m.d = 3 + Math.random() * 10; } }
      for (const o of S.obs) {
        if (o.blast) { o.x += o.blast.vx * dt; o.y += o.blast.vy * dt; o.blast.vy += 900 * dt; o.blast.rot += o.blast.vr * dt; }
        else o.x -= o.vx ? o.vx * dt : dx * (o.fly || 1);
        if (!o.food && !o.blast && !o.passed && o.x + o.w < PX) { o.passed = true; S.dodged++; if (o.boss) bossHit(1, 'UFF'); }
      }
      S.obs = S.obs.filter(o => !o.eaten && o.x + o.w > -30 && o.x < W + 600 && o.y < H + 80);
      if (!S.boss && S.score >= S.nextBoss) startBoss();
      if (S.boss) updateBoss(dt);
      else if (S.move <= 0) { S.nextGap -= dx / DIFF[diff].gap; if (S.nextGap <= 0) spawn(); }
      const pb = playerBox();
      for (const o of S.obs) {
        if (o.blast) continue;
        if (o.food) {
          if (overlap(pb, o, 1)) { o.eaten = true; S.bonus += o.val; S.presi[o.kind] = (S.presi[o.kind] || 0) + 1; S.pops.push({ x: o.x + o.w / 2, y: o.y, t: 0.9, text: '+' + o.val }); beep(660, 0.06, 'square', 0.04); setTimeout(() => beep(990, 0.08, 'square', 0.04), 60); }
          continue;
        }
        if (S.safe <= 0 && !CHEAT && overlap(pb, o, 5)) { die(o); return; }
      }
      if (!DEMO) for (const c of CHECK) if (S.score >= c.punti && !S.shown[c.punti]) { S.shown[c.punti] = true; if (c.img) showPhoto(c); break; }
